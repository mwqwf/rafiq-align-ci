# 🎛️ **الجولةُ الثانية من مسح معاملات الفكّ — المستشار** · 2026-10-02
# مفاتيحُ الجولتين الثانية والثالثة في `QuranRafiq` (‏فرع `claude/project-thread-svlmf2`)، على عدّاء `ubuntu-24.04-arm` المجّانيّ:
#  - `WhisperDecode.flashAttn` (‏الافتراضُ true): ذراعُ `-nfa` على النافذة والبند كاملاً — الزمنُ وتطابقُ النصّ.
#  - `WhisperDecode.finalAudioCtx`: حرسُ الحكم النهائيّ (‏`-bs 5 -et 1.8 -bo 1`) مع `-ac` تناسبيّ وبلاه على البنود ≤10ث — WER وتطابقٌ وزمن.
#  - الخيوط 2/4/6 على النافذة.
#  - `KMP_BLOCKTIME=0`: يلزمه `libomp` (‏LLVM) لا `libgomp` ⇒ تُبنى أداةٌ ثانيةٌ بـclang+libomp (‏كما يبني NDK) وتُقاس بذراعَين متداخلتَين.
# الزنادُ: دفعُ `tools/tasmi_bench/requests/decode2.json`. لا كتابةَ في R2 ولا كاش.
name: tasmi-decode2
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/tasmi_bench/requests/decode2.json"
permissions:
  contents: read
concurrency:
  group: tasmi-decode2
  cancel-in-progress: false
env:
  UA: "Mozilla/5.0 (QuranRafiq tasmi decode2)"
  WC: c4ac0012a8f5a2082dfca6aad4ddfd8b2c02b337
jobs:
  round2:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: tiny
            lang: en
            url: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev/models/whisper-tiny-ar-quran/ggml-q8_0.bin
          - model: base
            lang: ar
            url: https://github.com/mwqwf/rafiq-align-ci/releases/download/model-whisper-base-ar-quran-q51/ggml-q5_1.bin
    steps:
      - uses: actions/checkout@v4
      - name: المعمارية
        run: |
          [ "$(uname -m)" = "aarch64" ] || { echo "⛔ ليس arm64"; exit 1; }
          echo "nproc=$(nproc)"
      - name: مفاتيحُ القراءة من R2 (‏لا كتابة)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 - <<'PY2'
          import json, os
          c = json.load(open("secure/r2_credentials.json"))
          keys = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"], "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          env = open(os.environ["GITHUB_ENV"], "a")
          for k, v in keys.items():
              print("::add-mask::" + v); env.write(k + "=" + v + chr(10))
          env.close()
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: العدّة
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build ffmpeg clang libomp-dev > /dev/null
          pip install -q numpy soundfile scipy boto3
      - name: بناءُ أداتَين — gcc/libgomp (‏المرجع) وclang/libomp (‏لـKMP_BLOCKTIME)
        run: |
          set -o pipefail
          git clone -q --filter=blob:none --no-checkout https://github.com/ggml-org/whisper.cpp wc
          git -C wc fetch -q --depth 1 origin "$WC" && git -C wc checkout -q --detach FETCH_HEAD
          cmake -S wc -B b_i8 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH="armv8.6-a+dotprod+i8mm" > /dev/null
          cmake --build b_i8 --target whisper-cli -j"$(nproc)" > /dev/null
          cmake -S wc -B b_omp -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DGGML_OPENMP=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH="armv8.6-a+dotprod+i8mm" > /dev/null
          cmake --build b_omp --target whisper-cli -j"$(nproc)" > /dev/null
          echo "gcc: $(ldd b_i8/bin/whisper-cli | grep -i omp || echo 'لا omp مشترك')"; echo "clang: $(ldd b_omp/bin/whisper-cli | grep -i omp || echo 'لا omp مشترك')"
      - name: النموذج
        run: |
          curl -sSL -f --retry 4 --retry-delay 5 --retry-all-errors -A "$UA" -o tools/tasmi_bench/work_model.bin "${{ matrix.url }}"
          sha256sum tools/tasmi_bench/work_model.bin
      - name: المجموعات (نظيفٌ ومضجَّج)
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          python fetch_audio.py
          python augment.py --src-dir work/wav --dest-dir work/wavn --only noise-fan-5
          echo "wav=$(ls work/wav | wc -l) wavn=$(ls work/wavn | wc -l)"
      - name: (أ) النافذة 3.6ث — flashAttn والخيوط 2/4/6
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          R=requests/decode2.json
          L=$(python -c "import json;r=json.load(open('$R'));print(r.get('limit_${{ matrix.model }}', r.get('limit',0)))")
          for s in wav wavn; do
            EXTRA=""; [ "$s" = wavn ] && EXTRA="--clean-src work/wav"
            python live_sweep.py --cli ../../b_i8/bin/whisper-cli --model work_model.bin --lang "${{ matrix.lang }}" --src work/$s $EXTRA --threads 2 --limit "$L" \
              --pads --mins --thread-arms 4 6 --extra-arm "nfa=-nfa" --extra-arm "nfa_t4=-nfa -t 4" \
              --md work/r2win_${{ matrix.model }}_$s.md --json work/r2win_${{ matrix.model }}_$s.json | tail -12
            cat work/r2win_${{ matrix.model }}_$s.md >> "$GITHUB_STEP_SUMMARY"
          done
      - name: (ب) البندُ كاملاً ≤10ث — حرسُ الحكم النهائيّ مع audio_ctx وبلاه · وflashAttn
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          R=requests/decode2.json
          L=$(python -c "import json;r=json.load(open('$R'));print(r.get('final_limit_${{ matrix.model }}', r.get('final_limit',0)))")
          for s in wav wavn; do
            python live_sweep.py --cli ../../b_i8/bin/whisper-cli --model work_model.bin --lang "${{ matrix.lang }}" --src work/$s --threads 4 --limit "$L" --window 0 --max-dur 10 \
              --pads --mins --extra-arm "guard=-bs 5 -et 1.8 -bo 1" --extra-arm "guard_ac1=-bs 5 -et 1.8 -bo 1 {ac:1}" \
              --extra-arm "guard_ac2=-bs 5 -et 1.8 -bo 1 {ac:2}" --extra-arm "guard_nfa=-bs 5 -et 1.8 -bo 1 -nfa" --extra-arm "nfa=-nfa" \
              --md work/r2final_${{ matrix.model }}_$s.md --json work/r2final_${{ matrix.model }}_$s.json | tail -12
            cat work/r2final_${{ matrix.model }}_$s.md >> "$GITHUB_STEP_SUMMARY"
          done
      - name: (ج) KMP_BLOCKTIME=0 — أداةُ clang/libomp · ذراعان متداخلتان
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          R=requests/decode2.json
          L=$(python -c "import json;r=json.load(open('$R'));print(r.get('kmp_limit_${{ matrix.model }}', r.get('kmp_limit',0)))")
          python live_sweep.py --cli ../../b_omp/bin/whisper-cli --model work_model.bin --lang "${{ matrix.lang }}" --src work/wav --threads 2 --limit "$L" \
            --pads --mins --extra-arm "kmp0=env:KMP_BLOCKTIME=0" --extra-arm "t4=-t 4" --extra-arm "kmp0_t4=-t 4 env:KMP_BLOCKTIME=0" \
            --md work/r2kmp_${{ matrix.model }}.md --json work/r2kmp_${{ matrix.model }}.json | tail -10
          cat work/r2kmp_${{ matrix.model }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tasmi-decode2-${{ matrix.model }}
          path: tools/tasmi_bench/work/r2*.*
          retention-days: 14
          if-no-files-found: ignore
