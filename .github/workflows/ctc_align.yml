name: rafiq-ctc-align

run-name: >-
  ctc ${{ inputs.reciter }}/${{ inputs.riwaya }}
  ${{ inputs.probe_surahs && format('· سبر {0}', inputs.probe_surahs) || format('· أجزاء={0}', inputs.parts) }}

# ⭐ محرّكُ CTC القسريّ (`tools/alignment_v3/ctc_seg.py` · خطة 2026-09-18).
#    الأجزاءُ لا تكتب إلى الدلو بحال؛ الرفعُ في الخاتم وحده بحرّاس `stage_upload.py`
#    كاملةً (114/114 بصمة · مداخل · HIGH 50%)، ثمّ البوّابةُ الصوتيّة المعتادة.
# 💰 مستودعٌ عامّ + عدّاد ubuntu-latest القياسيّ ⇒ دقائقُ مجّانيّة. والكاشُ والمخرَجات
#    لمستودعٍ عامّ لا تُحسب على حصّة مدفوعة. (إذنُ المالك المالي 2026-09-18.)
on:
  workflow_dispatch:
    inputs:
      reciter: {description: "معرّف القارئ", required: true}
      riwaya: {description: "الرواية", default: "hafs"}
      url_template: {description: "قالب الرابط، فيه {surah:03d}", required: true}
      parts: {description: "عدد الأجزاء المتوازية 2..16", default: "8"}
      probe_surahs: {description: "سبرٌ بلا رفع: سورٌ مثل 2,78,108 (فارغ = القارئ كاملاً)", default: ""}
      reason: {description: "سبب الإطلاق", default: ""}

concurrency:
  group: rafiq-ctc-${{ inputs.riwaya }}-${{ inputs.reciter }}
  cancel-in-progress: false

env:
  PY: "3.11"
  ALIGN_ENGINE: ctc
  HF_HOME: ${{ github.workspace }}/.hf

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          if [ -n "${{ inputs.probe_surahs }}" ]; then n=1; else n=${{ inputs.parts }}; fi
          [ "$n" -ge 1 ] && [ "$n" -le 16 ] || { echo "⛔ parts=$n"; exit 1; }
          echo "matrix=$(python3 -c "import json,sys;print(json.dumps(list(range(int(sys.argv[1])))))" "$n")" >> "$GITHUB_OUTPUT"

  part:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PY }}"}
      - name: الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet transformers ctc-segmentation numpy
      - name: كاش النموذج
        uses: actions/cache@v4
        with:
          path: .hf
          key: ctc-model-jonatasgrosman-xlsr53-ar-v1
      - name: سورُ هذا الجزء
        id: pack
        run: |
          if [ -n "${{ inputs.probe_surahs }}" ]; then p="${{ inputs.probe_surahs }}"
          else p="$(python tools/ci_fleet/make_bins.py ${{ inputs.parts }} --pick ${{ matrix.part }}:$(( ${{ matrix.part }} + 1 )))"; fi
          [ -n "$p" ] || { echo "⛔ حزمة فارغة"; exit 1; }
          echo "surahs=$p" >> "$GITHUB_OUTPUT"; echo "السور: $p"
      - name: المحاذاة (⛔ بلا رفع)
        run: |
          set -o pipefail
          sudo chmod 755 /root   # batch_run يقرأ /root/skip_surahs.txt اختيارياً
          mkdir -p logs
          /usr/bin/time -v python tools/alignment/batch_run.py --reciter "${{ inputs.reciter }}" \
            --riwaya "${{ inputs.riwaya }}" --base "${{ inputs.url_template }}" \
            --surahs "${{ steps.pack.outputs.surahs }}" 2>&1 | tee logs/part${{ matrix.part }}.log
          ls tools/alignment/work/batch_${{ inputs.reciter }}/s*.json | wc -l
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctc-${{ inputs.reciter }}-p${{ matrix.part }}
          path: |
            tools/alignment/work/batch_${{ inputs.reciter }}/s*.json
            logs/**
          retention-days: 7

  assemble:
    needs: part
    if: ${{ always() && inputs.probe_surahs == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PY }}"}
      - run: python -m pip install --quiet boto3 numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: ctc-${{ inputs.reciter }}-p*
          path: dl
      - name: جمع ملفات السور
        run: |
          sudo chmod 755 /root
          d=tools/alignment/work/batch_${{ inputs.reciter }}; mkdir -p "$d" logs-copy
          find dl -name 's*.json' -exec cp {} "$d"/ \;
          cat dl/*/logs/*.log > logs-copy/parts.log 2>/dev/null || true
          echo "ملفات السور: $(ls "$d"/s*.json | wc -l)/114"
      - name: اعتماد R2
        env: {R2_CREDENTIALS_JSON: "${{ secrets.R2_CREDENTIALS_JSON }}"}
        run: mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
      - name: بناء الفهرس ورفعه إلى المسرح بحرّاسه
        run: |
          set -o pipefail
          rid="${{ inputs.reciter }}"; rw="${{ inputs.riwaya }}"
          python tools/alignment/batch_run.py --reciter "$rid" --riwaya "$rw" \
            --base "${{ inputs.url_template }}" --surahs 1-114 2>&1 | tee logs-copy/$rid.log
          have=$(ls tools/alignment/work/batch_$rid/s*.json | wc -l)
          exp=1-114
          if [ "$have" -lt 114 ]; then
            [ "$have" -ge 110 ] || { echo "🛑 نقصٌ كبير $have/114 — لا رفع"; exit 1; }
            exp="1-$have"
          fi
          STAGE_LOW_HIGH=1 python tools/ci_fleet/stage_upload.py --reciter "$rid" --riwaya "$rw" \
            --expect-surahs "$exp" --log logs-copy/$rid.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctc-${{ inputs.reciter }}-index
          path: |
            tools/alignment/work/timings_*.jz
            logs-copy/**
          retention-days: 7
