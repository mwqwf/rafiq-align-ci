# 🪵 **قراءةُ سجلِّ شوطٍ بالوكالة** — لأنّ مضيفَ السجلّات محجوبٌ عن صندوق الوكيل.
#
# ⛔ **لِمَ وُجد — بسببٍ مقيسٍ ثلاثَ مرّاتٍ اليومَ** (2026-09-13): كلُّ محاولةٍ لقراءة سجلّ
# شوطٍ من صندوق الوكيل تردّ
# `curl: (56) CONNECT tunnel failed, response 403` (‏`results-receiver.actions.githubusercontent.com`)
# و`get_job_logs` عبر MCP يردّ `HTTP 404`. ⇒ **فكلُّ فشلٍ لا يُودِع أثرَه بنفسِه يُقرأ ظنّاً**،
# وقد ضاع بذلك سببُ سقوطِ خطوةِ نشرٍ مرّتين (`34756599249` و`34756706486`).
#
# ⭐ **والعدّاءُ يقرأ ما لا أقرأ**: `GITHUB_TOKEN` فيه `actions: read`، فيسحب السجلَّ ويُودع
# **ذيلَه** ملفّاً في `results/` — فيُقرأ بـ`git pull`. ⚖️ وثمنُه ثوانٍ.
# ⛔ **ولا يُودَع السجلُّ كاملاً**: قد يكون ضخماً وفيه نصوصُ تلاواتٍ لا حاجةَ إليها ⇒ ذيلٌ محدود.
name: job-log

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "رقمُ الشوط الذي يُقرأ سجلُّه"
        required: true
      tail:
        description: "كم سطراً من آخر كلِّ وظيفة (الافتراضُ 120)"
        required: false
        default: "120"
  push:
    paths:
      - "tools/tasmi_bench/requests/joblog.json"

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: الطلب
        env:
          I_RUN_ID: ${{ github.event.inputs.run_id }}
          I_TAIL: ${{ github.event.inputs.tail }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys
          req = {}
          p = "tools/tasmi_bench/requests/joblog.json"
          if os.path.exists(p):
              req = json.load(open(p, encoding="utf-8"))
          def pick(k, d=""):
              v = (os.environ.get("I_" + k.upper()) or "").strip()
              return v or str(req.get(k) or "").strip() or d
          rid, tail = pick("run_id"), pick("tail", "120")
          # ⛔ رقمٌ غيرُ رقمٍ يسقط هنا لا بعد نداءِ شبكة.
          if not rid.isdigit() or not tail.isdigit():
              sys.exit(f"⛔ طلبٌ ناقص: run_id={rid!r} · tail={tail!r}")
          print(f"RUN_ID={rid}")
          print(f"TAIL={tail}")
          PY
          cat "$GITHUB_ENV"

      - name: سحبُ السجلّ وإيداعُ ذيله
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          API="https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID"
          # ⛔ والحالةُ تُقرأ أوّلاً: سجلُّ شوطٍ لم ينتهِ **ناقصٌ** فلا يُقرأ حكماً.
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API" -o run.json
          # ⛔⛔ **ولا heredoc داخلَ كتلةٍ أو قوسَين — بسببٍ مقيسٍ اليومَ:** YAML يُزيل الإزاحةَ
          # **الأساسَ** وحدَها، فأيُّ إزاحةٍ زائدةٍ تمنع إغلاقَ الـheredoc فيبتلع ما بعده
          # (‏ومنه توجيهُ الأثر إلى ملفّه) ⇒ سقط شوطان بلا أثرٍ يُقرأ (‏34756599249 · 34756706486
          # · 34757235622). ⇒ **تُكتب سطورُ بايثون في ملفٍّ مستقلٍّ ثمّ تُقرأ بـ`cat`.**
          python3 - <<'PY' > head.md
          import json
          d = json.load(open("run.json", encoding="utf-8"))
          print(f"- الشوطُ المقروء: `{d['name']}` · {d['status']} · **{d.get('conclusion')}**")
          print(f"- حالتُه عند السحب: `{d['status']}` · خلاصتُه: **{d.get('conclusion')}**")
          PY
          cat head.md
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$API/logs" -o logs.zip
          mkdir -p logdir && (cd logdir && unzip -o -q ../logs.zip)
          mkdir -p results
          OUT="results/joblog_${RUN_ID}.md"
          {
            echo "# 🪵 ذيلُ سجلِّ الشوط $RUN_ID"
            echo
            echo "- سُحب في: $(date -u +%FT%TZ) · بالشوط ${{ github.run_id }} · ذيلٌ $TAIL سطراً لكلّ ملفّ"
            cat head.md
            echo "- ⛔ هذا **أثرٌ تشخيصيّ** لا قياس: لا رقمَ منه يدخل اللوحة."
            echo
            for f in $(find logdir -name '*.txt' | sort); do
              echo "## \`${f#logdir/}\`"
              echo '```'
              tail -n "$TAIL" "$f"
              echo '```'
              echo
            done
          } > "$OUT"
          # ⛔ وسقفٌ للحجم: سجلٌّ ضخمٌ يُثقل المستودعَ على كلّ مَن يستنسخه.
          if [ "$(wc -c < "$OUT")" -gt 400000 ]; then
            head -c 400000 "$OUT" > "$OUT.cut" && mv "$OUT.cut" "$OUT"
            echo >> "$OUT"; echo '⚠️ **قُطع عند 400 كيلوبايت.**' >> "$OUT"
          fi
          cp "$OUT" results/LATEST_joblog.md
          git config user.name "rafiq-ci"
          git config user.email "ci@users.noreply.github.com"
          git add "$OUT" results/LATEST_joblog.md
          git commit -q -m "results(job-log): ذيلُ سجلِّ الشوط $RUN_ID" || { echo "لا تغيير"; exit 0; }
          for i in 1 2 3; do
            git fetch -q origin main && git merge -q --no-edit origin/main && git push -q origin HEAD:main && { echo "✅ أُودع $OUT"; exit 0; }
            echo "↻ محاولةٌ $i"; sleep 5
          done
          echo "⛔ تعذّر الدفع"; exit 1
