name: rafiq-audio-qa

# تدقيقٌ صوتيّ متوازٍ لفهارس `timings-staging/` — عشرون وظيفة بدل خادمٍ واحد.
#
# ⛔ سببه مقيس (github-7e): التفريغ الصوتي عمليةُ whisper واحدة على خادمٍ واحد
#    (~10 دقائق للفهرس بالعيّنة الممثِّلة) ⇒ **107 فهارس ≈ 18 ساعة**. وبعشرين
#    وظيفة تصير **≈ساعتين**. والعنق ينتقل من التدقيق إلى الإنتاج حيث يجب.
#
# ⛔ لا يعمل تلقائياً: `workflow_dispatch` وحده — لا push ولا cron.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "بادئة المفاتيح المراد تدقيقها"
        default: "timings-staging/"
      limit:
        description: "أقصى عدد فهارس في هذه الدفعة (وهو أيضاً عدد الوظائف، ≤20)"
        default: "20"
      only:
        description: "مفتاحٌ بعينه (يتجاوز البادئة والحدّ) — للتشخيص"
        default: ""

# ⛔ مجموعةٌ خاصة به: لا يزاحم موجات الفهرسة منطقياً — ويبقى التزاحم على
#    **سقف الحساب (20 مهمة متزامنة)** وهو ما لا تحلّه مجموعةٌ ولا إعداد.
concurrency:
  group: rafiq-audio-qa
  cancel-in-progress: false

env:
  PY: "3.11"
  # ⛔ مثبَّت كما في align.yml: ثنائيٌّ مختلفٌ بين دفعتين = حكمان لا يُقارَنان.
  WHISPER_REF: eacbd8234c6654cdbf2c377f72b2106875479bdc

jobs:
  # ── المصفوفة من الدلو نفسه لا من قائمةٍ مكتوبة بيد ─────────────────────
  # ⛔ الترتيب `LastModified` تصاعدياً — نفس ترتيب المدقّقين (اتفاق 7e)، فلا
  #    يختلف ترتيبان بين مرحلتين من الطابور الواحد.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet boto3
      - id: gen
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          PREFIX: ${{ github.event.inputs.prefix }}
          LIMIT: ${{ github.event.inputs.limit }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, boto3
          # ⛔ `only` يُنتج **كائنات** كالمسار العام لا نصوصاً: كان يطبع قائمة
          #    نصوص بينما الوظيفة تقرأ `matrix.key` ⇒ مصفوفةٌ لا تُقرأ.
          #    ويقبل عدة مفاتيح مفصولةً بفاصلة أو مسافة (دفعةٌ موجَّهة).
          only = os.environ.get("ONLY", "").strip()
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          # ⛔ من له حكمٌ سلفاً يُستثنى (وإلا أُعيد الحكم على المحكوم بينما
          #    ينتظر خمسةٌ وثلاثون): قِيس فعلاً — دفعةٌ من أربعة أعادت الحكم على
          #    اثنين محكومَين. والاستثناء **بالبصمة في اسم المفتاح** لا بالقارئ،
          #    فنسخةٌ جديدة من القارئ نفسه تُحكم من جديد كما يجب.
          judged = set()
          if not only:
              for p2 in s3.get_paginator("list_objects_v2").paginate(
                      Bucket=c["bucket"], Prefix="state/"):
                  for o2 in p2.get("Contents", []):
                      n = o2["Key"].split("/")[-1]
                      if n.endswith(".audio-ci.json"):
                          judged.add(n[: -len(".audio-ci.json")])
          ks = []
          if only:
              for k in [x for x in only.replace(",", " ").split() if x]:
                  ks.append((s3.head_object(Bucket=c["bucket"], Key=k)["LastModified"], k))
          else:
              for p in s3.get_paginator("list_objects_v2").paginate(
                      Bucket=c["bucket"], Prefix=os.environ["PREFIX"]):
                  for o in p.get("Contents", []):
                      if o["Key"].endswith(".jz") and o["Key"].replace("/", "_") not in judged:
                          ks.append((o["LastModified"], o["Key"]))
          ks.sort()
          # ⛔ **المفاتيح وحدها في المصفوفة، والبصمة تُحسب في الوظيفة.**
          #    سببه مقيس: GitHub حجب مخرَج الخطوة كلَّه بـ«may contain secret»
          #    حين حملت المصفوفةُ بصماتٍ ست عشرية، فخرجت مصفوفةٌ فارغة و**نجحت
          #    `prepare` بلا وظائف** — خضرةٌ كاذبة أخرى. والوظيفة تنزّل الفهرس
          #    أصلاً، فحسابُ البصمة عندها لا يكلّف شيئاً ولا يمرّ بمخرَجٍ يُحجب.
          import gzip, io as _io
          out, skipped = [], []
          for _, k in ks:
              if not only and len(out) >= int(os.environ["LIMIT"]):
                  break
              # ⛔ الجزئي يُستثنى: عيّنةٌ ممثِّلة على فهرسٍ ناقص تقيس ما ليس
              #    الفهرس، والحكم عليه حكمٌ على شيءٍ لم يكتمل بعد.
              if ".partial" in k and not only:
                  skipped.append((k, "جزئي")); continue
              b = s3.get_object(Bucket=c["bucket"], Key=k)["Body"].read()
              d = json.load(gzip.open(_io.BytesIO(b), "rt", encoding="utf-8"))
              # ⛔ والجيل الأول يُستثنى (أمر github-f4): فهرسٌ بلا وسم صقل
              #    سيُعاد إنتاجه بالوصفة الجديدة على كل حال، فتدقيقه الصوتي
              #    **إنفاقُ خانةٍ من العشرين على حكمٍ يسقط بالإعادة**.
              if (not d.get("refineVersion") or d.get("refineVersion") == "none") and not only:
                  skipped.append((k, "جيلٌ أول (لا وسم صقل)")); continue
              out.append(k)
          for k, why in skipped:
              print(f"⏭ {k} — {why}", file=sys.stderr)
          print(f"matrix={json.dumps(out)}")
          PY

  audit:
    needs: prepare
    runs-on: ubuntu-latest
    # ⛔ 45 لا 350 (‏github-7e): تعليقُ تنزيلٍ يبتلع الست ساعات **ويشغل خانةً
    #    من العشرين طوال المدّة** — وقد وقع عنده فعلاً: 54 دقيقة بلا حركة على
    #    نافذةٍ واحدة. والمهلة القصيرة تُظهر التعليق بدل أن تموّله.
    # ⚠️ ورُفعت من 45 إلى 120 (‏أمر github-f4 على قياس 7e): **6.3ث للنافذة
    #    × 605 نافذة ≈ 64 دقيقة معالجةً صافية** على نواة، فـ45 كانت تقتل عملاً
    #    سليماً. و120 تبقى قصيرةً بما يكفي لإظهار التعليق (السقف 360).
    timeout-minutes: 120
    strategy:
      fail-fast: false          # حكمُ فهرسٍ لا يُسقط أحكام إخوته
      max-parallel: 20          # سقف الحساب — تصريحٌ لا اكتشافٌ عند الاصطفاف
      matrix:
        key: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: أدوات النظام
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # ⛔ لا بناء whisper: `pywhispercpp` عجلةٌ مبنيّة تحمّل ملف ggml نفسه،
          #    وقد طابق 7e مخرجاتها بمخرجات الخادم حرفاً بحرف. وفّر 10–20 دقيقة
          #    **في كل وظيفة من العشرين**، وأبقى الأرقام قابلةً للمقارنة بأرقام الليلة.
          python -m pip install --quiet pywhispercpp soundfile numpy boto3

      # ⛔ النموذج يُخبَّأ: 41م.ب × 20 وظيفة في كل دفعة تنزيلٌ بلا طائل.
      - name: كاش النموذج
        id: modelcache
        uses: actions/cache@v4
        with:
          path: assets-archive/ggml
          key: qa-model-q8-v1
        # المسار نفسه يُمرَّر بـQA_MODEL فلا يعيد السكربت تنزيله

      # ⛔ ومخبأ **الصوت** أنفع من مخبأ النموذج بعشرات الأضعاف (‏github-7e):
      #    النموذج 41م.ب مرّةً، والعيّنة الواحدة تسحب عشرين سورة قد تبلغ
      #    2–3 ج.ب فيها البقرة وحدها ~196م.ب. والمفتاح **بالقارئ** لأن فهارس
      #    القارئ الواحد تتشارك ملفاته، ولا يُشارك قارئٌ آخر شيئاً.
      - name: كاش صوت القارئ
        uses: actions/cache@v4
        with:
          path: qa_audio
          # المفتاح مشتقٌّ من المفتاح كاملاً، والاسترجاع الجزئي بالبادئة
          # نفسها ⇒ فهارس القارئ الواحد (بصمات مختلفة) تتشارك مخبأه.
          key: qa-audio-${{ matrix.key }}
          restore-keys: |
            qa-audio-${{ matrix.key }}
            qa-audio-timings-staging/

      - name: الاعتماد والنموذج
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY'
          import json, os, boto3
          dst = "assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin"
          if os.path.exists(dst) and os.path.getsize(dst) > 10_000_000:
              print("النموذج من الكاش:", os.path.getsize(dst) // 1024 // 1024, "م.ب")
          else:
              c = json.load(open("secure/r2_credentials.json"))
              s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                                aws_access_key_id=c["accessKeyId"],
                                aws_secret_access_key=c["secretAccessKey"], region_name="auto")
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              s3.download_file(c["bucket"], "models/whisper-tiny-ar-quran/ggml-q8_0.bin", dst)
              print("النموذج نُزّل:", os.path.getsize(dst) // 1024 // 1024, "م.ب")
          PY

      # ⛔ برهان استيراد **قبل** التنزيل والنموذج — وهو الدرس نفسه للمرة
      #    الثالثة: `ci_run.py` يستورد `run.py` وما تستورده هي، ونسختُ الملف
      #    وحده فسقطت الوظائف السبع كلها بـ`No module named 'run'` بعد أن
      #    نزّلت النموذج والصوت. **الحزمة تُنسخ كاملةً، والاستيراد يُبرهن أولاً.**
      - name: برهان أداة التدقيق (⛔ قبل أي تنزيل)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools/index_qa")
          import ci_run  # noqa: F401
          print("✅ ci_run وتبعياتها تُستورَد")
          PY

      - name: تدقيق ${{ matrix.key }}
        env:
          KEY: ${{ matrix.key }}
          # ⛔ النموذج من المخبأ لا من الدلو: السكربت لا يعيد التنزيل إن وُجد.
          QA_MODEL: ${{ github.workspace }}/assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin
          QA_CACHE: ${{ github.workspace }}/qa_audio
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          # النصّ المرجعي من المستودع نفسه: `core/quran/.../text_<riwaya>.jz`
          # مودَعٌ هنا (4.4م.ب)، ولا نسخة له على الدلو — فالاستنساخ يكفي ولا
          # يُنتظر رفعٌ (‏github-7e).
          # ⛔ والخروج غير الصفري على المرفوض **مقصود**: يُرى الرفض في اللوحة
          #    بلا قراءة سجلّ، ولذلك `fail-fast: false` أعلاه ضرورةٌ لا زينة.
          # البصمة تُحسب هنا من الكائن نفسه ثم تُمرَّر — فيبقى `--expect-sha`
          # حارساً ضد تبدُّل المحتوى تحت المفتاح أثناء التدقيق (درس github-7e).
          SHA=$(python - <<'PY'
          import hashlib, json, os, boto3
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          b = s3.get_object(Bucket=c["bucket"], Key=os.environ["KEY"])["Body"].read()
          print(hashlib.sha256(b).hexdigest())
          PY
          )
          echo "البصمة: ${SHA:0:8}…"
          # ⛔ **بذرة عيّنة مستقلة** (‏`--seed-salt ci`) — وهذا أهمّ علمٍ هنا:
          #    كانت البذرة تُشتقّ من هوية القارئ وحدها، فأسحبُ **الحدود المئتين
          #    نفسها** التي يسحبها 7e ⇒ اتفاقُنا **إعادةُ قياسٍ لا شهادتان**،
          #    يكشف التقلّب ولا يكشف خطأ المنهج البتّة (محرّكٌ واحد برّأ 211
          #    مطلعاً بالغلط، وتكراره ألفاً يُعيد البراءة ألفاً). فبعيّنةٍ
          #    مستقلّة يصير الاتفاق شهادةً، **ويصير الاختلاف خبراً**: عيّنتان
          #    مستقلّتان تختلفان ⇒ الفهرس متفاوت، وذاك ما تُخفيه المشتركة.
          # ⛔ ويُمرَّر **إن كانت الأداة تقبله**: أداةُ 7e تتطوّر، وعلمٌ لا تعرفه
          #    يُسقط الوظيفة — فنسأل `--help` بدل أن نفترض.
          # ⛔ أداة 7e تقرأ الاعتماد من **متغيّرات البيئة** لا من ملفٍ في
          #    `secure/` (رسالتها الصريحة: «ينقص من البيئة: R2_ENDPOINT …»).
          #    فتُشتقّ منه هنا **داخل الخطوة** بلا طباعة — والملف يبقى للأدوات
          #    التي تقرؤه (‏stage_upload وغيرها). ولا نفترض شكلاً: نُصدّر
          #    الأربعة كما تسمّيها هي.
          eval "$(python - <<'PY'
          import json, shlex
          c = json.load(open("secure/r2_credentials.json"))
          m = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"],
               "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          for k, v in m.items():
              print(f"export {k}={shlex.quote(v)}")
          PY
          )"
          EXTRA=""
          H="$(python tools/index_qa/ci_run.py --help 2>&1 || true)"
          case "$H" in *--seed-salt*) EXTRA="$EXTRA --seed-salt ci";; esac
          case "$H" in *--kind*)      EXTRA="$EXTRA --kind audio";; esac
          case "$H" in *--source*)    EXTRA="$EXTRA --source ci";; esac
          case "$H" in *--run-id*)    EXTRA="$EXTRA --run-id ${{ github.run_id }}";; esac
          echo "أعلامٌ إضافية مدعومة:${EXTRA:- (لا شيء)}"
          python tools/index_qa/ci_run.py --key "$KEY" --expect-sha "$SHA"             --clusters 20 --per-cluster 10 --out-prefix state-ci $EXTRA
          # ⛔ `--out-prefix state-ci`: ‏`ci_run` و`promote_watch` كانا يكتبان
          #    **الاسم نفسه** `state/<key>.json` فتصادما، وكتب أحدهما فوق حكم
          #    الآخر (‏bd، `11e4b17`). فيكتب هنا في بادئةٍ معزولة، ثم يُنقل
          #    الحكم **كاملاً بعيّنته** إلى `state/<key>.audio-ci.json` —
          #    اسمٌ لا ينازعه أحد. **ولا يُمسّ ملف bd بحال.**

      # ⛔ الحكم **كاملاً بعيّنته** لا مؤشّراً إليه (أمر github-f4 بعد بلاغ bd):
      #    ملفُ نسبٍ يشير إلى `state/<key>.json` كان يشير — بعد التصادم — إلى
      #    **حكم bd البنيوي** لا إلى حكمي، فأعلن «‏kind=audio» على حكمٍ ليس
      #    صوتياً. ⇒ **من يدّعي حكماً يحمله في جوفه**، والمؤشّر يكذب متى تحرّك
      #    ما يشير إليه.
      - name: حكم الصوت كاملاً إلى state/<key>.audio-ci.json
        if: always()
        env:
          KEY: ${{ matrix.key }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os, boto3
          key = os.environ["KEY"]; flat = key.replace("/", "_")
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          src = f"state-ci/{flat}.json"
          try:
              doc = json.loads(s3.get_object(Bucket=c["bucket"], Key=src)["Body"].read())
          except Exception as ex:
              print(f"⚠️ لا حكم في {src} ({ex}) — لا يُكتب ادّعاءٌ بلا حكم")
              raise SystemExit(0)
          # ⛔ النسب يُضاف إلى الحكم نفسه لا في ملفٍ ثانٍ: ملفان يفترقان.
          doc["provenance"] = {
              "kind": "audio", "source": "ci", "run_id": os.environ["RUN_ID"],
              "tool": "tools/index_qa/ci_run.py",
              "tool_sha": hashlib.sha256(open("tools/index_qa/ci_run.py", "rb").read()).hexdigest(),
              "run_sha": hashlib.sha256(open("tools/index_qa/run.py", "rb").read()).hexdigest(),
          }
          out = f"state/{flat}.audio-ci.json"
          assert out.startswith("state/") and out.endswith(".audio-ci.json"), out
          s3.put_object(Bucket=c["bucket"], Key=out,
                        Body=json.dumps(doc, ensure_ascii=False, indent=1).encode(),
                        ContentType="application/json")
          has = "sample" in doc and ("verdict" in doc or "severeRate" in doc)
          print(f"✅ {out} · فيه عيّنةٌ وحكم: {has}")
          PY

      - name: السجل مخرَجاً
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ strategy.job-index }}
          path: tools/index_qa/state/**
          if-no-files-found: warn
          retention-days: 7
