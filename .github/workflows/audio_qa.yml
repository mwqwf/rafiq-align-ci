name: rafiq-audio-qa

# تدقيقٌ صوتيّ متوازٍ لفهارس `timings-staging/` — عشرون وظيفة بدل خادمٍ واحد.
#
# ⛔ سببه مقيس (github-7e): التفريغ الصوتي عمليةُ whisper واحدة على خادمٍ واحد
#    (~10 دقائق للفهرس بالعيّنة الممثِّلة) ⇒ **107 فهارس ≈ 18 ساعة**. وبعشرين
#    وظيفة تصير **≈ساعتين**. والعنق ينتقل من التدقيق إلى الإنتاج حيث يجب.
#
# ⛔ لا يعمل تلقائياً: `workflow_dispatch` وحده — لا push ولا cron.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "بادئة المفاتيح المراد تدقيقها"
        default: "timings-staging/"
      limit:
        description: "أقصى عدد فهارس في هذه الدفعة (وهو أيضاً عدد الوظائف، ≤20)"
        default: "20"
      only:
        description: "مفتاحٌ بعينه (يتجاوز البادئة والحدّ) — للتشخيص"
        default: ""

# ⛔ مجموعةٌ خاصة به: لا يزاحم موجات الفهرسة منطقياً — ويبقى التزاحم على
#    **سقف الحساب (20 مهمة متزامنة)** وهو ما لا تحلّه مجموعةٌ ولا إعداد.
concurrency:
  group: rafiq-audio-qa
  cancel-in-progress: false

env:
  PY: "3.11"
  # ⛔ مثبَّت كما في align.yml: ثنائيٌّ مختلفٌ بين دفعتين = حكمان لا يُقارَنان.
  WHISPER_REF: eacbd8234c6654cdbf2c377f72b2106875479bdc

jobs:
  # ── المصفوفة من الدلو نفسه لا من قائمةٍ مكتوبة بيد ─────────────────────
  # ⛔ الترتيب `LastModified` تصاعدياً — نفس ترتيب المدقّقين (اتفاق 7e)، فلا
  #    يختلف ترتيبان بين مرحلتين من الطابور الواحد.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet boto3
      - id: gen
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          PREFIX: ${{ github.event.inputs.prefix }}
          LIMIT: ${{ github.event.inputs.limit }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, boto3
          only = os.environ.get("ONLY", "").strip()
          if only:
              print(f"matrix={json.dumps([only])}")
              raise SystemExit
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          ks = []
          for p in s3.get_paginator("list_objects_v2").paginate(
                  Bucket=c["bucket"], Prefix=os.environ["PREFIX"]):
              for o in p.get("Contents", []):
                  if o["Key"].endswith(".jz"):
                      ks.append((o["LastModified"], o["Key"]))
          ks.sort()
          # ⛔ البصمة الكاملة تُحسب هنا لا في الوظيفة: `--expect-sha` يرفض
          #    التدقيق إن تغيّر المحتوى تحت المفتاح — و7e دقّق ليلتها نسخةً
          #    ناقصة استُبدلت بعدها. والفهرس ~86ك.ب فحسابها كلها زهيد.
          import gzip, hashlib, io as _io
          out, skipped = [], []
          for _, k in ks:
              if len(out) >= int(os.environ["LIMIT"]):
                  break
              # ⛔ الجزئي يُستثنى: عيّنةٌ ممثِّلة على فهرسٍ ناقص تقيس ما ليس
              #    الفهرس، والحكم عليه حكمٌ على شيءٍ لم يكتمل بعد.
              if ".partial" in k:
                  skipped.append((k, "جزئي")); continue
              b = s3.get_object(Bucket=c["bucket"], Key=k)["Body"].read()
              d = json.load(gzip.open(_io.BytesIO(b), "rt", encoding="utf-8"))
              # ⛔ والجيل الأول يُستثنى (أمر github-f4): فهرسٌ بلا وسم صقل
              #    سيُعاد إنتاجه بالوصفة الجديدة على كل حال، فتدقيقه الصوتي
              #    **إنفاقُ خانةٍ من العشرين على حكمٍ يسقط بالإعادة**.
              if not d.get("refineVersion") or d.get("refineVersion") == "none":
                  skipped.append((k, "جيلٌ أول (لا وسم صقل)")); continue
              out.append({"key": k, "sha": hashlib.sha256(b).hexdigest()})
          for k, why in skipped:
              print(f"⏭ {k} — {why}", file=sys.stderr)
          print(f"matrix={json.dumps(out)}")
          PY

  audit:
    needs: prepare
    runs-on: ubuntu-latest
    # ⛔ 45 لا 350 (‏github-7e): تعليقُ تنزيلٍ يبتلع الست ساعات **ويشغل خانةً
    #    من العشرين طوال المدّة** — وقد وقع عنده فعلاً: 54 دقيقة بلا حركة على
    #    نافذةٍ واحدة. والمهلة القصيرة تُظهر التعليق بدل أن تموّله.
    timeout-minutes: 45
    strategy:
      fail-fast: false          # حكمُ فهرسٍ لا يُسقط أحكام إخوته
      max-parallel: 20          # سقف الحساب — تصريحٌ لا اكتشافٌ عند الاصطفاف
      matrix:
        item: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: أدوات النظام
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # ⛔ لا بناء whisper: `pywhispercpp` عجلةٌ مبنيّة تحمّل ملف ggml نفسه،
          #    وقد طابق 7e مخرجاتها بمخرجات الخادم حرفاً بحرف. وفّر 10–20 دقيقة
          #    **في كل وظيفة من العشرين**، وأبقى الأرقام قابلةً للمقارنة بأرقام الليلة.
          python -m pip install --quiet pywhispercpp soundfile numpy boto3

      # ⛔ النموذج يُخبَّأ: 41م.ب × 20 وظيفة في كل دفعة تنزيلٌ بلا طائل.
      - name: كاش النموذج
        id: modelcache
        uses: actions/cache@v4
        with:
          path: assets-archive/ggml
          key: qa-model-q8-v1
        # المسار نفسه يُمرَّر بـQA_MODEL فلا يعيد السكربت تنزيله

      # ⛔ ومخبأ **الصوت** أنفع من مخبأ النموذج بعشرات الأضعاف (‏github-7e):
      #    النموذج 41م.ب مرّةً، والعيّنة الواحدة تسحب عشرين سورة قد تبلغ
      #    2–3 ج.ب فيها البقرة وحدها ~196م.ب. والمفتاح **بالقارئ** لأن فهارس
      #    القارئ الواحد تتشارك ملفاته، ولا يُشارك قارئٌ آخر شيئاً.
      - name: كاش صوت القارئ
        uses: actions/cache@v4
        with:
          path: qa_audio
          # المفتاح مشتقٌّ من المفتاح كاملاً، والاسترجاع الجزئي بالبادئة
          # نفسها ⇒ فهارس القارئ الواحد (بصمات مختلفة) تتشارك مخبأه.
          key: qa-audio-${{ matrix.item.key }}
          restore-keys: |
            qa-audio-${{ matrix.item.key }}
            qa-audio-timings-staging/

      - name: الاعتماد والنموذج
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY'
          import json, os, boto3
          dst = "assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin"
          if os.path.exists(dst) and os.path.getsize(dst) > 10_000_000:
              print("النموذج من الكاش:", os.path.getsize(dst) // 1024 // 1024, "م.ب")
          else:
              c = json.load(open("secure/r2_credentials.json"))
              s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                                aws_access_key_id=c["accessKeyId"],
                                aws_secret_access_key=c["secretAccessKey"], region_name="auto")
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              s3.download_file(c["bucket"], "models/whisper-tiny-ar-quran/ggml-q8_0.bin", dst)
              print("النموذج نُزّل:", os.path.getsize(dst) // 1024 // 1024, "م.ب")
          PY

      - name: تدقيق ${{ matrix.item.key }}
        env:
          # ⛔ النموذج من المخبأ لا من الدلو: السكربت لا يعيد التنزيل إن وُجد.
          QA_MODEL: ${{ github.workspace }}/assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin
          QA_CACHE: ${{ github.workspace }}/qa_audio
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          # النصّ المرجعي من المستودع نفسه: `core/quran/.../text_<riwaya>.jz`
          # مودَعٌ هنا (4.4م.ب)، ولا نسخة له على الدلو — فالاستنساخ يكفي ولا
          # يُنتظر رفعٌ (‏github-7e).
          # ⛔ والخروج غير الصفري على المرفوض **مقصود**: يُرى الرفض في اللوحة
          #    بلا قراءة سجلّ، ولذلك `fail-fast: false` أعلاه ضرورةٌ لا زينة.
          python tools/index_qa/ci_run.py             --key "${{ matrix.item.key }}"             --expect-sha "${{ matrix.item.sha }}"             --clusters 20 --per-cluster 10
          # ⛔ ولا `--out-prefix`: البادئة `state/` هي الافتراض بأمر المشرف
          #    ليقرأها راصد f5 مباشرةً — وتمريرُها هنا يعيد اختراع اصطلاحٍ قائم.

      - name: السجل مخرَجاً
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ strategy.job-index }}
          path: tools/index_qa/state/**
          if-no-files-found: warn
          retention-days: 7
