name: rafiq-source-quran-probe
run-name: source-probe Janaini Qalun · ctc=${{ inputs.ctc }}
on:
  workflow_dispatch:
    inputs:
      kalbani_plan: {description: "Explicit read-only verified Kalbani float32 context plan", default: ""}
      kurdi_neighborhood: {description: "Read Kurdi original ayahs81..85 instead of Janaini alternatives", default: "false"}
      ctc: {description: "Run pinned Quran CTC after native source inspection", default: "false"}
      omit_basmala: {description: "Native-proven surah numbers without basmala", default: ""}
      output: {description: "Read-only result filename in ops/out", default: "janaini-source-native-20261001.json"}
permissions:
  contents: read
jobs:
  probe:
    if: ${{ inputs.kalbani_plan == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      CTC_THREADS: "2"
      CTC_INT8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Check syntax before installing anything
        run: python -m py_compile tools/index_qa/source_quran_probe.py
      - name: Native decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet numpy soundfile boto3 pywhispercpp
      - name: Restore tiny model without writing cache
        uses: actions/cache/restore@v4
        with:
          path: assets-archive/ggml
          key: qa-model-q8-v1
      - name: Pinned CTC dependencies
        if: ${{ inputs.ctc == 'true' }}
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet "numpy<2" transformers ctc-segmentation
      - name: Read-only source probe
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          KURDI_NEIGHBORHOOD: ${{ inputs.kurdi_neighborhood }}
          DO_CTC: ${{ inputs.ctc }}
          OMIT_BASMALA: ${{ inputs.omit_basmala }}
          RESULT_NAME: ${{ inputs.output }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, boto3
          model = pathlib.Path("assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin")
          if not model.exists():
              c=json.loads(os.environ["R2_CREDENTIALS_JSON"])
              cl=boto3.client("s3",endpoint_url=c["endpoint"],aws_access_key_id=c["accessKeyId"],
                              aws_secret_access_key=c["secretAccessKey"],region_name="auto")
              model.parent.mkdir(parents=True,exist_ok=True)
              cl.download_file(c["bucket"],"models/whisper-tiny-ar-quran/ggml-q8_0.bin",str(model))
          filename=os.environ["RESULT_NAME"]
          if pathlib.Path(filename).name != filename or not filename.endswith(".json"):
              raise ValueError("invalid result name")
          cmd=["python","tools/index_qa/source_quran_probe.py","--out","ops/out/"+filename,"--model",str(model)]
          if os.environ["KURDI_NEIGHBORHOOD"]=="true":
              cmd+=["--kurdi-neighborhood"]
          if os.environ["DO_CTC"]=="true":
              cmd+=["--ctc"]
          omitted=os.environ["OMIT_BASMALA"].replace(","," ").split()
          if omitted:
              if any(x not in ("33","55") for x in omitted):
                  raise ValueError("unexpected surah")
              cmd+=["--omit-basmala",*omitted]
          subprocess.run(cmd,check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janaini-source-proof
          path: ops/out/${{ inputs.output }}
          if-no-files-found: warn
          retention-days: 7

  kalbani-prepare:
    if: ${{ inputs.kalbani_plan != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      surahs: ${{ steps.plan.outputs.surahs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          PLAN: ${{ inputs.kalbani_plan }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          p = pathlib.Path(os.environ["PLAN"])
          if p.parent != pathlib.Path("ops/source-repair") or not p.name.startswith("kalbani-float-generic-plan-") or p.suffix != ".json":
              raise ValueError("Invalid known-source plan")
          d = json.loads(p.read_text())
          ss = [x["surah"] for x in d["surahs"]]
          if len(ss) != len(set(ss)) or not 1 <= len(ss) <= 14:
              raise ValueError("Invalid bounded surah population")
          print("surahs=" + json.dumps(ss))
          PY
  kalbani-generic:
    name: known original Kalbani generic surah ${{ matrix.surah }}
    needs: kalbani-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        surah: ${{ fromJSON(needs.kalbani-prepare.outputs.surahs) }}
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      CTC_THREADS: '2'
      CTC_INT8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Bounded binary dependencies
        timeout-minutes: 10
        run: |
          python tools/ci_fleet/install_qa_ffmpeg.py
          python -m pip install --only-binary=:all: --timeout 60 --retries 2 --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --only-binary=:all: --timeout 60 --retries 2 'numpy<2' 'transformers<5' boto3 soundfile
          python -m pip install --timeout 60 --retries 2 ctc-segmentation
      - uses: actions/cache/restore@v4
        with:
          path: .hf
          key: ctc-model-jonatasgrosman-xlsr53-ar-v1
      - name: Actual immutable source measurements only
        env:
          PLAN: ${{ inputs.kalbani_plan }}
          SURAH: ${{ matrix.surah }}
        run: python tools/index_qa/ci_kalbani_generic.py --plan "$PLAN" --surah "$SURAH"
