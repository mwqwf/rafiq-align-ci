name: rafiq-diagnosis

# **توليدُ تشخيص الكتالوج** (`catalog/diagnosis/<riwaya>/<reciter>.json`) على
# عدّاء GitHub — لا على شبكة المالك.
#
# ⛔ سببُه (‏أمر المشرف، 2026-09-05): حارسُ الترقية يقف عند «تشخيصُ الكتالوج
#    يصف فهرساً آخر»، وتعليقُه يَعِد بأن «القيدَ يُرفع من تلقائه» — والتابعُ
#    الذي يفي بهذا الوعد (`mirror_follower`) **لا يعمل**، فالقيدُ لا يُرفع
#    أبداً ويقف كلُّ مرشَّحٍ تشخيصُه بائت. (‏وقف `m_abdulkareem_warsh` دورةً
#    كاملة.) ⇒ **الوعدُ يحتاج منفّذاً، والمنفّذُ هنا.**
#
# ⛔ ولا يُولَّد محلياً بحال: `backfill_diagnosis` **ينزّل الصوت** لقياس المدد
#    (114 ملفاً للقارئ)، وشبكةُ المالك ضعيفةٌ متقطّعة — قاعدةٌ ثابتة.
on:
  push:
    paths:
      - tools/cloud/backfill_diagnosis.py
      - .github/workflows/diagnosis.yml
  pull_request:
    paths:
      - tools/cloud/backfill_diagnosis.py
      - .github/workflows/diagnosis.yml
  workflow_dispatch:
    inputs:
      only:
        description: "riwaya/reciter — أو فارغٌ لكل من له فهرس"
        default: ""
      threads:
        description: "خيوطُ التنزيل على العدّاء"
        default: "8"
      force:
        description: "true = يُعاد التوليدُ ولو كان التشخيصُ المحفوظُ يصف الفهرسَ المنشورَ الحالي (الأصل: لا إعادة)"
        default: "false"

# (2026-10-23 · تسريع) تشغيلتان لقارئٍ واحد معاً تُنزّلان 114 ملفاً مرّتين؛ فتُرتَّبان: الثانيةُ تنتظر الأولى ثمّ تجد التشخيصَ
# كُتب فتُتخطّى في دقيقة (‏انظر خطوة «هل التشخيصُ يصف الفهرس الحيّ»). ⛔ بلا cancel-in-progress: الأولى لا تُقتل.
concurrency:
  group: rafiq-diagnosis-${{ github.event.inputs.only || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python tools/cloud/backfill_diagnosis.py --self-test

  diagnose:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet boto3 requests

      - name: اعتماد R2
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          # ⛔ عبر متغيّر بيئة لا سطر أمر: سطرُ الأمر يظهر في السجل العام.
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json

      - name: هل التشخيصُ يصف الفهرسَ الحيّ؟
        id: fresh
        env:
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # ⭐ (2026-10-23 · تسريع) التشخيصُ يصف **الفهرسَ المنشور** (‏`indexETag` = بصمةُ timings/<رواية>/<قارئ>.jz) ولا يتبدّل بتبدّل
          #    مرشّحٍ في المسرح؛ والترقيةُ تقابله بالبصمة نفسِها (‏`promote.truncation`). فإن طابق المحفوظُ بصمةَ المنشور الحاليّة لكلّ فهرسٍ
          #    يسمّيه ONLY فتوليدُه ثانيةً (114 تنزيلاً ≈ 11 د) يُنتج الملفَّ ذاتَه: قِيس في يوم 52 تشغيلةً (‏a_alqrafi وحدَه 15 مرّة).
          #    ⛔ غيابُ التشخيص أو اختلافُ البصمة أو أيُّ خطأٍ ⇒ يُولَّد كما كان. force=true يُعيد التوليد.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, boto3
          only = os.environ.get("ONLY", "").strip()
          fresh = False
          try:
              if only and os.environ.get("FORCE") != "true":
                  c = json.load(open("secure/r2_credentials.json"))
                  s3 = boto3.client("s3", endpoint_url=c["endpoint"], aws_access_key_id=c["accessKeyId"],
                                    aws_secret_access_key=c["secretAccessKey"], region_name="auto")
                  keys = [o["Key"] for pg in s3.get_paginator("list_objects_v2").paginate(Bucket=c["bucket"], Prefix="timings/")
                          for o in pg.get("Contents", []) if o["Key"].endswith(".jz") and only in o["Key"]]
                  ok = bool(keys)
                  for k in keys:
                      riw, rid = k.split("/")[1], k.split("/")[2][:-3]
                      et = s3.head_object(Bucket=c["bucket"], Key=k)["ETag"].strip('"')
                      d = json.loads(s3.get_object(Bucket=c["bucket"], Key=f"catalog/diagnosis/{riw}/{rid}.json")["Body"].read())
                      if not et or str(d.get("indexETag") or "").strip('"') != et:
                          ok = False
                          print(f"↻ {k}: التشخيصُ لا يصف البصمةَ الحالية", file=sys.stderr)
                          break
                  fresh = ok
          except Exception as e:
              print(f"↻ تعذّر الفحص ({str(e)[:80]}) ⇒ يُولَّد", file=sys.stderr)
          if fresh:
              print(f"⏭ التشخيصُ المحفوظُ لـ{only} يصف الفهرسَ المنشورَ الحاليّ — لا إعادة", file=sys.stderr)
          print("fresh=" + ("true" if fresh else "false"))
          PY

      - name: كاش ffmpeg (بديلُ apt المعلَّق · لا يغيّر النسخة)
        if: steps.fresh.outputs.fresh != 'true'
        uses: actions/cache@v4
        with:
          path: .qa-tools/apt-tree
          key: qa-ffmpeg-apt-tree-v1-${{ hashFiles('tools/ci_fleet/install_qa_ffmpeg.py') }}

      - name: ffmpeg
        if: steps.fresh.outputs.fresh != 'true'
        run: QA_FFMPEG_APT_ONLY=1 python tools/ci_fleet/install_qa_ffmpeg.py

      - name: توليدُ التشخيص
        if: steps.fresh.outputs.fresh != 'true'
        env:
          ONLY: ${{ github.event.inputs.only }}
          THREADS: ${{ github.event.inputs.threads }}
        run: |
          # `mirror_follower` يستورد نفسه من `/root` (‏منفذُ كتابةٍ واحدٌ للآلي
          # وللرجعي — صيغتان تدّعيان أنهما واحدة تفترقان عند أوّل تعديل).
          sudo mkdir -p /root && sudo ln -sfn "$GITHUB_WORKSPACE/tools/cloud" /root/cloud
          for f in mirror_follower.py backfill_diagnosis.py probe_surah_duration.py; do
            sudo cp "tools/cloud/$f" "/root/$f"
          done
          # ⛔ النسخُ بـsudo يجعل الملفّات ملكَ root و`/root` مغلقاً على
          #    `runner` ⇒ `Permission denied` عند التشغيل. فالإذنُ يُفتح صراحةً
          #    بعد النسخ — وإلا فالوظيفةُ تبني كلَّ شيءٍ ثم تسقط عند أوّل سطر.
          sudo chmod 755 /root
          sudo chmod 644 /root/mirror_follower.py /root/backfill_diagnosis.py /root/probe_surah_duration.py
          export PYTHONPATH="/root:$GITHUB_WORKSPACE/tools/alignment:$GITHUB_WORKSPACE/tools/index_qa"
          # ⛔ `GITHUB_ENV` يسري على **الخطوات التالية** لا على الخطوة نفسها —
          #    فالكتابةُ فيه هنا تترك الأداةَ بلا اعتماد وتسقط بـ«R2_BUCKET غير
          #    مضبوط» بعد أن بنت كلَّ شيء. فالتصديرُ في الصَّدَفة نفسِها.
          python - <<'PY' > /tmp/r2env.sh
          import json
          c = json.load(open("secure/r2_credentials.json"))
          for k, v in (("R2_BUCKET", c["bucket"]), ("R2_ENDPOINT", c["endpoint"]),
                       ("R2_ACCESS_KEY_ID", c["accessKeyId"]),
                       ("R2_SECRET_ACCESS_KEY", c["secretAccessKey"]),
                       ("AWS_ACCESS_KEY_ID", c["accessKeyId"]),
                       ("AWS_SECRET_ACCESS_KEY", c["secretAccessKey"])):
              print(f"export {k}='{v}'")
          PY
          . /tmp/r2env.sh && rm -f /tmp/r2env.sh
          echo "الاعتمادُ في الصَّدَفة (لا في سطر الأمر ولا في السجل)"
          ARG=""
          [ -n "$ONLY" ] && ARG="--only $ONLY"
          python /root/backfill_diagnosis.py --self-test
          python /root/backfill_diagnosis.py --threads "${THREADS:-8}" $ARG
