name: rafiq-heard-repeat-shadow

run-name: heard-repeat-shadow ${{ inputs.reason || github.sha }}

# 🔎 **ظلُّ الباب الثالث في بوّابة السماع** (‏آيةٌ مكرّرةٌ مشهودة · `tools/index_qa/heard_gate.py` · إذنُ المالك 2026-11-07 20:40Z).
# ⚖️ **وضعُ التقرير وحدَه:** `contents: read`، بلا سرٍّ ولا دلوٍ ولا state ولا ترقية ولا كتابةٍ في timings/. المرشّحاتُ تُقرأ من الدلو العامّ (‏r2.dev) قراءةً.
#    لكلّ (مرشّح، سورة): خريطةُ العامّة ثمّ، للآيات المنحرفة ذواتِ التكرار المقيس وحدَها، شاهدُ Whisper وإحصاءُ النافذة (‏`heard_repeat_probe.py`)،
#    ثمّ تقريرٌ (‏`heard_repeat_shadow.py`) يسرد كلَّ آيةٍ انقلبت نحو القبول بشاهدها ويفحص ألّا يتغيّر شيءٌ سواها.
#    `controls` قرّاءُ ضبطٍ يُعالَجون بالطريقة نفسِها: المطلوبُ ألّا ينقلب عندهم شيءٌ إلا في آيةٍ مكرّرةٍ مشهودة.
# 💰 مستودعٌ عامّ + عدّاد ubuntu-latest القياسيّ ⇒ دقائقُ مجّانيّة.
on:
  # ⭐ الإطلاقُ قبل الدمج: `workflow_dispatch` لا يرى ملفَّ سير عملٍ غيرَ موجودٍ في main (‏HTTP 404)، فيُطلَق من **دفعِ ملفّ المعاملات**
  #    `ops/shadow/heard_repeat_shadow.json` إلى فرع هذا الطلب وحدَه (‏لا يعمل في main ولا في فرعٍ آخر). يُحذف هذا الزنادُ مع ملفّه بعد الدمج.
  push:
    branches: [claude/heard-repeat-witness]
    paths: [ops/shadow/heard_repeat_shadow.json]
  workflow_dispatch:
    inputs:
      items: {description: "مرشّحاتُ القائمة: «مفتاح@سورة+سورة» مفصولةً بـ; (‏مثل timings-staging/hafs/saad.d7a45c48.jz@36+38)", default: ""}
      controls: {description: "قرّاءُ الضبط (‏بالصيغة نفسِها): يُفرض عليهم الباب في التقرير وحدَه", default: ""}
      reason: {description: "سببُ الإطلاق", default: ""}

permissions:
  contents: read

concurrency:
  group: rafiq-heard-repeat-shadow-${{ github.run_id }}
  cancel-in-progress: false

env:
  PY: "3.11"
  HF_HOME: ${{ github.workspace }}/.hf
  R2_PUBLIC: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      idx: ${{ steps.plan.outputs.idx }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PY }}"}
      - name: الاختبارات أوّلاً
        run: python -m unittest tools/index_qa/test_heard_gate.py tools/index_qa/test_heard_dual.py tools/index_qa/test_heard_repeat.py
      - name: الخطّةُ (‏قراءةٌ من الدلو العامّ) وتنزيلُ المرشّحات
        id: plan
        env: {ITEMS: "${{ inputs.items }}", CONTROLS: "${{ inputs.controls }}", EVENT: "${{ github.event_name }}"}
        run: |
          python - <<'PY'
          import gzip, hashlib, json, os, sys, urllib.request
          sys.stdout.reconfigure(encoding="utf-8")
          sys.path.insert(0, "tools/index_qa")
          import heard_gate as H
          base = os.environ["R2_PUBLIC"]
          os.makedirs("cands", exist_ok=True)
          plan = []
          items, controls = os.environ["ITEMS"], os.environ["CONTROLS"]
          if os.environ["EVENT"] == "push":
              cfg = json.load(open("ops/shadow/heard_repeat_shadow.json", encoding="utf-8"))
              items, controls = cfg["items"], cfg.get("controls", "")
          for forced, raw in ((False, items), (True, controls)):
              for ent in [x.strip() for x in raw.split(";") if x.strip()]:
                  src, _, ss = ent.partition("@")
                  if not (src.startswith("timings-staging/") or src.startswith("timings/")) or src.count("/") != 2 or not ss:
                      sys.exit(f"⛔ بندٌ غيرُ صالح: {ent!r}")
                  flat = src.replace("/", "_")
                  if not os.path.exists("cands/" + flat):
                      # r2.dev يردّ 403 على ترويسة Python-urllib الافتراضية؛ فترويسةٌ صريحة (‏قراءةٌ عامّةٌ بلا سرّ)
                      req = urllib.request.Request(base + "/" + src, headers={"User-Agent": "curl/8.5.0"})
                      body = urllib.request.urlopen(req, timeout=120).read()
                      open("cands/" + flat, "wb").write(body)
                  body = open("cands/" + flat, "rb").read()
                  sha = hashlib.sha256(body).hexdigest()
                  idx = json.loads(gzip.decompress(body))
                  cs = H.by_surah(idx["entries"])
                  for s in [int(x) for x in ss.split("+")]:
                      refs = {v[2] for v in cs[s].values()}
                      if len(refs) != 1:
                          sys.exit(f"⛔ {src} س{s}: أكثرُ من ملفٍّ {sorted(refs)[:2]}")
                      plan.append({"src": src, "s": s, "ref": refs.pop(), "sha": sha, "forced": forced,
                                   "ends": {str(a): [v[0], v[1]] for a, v in cs[s].items()}})
          for i, p in enumerate(plan):
              print(i, p["src"], "س%d" % p["s"], "ضبط" if p["forced"] else "قائمة", len(p["ends"]), "آية", p["ref"])
          json.dump(plan, open("plan.json", "w"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("idx=" + json.dumps(list(range(len(plan)))) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rshadow-plan-${{ github.run_id }}
          path: |
            plan.json
            cands/
          retention-days: 7

  probe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJson(needs.plan.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PY }}"}
      - name: كاش ffmpeg (بديلُ apt المعلَّق · لا يغيّر النسخة)
        uses: actions/cache@v4
        with:
          path: .qa-tools/apt-tree
          key: qa-ffmpeg-apt-tree-v1-${{ hashFiles('tools/ci_fleet/install_qa_ffmpeg.py') }}
      - name: الأدوات
        run: |
          QA_FFMPEG_APT_ONLY=1 python tools/ci_fleet/install_qa_ffmpeg.py
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install --quiet "numpy==1.26.4" transformers==5.22.1 ctc-segmentation==1.7.5 rapidfuzz==3.14.6 \
            faster-whisper==1.1.1 "requests==2.32.3"
      - name: كاش النموذج العامّ
        uses: actions/cache@v4
        with:
          path: .hf
          key: ctc-model-jonatasgrosman-xlsr53-ar-v1
      - name: كاشُ Whisper
        uses: actions/cache@v4
        with:
          path: .hf
          key: heard-repeat-whisper-medium-small-fw111-v1
      - uses: actions/download-artifact@v4
        with: {name: "rshadow-plan-${{ github.run_id }}"}
      - name: القياسُ (G ثمّ R ثمّ الشاهد · بلا رفع)
        env: {K: "${{ matrix.k }}"}
        run: |
          python -m unittest tools/alignment_v3/test_ctc_heard_map.py tools/index_qa/test_heard_dual.py tools/index_qa/test_heard_repeat.py
          python - <<'PY'
          import json, os
          it = json.load(open("plan.json"))[int(os.environ["K"])]
          d = "hg/" + it["src"].replace("/", "_")
          os.makedirs(d, exist_ok=True)
          json.dump({"sha": it["sha"], "ends": it["ends"]}, open(f"{d}/cand_{it['s']}.json", "w"))
          open("item.env", "w").write(f"D={d}\nS={it['s']}\nU={it['ref']}\nRIW={it['src'].split('/')[1]}\n")
          PY
          set -a; . ./item.env; set +a
          mkdir -p "$D"
          CTC_INT8=0 python tools/alignment_v3/ctc_heard_map.py --url "$U" --surah "$S" --riwaya "$RIW" --out-dir "$D" --probe \
            --report "$D/heard_s$(printf %03d $S).txt" < /dev/null > /dev/null 2> "$D/err_$S.txt" \
            || { echo "⚠️ خريطة العامّة أخفقت"; tail -8 "$D/err_$S.txt"; exit 1; }
          python tools/index_qa/heard_repeat_probe.py --url "$U" --surah "$S" --riwaya "$RIW" --dir "$D" --cand "$D/cand_$S.json" < /dev/null \
            || { echo "⚠️ الباب الثالث أخفق"; tail -8 "$D/rw/err_$S.txt" 2>/dev/null; exit 1; }
          rm -f "$D"/*.mp3 "$D"/*.wav "$D"/rw/*.mp3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rshadow-${{ github.run_id }}-${{ matrix.k }}
          path: hg/
          retention-days: 7

  report:
    needs: [plan, probe]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PY }}"}
      - uses: actions/download-artifact@v4
        with: {name: "rshadow-plan-${{ github.run_id }}", path: planned}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rshadow-${{ github.run_id }}-[0-9]*
          path: shards
          merge-multiple: true
      - name: التقرير (⛔ بلا كتابةٍ في state)
        run: |
          set -o pipefail
          python tools/index_qa/heard_repeat_shadow.py --plan planned/plan.json --shards shards --cands planned/cands \
            --out shadow_report.json | tee shadow.log
          { echo '### ظلُّ الباب الثالث (تقرير)'; echo '```'; cat shadow.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rshadow-report-${{ github.run_id }}
          path: |
            shadow_report.json
            shadow.log
          retention-days: 14
