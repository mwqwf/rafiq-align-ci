name: rafiq-restore

run-name: استرجاعُ آياتٍ مفقودةٍ من فهارسَ منشورة — بلا جهاز المالك

# ⛔⛔ **لماذا وظيفةٌ مستقلّةٌ عن النبّاض؟** `keepalive.yml` يحكم ويرقّي
#    **لغير المنشورين قصداً** («التحسينُ الهامشيُّ لا يُقدَّم على قارئٍ لا فهرسَ
#    له البتّة»). وذلك صوابٌ حين يكون التحسينُ هامشيّاً — **وليس هامشيّاً** أن
#    يجد القارئُ سورةَ الأنعام **سبعين آيةً من مئةٍ وخمسٍ وستّين**. فهذه الحلقةُ
#    للمنشورين وحدَهم، وشرطُها **زيادةُ آياتٍ حقيقيّةٍ مقيسة**.
#
# ⛔ والطريقةُ كلُّها قياسٌ لا تخمين، وقد نُفّذت بيدٍ ليلةَ 2026-09-13 فأثمرت
#    **383 آيةً منشورة** وتسعةَ قرّاءٍ كاملين. والتفصيلُ في `restore_loop.py`.
#
# ⛔ **ولا ترقيةَ إلا بحكمٍ كامل**: القرارُ كلُّه لـ`promote.py` بحُرّاسه —
#    لا تُخفَّض عتبةٌ ولا يُعطَّل حارس، والتجميدُ يُرفع **للحظةِ ترقيةٍ متحقَّقة**
#    بسببٍ مكتوبٍ يُسجَّل، ثمّ يعود بالترقية نفسِها.

on:
  # ⛔⛔ **بابُ إطلاقٍ للوكيل السحابيّ** (قِيس 2026-09-13): جلسةُ كلود السحابيّة
  #    **تقرأ** جيت هَب ولا تملك إدلاءَ `workflow_dispatch` (‏ترجع `403 Resource
  #    not accessible by integration`) — **لكنّها تملك الدفع**. فدفعةُ سطرٍ إلى
  #    `ops/kick.txt` تُشعل الحلقةَ فوراً، وبها يقدر الوكيلُ على تحريك العمل
  #    بلا صلاحيةٍ زائدة. ⛔ والمصفاةُ بالمسار: لا يُشعلها إيداعٌ في غيرِه.
  push:
    paths: ["ops/kick.txt"]
  schedule:
    # ⛔ كلَّ ثلاث ساعات لا كلَّ ساعة: إعادةُ محاذاةِ سورةٍ طويلةٍ تأخذ نحوَ
    #    ساعة، والنبضُ الأكثفُ يُنتج مرشَّحاتٍ أسرعَ ممّا تُحكَم فيزدحم الطابور.
    # ⛔ كلَّ ساعةٍ بدل كلِّ ثلاث — أمرُ المالك 2026-09-20 بالإسراع، والكلفةُ
    #    صفرٌ في مستودعٍ عامّ. والتعليقُ أدناه كان يخشى ازدحامَ الطابور،
    #    وحارسُ «في الطيران» (`inflight_reciters`) يمنع تكرارَ العمل نفسِه،
    #    فالخطرُ مؤمَّنٌ بحارسٍ لا بتباعدِ الجدولة.
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      step:
        description: "scan (يقيس ويُطلق) · gate (يُبوّب) · promote (يرقّي) · all"
        default: "all"
      limit:
        description: "أقصى عددِ سورٍ تُطلق لها محاذاةٌ في هذه الدورة"
        default: "3"

# ⛔ حلقةٌ واحدةٌ في كلّ حين — حلقتان تُطلقان المحاذاةَ نفسَها مرّتين.
concurrency:
  group: rafiq-restore
  cancel-in-progress: false

permissions:
  actions: write        # لإدلاء realign_surah / openers / audio_qa
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # ⛔ التاريخُ كاملاً: حارسُ D-175 يسأل `git log`
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet boto3

      - name: الاعتماد
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          test -s secure/r2_credentials.json || { echo "⛔ لا اعتماد"; exit 1; }

      # ⛔ يُقاس ويُطلق — ولا يُرقّى هنا. والمحاذاةُ تعمل في وظيفتها المستقلّة.
      - name: قياسٌ وإطلاقُ محاذاة
        if: ${{ github.event.inputs.step == 'scan' || github.event.inputs.step == 'all' || github.event.inputs.step == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ⛔⛔ **السقفُ رُفع 3 ⇒ 10 بأمر المالك 2026-09-20 ("مستعدٌّ للدفع")،
        #    وصُحّح معه فهمٌ خاطئٌ منّي:** ظننتُ هذا سقفَ **إنفاق** فعرضتُ رفعَه
        #    على المالك كأنّه قرارٌ ماليّ. والقياسُ من واجهة GitHub يقول
        #    `"private": false · "visibility": "public"` ⇒ **دقائقُ العدّاد
        #    القياسيّ مجّانيّةٌ بلا حدّ، فكلفةُ الرفع صفر**.
        # ⚖️ وهو في الحقيقة **سقفُ حكمةٍ لا سقفُ مال**: كُتب لئلّا يُنتَج من
        #    المرشَّحات أسرعُ ممّا يُحكَم فيه فيزدحم الطابور. والحدُّ الحقيقيُّ
        #    للتوازي سقفُ التزامن في الحساب (عشرون وظيفة) وهو حدُّ منصّةٍ
        #    لا حدُّ اشتراك ⇒ فعشرةٌ تبقى دونه بهامش، ولا تُغرقه.
        # ⛔ ولا يُرفع فوق ذلك بلا قياس: الزيادةُ بلا قياسٍ تُنتج طابوراً
        #    يُلغى نصفُه عند السقف الزمنيّ، فتضيع محاذاةٌ **نجحت**.
        # ⚡ **خُفّض 10 ⇒ 4 يومَ 2026-09-21 (إسراعُ الأنفع لا تعطيلُ الأقلّ):**
        #    سقفُ التزامن في الحساب عشرون وظيفة، ومحاذاةُ CTC الكاملةُ أربعُ
        #    وظائف. ومحاذاةُ سورةٍ واحدةٍ تستردّ آياتٍ معدودة، بينما محاذاةُ CTC
        #    تستردّ **الفهرسَ كلَّه** (‏مقيسٌ: arkani +80 · wdod +47). ⇒ يُترك
        #    المجالُ لأربعِ محاذياتِ CTC (16 وظيفة) وهامشٍ لأمر الوكيل.
        # ⚖️ ولا تعطيل: الحلقةُ تمسح وتُبوّب (`gate --limit 12` كما هو) وترقّي
        #    كلَّ ساعة، وهذا سقفُ **إنتاجيّة** لا سقفُ جودة، ولا يمسّ حارساً.
        # ↩️ والرجوعُ سطرٌ واحد: أعِدْ 4 إلى 10 متى فرغت قائمةُ `no-align`.
        # ⚡⚡ **أُعيد 4 ⇒ 8 يومَ 2026-09-22 (مسارانِ لا مسار):** الجردُ يقول إنّ
        #    الباقيَ القابلَ للعمل صنفان: **26 فهرساً نقصُ كلٍّ ≥20** (959 مدخلاً)
        #    تستحقّ محاذاةَ CTC كاملة، و**112 فهرساً نقصُ كلٍّ <20** (833 مدخلاً)
        #    محاذاةُ CTC لها **هدرٌ**: تسعون دقيقةً للفهرس كلِّه لأجل ستّ آيات.
        #    ⇒ الكبارُ لـCTC، والصغارُ لهذه الحلقة (محاذاةُ سورةٍ في دقائق).
        # ⚖️ والتوازنُ محسوب: ثلاثُ محاذياتِ CTC (12 وظيفة) + 8 محاذياتِ سورةٍ
        #    = 20 = سقفُ التزامن بلا تجاوز. ولا يُرفع فوق ذلك بلا قياس.
        # ⚡⚡⚡ **8 ⇒ 12 يومَ 2026-09-23 (رفع المالكُ سقفَ الحساب 20 ⇒ 40 بالاشتراك):**
        #    الميزانيةُ الجديدة: خمسُ محاذياتِ CTC (20 وظيفة) + 12 محاذاةَ سورة +
        #    بوّابةٌ (5) + مقعدُ الجسر = 38 ≤ 40. ⛔ ويبقى للجسر مقعد — جاع 25 دقيقة
        #    يومَ صُفّ فوق السقف. ↩️ والرجوعُ سطرٌ واحد: أعِدْ 12 إلى 8 إن عاد السقفُ 20.
        run: python tools/ci_fleet/restore_loop.py scan --limit ${{ github.event.inputs.limit || 12 }}

      # ⛔ التبويبُ خمسُ تشغيلاتٍ لكلّ دفعة مهما كبرت (المفاتيح بفواصل).
      - name: تبويبُ المحسَّنين
        if: ${{ github.event.inputs.step == 'gate' || github.event.inputs.step == 'all' || github.event.inputs.step == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ci_fleet/restore_loop.py gate --limit 12

      # ⛔ الترقيةُ آخرُ الخطوات — وما لم يستوفِ حكمَه يُترك للدورة التالية.
      - name: ترقيةُ ما مرّ بحكمه
        if: ${{ github.event.inputs.step == 'promote' || github.event.inputs.step == 'all' || github.event.inputs.step == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ci_fleet/restore_loop.py promote

      - name: خلاصةٌ تُقرأ من الهاتف
        if: always()
        run: |
          {
            echo "## حلقةُ الاسترجاع — $(date -u '+%Y-%m-%d %H:%MZ')"
            echo "الخطوة: \`${{ github.event.inputs.step || 'all (جدولة)' }}\`"
            echo ""
            echo "راجعْ سجلَّ الخطوات أعلاه: ما قِيس، وما أُطلق، وما رُقّي."
          } >> "$GITHUB_STEP_SUMMARY"
