name: rafiq-agent-cmd

run-name: أمرُ الوكيل السحابيّ — ${{ github.event.head_commit.message }}

# ⛔⛔ **لماذا هذا الملفّ — وهو مفتاحُ استقلال الوكيل:**
# جلسةُ كلود السحابيّة **تقرأ** جيت هَب ولا تملك `workflow_dispatch`
# (‏مقيسٌ حيّاً 2026-09-13: `403 Resource not accessible by integration`)،
# **ولا تملك اعتمادَ الدلو** (سرُّ R2 في أسرار الأكشنز لا في المستودع).
# فكانت ثلاثةُ أبوابٍ مغلقةً في وجهها: لا تُطلق محاذاةً، ولا تقيس من الدلو،
# ولا ترقّي. ⇒ **وهذا الملفُّ يفتحها كلَّها بلا أن يُسلَّم الوكيلُ سرّاً واحداً**:
# الوكيلُ **يدفع أمراً**، والعدّاءُ **ينفّذه بصلاحيّاته هو** ويعيد الجواب إلى
# المستودع فيقرؤه الوكيل.
#
# ⭐ والقاعدةُ التي يقوم عليها: **الصلاحيةُ تبقى حيث هي، والأمرُ يُنقل إليها.**
# فلا يُنسَخ سرٌّ إلى بيئةٍ أضعفَ حراسةً، ولا يبقى الوكيلُ عاجزاً.
#
# ⛔ **وقائمةُ المسموح مغلقة**: لا يُنفَّذ إلا ما في `ALLOWED_*` أدناه — فأمرٌ
#    مدسوسٌ لا يُنتج صدفةً تشغيلاً لم يُقصد. ولا شيءَ من هذا يمسّ العتبات
#    ولا الحُرّاس: `promote.py` يحكم بحُرّاسه كما هو.

on:
  push:
    # ⛔⛔ **قيدُ الفرع لازمٌ لا تجميل** (‏عطبٌ مقيسٌ 2026-09-14 ‏15:06Z):
    #    بلا `branches` يشتعل الزنادُ على **كلّ** فرعٍ يُدفع، والوكيلُ مُلزَمٌ
    #    بدفعتَين (‏`main` + فرعُه المخصَّص). فالدفعةُ الثانيةُ تُشعله على حالةٍ
    #    **قبل** نقلِ الأمر إلى `done/` ⇒ **الأمرُ يُنفَّذ مرّتين**.
    #    الشاهدُ: أمرا القسمة (‏`1505_split_isan` و`1505_split_mqari`) أنتجا
    #    أربعَ تشغيلات (‏34859994734 و34859998663 نسختان مكرّرتان)، ونقلُ
    #    الأمرَين إلى `done/` كان قد تمّ صحيحاً في الإيداع `345d9fe`.
    #    ⇒ فالعطبُ في **مَن يشتعل** لا في **مَن ينقل**.
    # ⚖️ ولا يُضيّق هذا بابَ الوكيل: `CLAUDE.md` يأمر بالدفع إلى `main` نصّاً
    #    (`git push origin HEAD:main`)، فهذا هو الفرعُ الوحيدُ الذي يُؤمر منه أصلاً.
    branches: [main]
    paths: ["ops/commands/**"]

permissions:
  actions: write        # لإدلاء سير العمل نيابةً عن الوكيل
  contents: write       # لإعادة الجواب إلى المستودع

concurrency:
  group: rafiq-agent-cmd
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ⭐ (تسريع 2026-10-22) `fetch-depth: 0` كان ≈110ث من ≈160ث للشوط (تاريخٌ كاملٌ + 52 ألف ملفّ).
      #    السطحيّ ≈25ث. ولا تحتاج الأدواتُ التاريخَ (`git show HEAD:…` فقط)، والدمجُ عند رفض
      #    الدفع سليمٌ على نسخةٍ سطحيّةٍ (يجلب `fetch` ما بين حدّها والرأس، اختُبر).
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet boto3

      # ⛔⛔ **العنقُ الحقيقيُّ لهذه القناة، مقيسٌ 2026-09-20:** `promote.py` يُنزّل
      #    أحكامَ `state/` كلَّها في كلّ شوط — **≈1000 ملفٍّ و65 م.ب** — ولها
      #    ذاكرةٌ محلّيّةٌ بمفتاحٍ و`ETag` مكتوبةٌ في الأداة، **لكنّها تموت مع
      #    العدّاء** فلا تنفع شيئاً هنا. فصار شوطُ ترقيةٍ واحدٍ يتجاوز نصفَ
      #    الساعة ويسقط عند `timeout-minutes`، **فتضيع مخرجاتُه كلُّها** لأنّ
      #    الدفعَ في الخطوة الأخيرة. وقِيس اليومَ: شوطان أُلغيا وثالثٌ قارب السقف،
      #    وقناةُ الأوامر حُجزت أكثرَ من ساعة.
      # ✅ **والعلاجُ حفظُ الذاكرة بين الأشواط** — والأحكامُ **لا تتغيّر أصلاً**
      #    (حكمٌ كُتب بمفتاحٍ وبصمةٍ لا يُعاد كتابته)، فالحفظُ آمنٌ بطبعه،
      #    والتحقّقُ يبقى بـ`ETag` داخلَ الأداة لا بالذاكرة.
      # ⚖️ **وكلفةً:** المستودعُ عامّ، وذاكرةُ أكشنز فيه مجّانيّةٌ حتى 10 ج.ب،
      #    وهذه ≈65 م.ب تُكتب مرّةً وتُقرأ مراراً ⇒ **توفيرُ دقائقِ حوسبةٍ
      #    بذاكرةٍ صغيرة**، لا إنفاقٌ جديد.
      - name: ذاكرةُ أحكامِ الصوت (تُوفّر تنزيلَ 65 م.ب في كلّ شوط)
        uses: actions/cache/restore@v4
        with:
          path: tools/index_qa/work/verdict_cache
          key: verdict-cache-${{ github.run_id }}
          restore-keys: |
            verdict-cache-

      - name: الاعتماد
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json

      - name: تنفيذُ الأوامر وإعادةُ الجواب
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/ci_fleet/agent_cmd.py

      - name: ادفع الجواب
        id: push
        if: always()
        run: |
          git config user.name  "rafiq-agent-cmd"
          git config user.email "actions@github.com"
          # ⛔ بمسارٍ صريح: الشجرةُ يكتب فيها غيرُنا، و`-A` يكنس عملَ سواه.
          # ⛔ دمجٌ معلّقٌ من شوط الأوامر يُسقط كلَّ إيداعٍ جزئيّ (2026-09-25) ⇒ يُلغى أوّلاً.
          if [ -f .git/MERGE_HEAD ]; then git merge --abort || true; fi
          git add ops/out ops/commands 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ops: جوابُ أمرِ الوكيل" -- ops/out ops/commands
            # ⛔⛔ عطبٌ مقيسٌ 2026-09-14 17:30Z: كانت إعادةُ المحاولة تستعمل
            #    `pull --rebase` — وهو الممنوعُ نصّاً على هذه الشجرة المشتركة
            #    (`CLAUDE.md`: «ولا rebase؛ وعند التعذّر git merge --no-edit»).
            #    وحين يتعارض شوطان على *نفس اسم ملفّ الجواب* (كلاهما نفّذ الأمرَ
            #    نفسَه بالتزامن فكتب نتيجةً بنصٍّ مختلف) يفشل الدمجُ بتعارض
            #    add/add، فتُهمَل النتيجةُ المحسوبةُ محلّياً بصمت — وقع فعلاً على
            #    نتائج `hamza`/`hafz`. ⇒ عند التعارض: ادمج بـ`-X ours` (نتيجتي
            #    التي حسبتُها الآن تبقى، فكلا الجوابين صادقٌ على الأمر نفسِه ولا
            #    خسارةَ حقيقةٍ) لا بترك الشوط يفشل صامتاً.
            # دفعٌ متينٌ: حتى 8 محاولات بانتظارٍ متزايدٍ وعشوائيّة صغيرة، وفي كلّ محاولةٍ
            # fetch ثم دمجٌ (بلا rebase ولا force). الفشلُ النهائيّ يُخرج غير صفريّ.
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              git fetch origin main --quiet || true
              if ! git merge -X ours --no-edit origin/main; then
                git merge --abort || true
                echo "⚠️ محاولة $i: تعذّر الدمج"
              elif git push origin HEAD:main; then
                ok=1; break
              fi
              w=$(( i * 3 + RANDOM % 5 ))
              echo "محاولة $i رُفضت؛ انتظار ${w}ث"
              sleep "$w"
            done
            if [ "$ok" != 1 ]; then
              echo "⚠️ فشلت كلُّ محاولات دفع الجواب (الاحتياط: artifact ans-cmd)"; exit 1
            fi
          else
            echo "لا جوابَ يُدفع."
          fi

      # الاحتياطُ لا يُرفع إلا إن فشل الدفعُ نفسُه (كان يُرفع دائماً ≈20ث لكلّ شوط وفيه مجلّدٌ بـ386 م.ب).
      - name: احتياطٌ - ارفع الجواب artifact
        if: always() && steps.push.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ans-cmd-${{ github.run_id }}
          path: ops/out
          retention-days: 1
          if-no-files-found: ignore
