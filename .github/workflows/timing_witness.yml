name: rafiq-timing-witness

run-name: "timing-witness س${{ inputs.surah }} · ${{ inputs.reason }}"

# ⏱️ **م1 — شاهدٌ زمنيٌّ MMS_FA ∧ QWA لسورةٍ واحدة** (‏`tools/index_qa/timing_witness.py`) لـ`pin_heard --timing-witness-run`.
#    يحلّ محلَّ طابع Whisper الزمنيّ وحده حين يتّفق المحاذيان ≤150م.ث، ثمّ يُقارَن بـCTC بعتبة 300 كما هي؛ والسماعُ لـWhisper.
# ⚖️ قارئٌ محض: لا سرَّ ولا دلوَ ولا كتابة (‏`contents: read`)؛ الأثرُ JSON صغيرٌ لسبعة أيّام يُقرأ بـ`gh api`.
# 💰 مستودعٌ عامّ + ubuntu-latest القياسيّ (‏مجّاني) · الصوتُ من رابطه العامّ لا من R2 ⇒ صفرُ عمليّاتٍ على R2.
#    الزمن المقيس محلّياً: MMS ≈0.12× الزمن الحقيقيّ، QWA ≈0.02×.
on:
  workflow_dispatch:
    inputs:
      url: {description: "رابطُ صوت السورة الواحد — هو نفسُ صوت الخريطة والفهرس", required: true}
      surah: {description: "رقمُ السورة", required: true}
      riwaya: {description: "الرواية (‏hafs | warsh | qalun)", default: "hafs"}
      reason: {description: "سببُ الإطلاق", default: ""}

permissions:
  contents: read

concurrency:
  group: rafiq-timing-witness-${{ inputs.surah }}-${{ inputs.riwaya }}-${{ inputs.url }}
  cancel-in-progress: false

env:
  PY: "3.13"

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PY }}"}
      - name: كاش ffmpeg (بديلُ apt المعلَّق · لا يغيّر النسخة)
        uses: actions/cache@v4
        with:
          path: .qa-tools/apt-tree
          key: qa-ffmpeg-apt-tree-v1-${{ hashFiles('tools/ci_fleet/install_qa_ffmpeg.py') }}
      - name: كاش النماذج (‏MMS_FA وquran-asr-tiny بالبصمة)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch
            ~/.cache/quran-word-align
          key: timing-witness-models-v1
      - name: الأدوات (‏النسخُ مثبَّتة)
        run: |
          QA_FFMPEG_APT_ONLY=1 python tools/ci_fleet/install_qa_ffmpeg.py
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchaudio==2.7.1
          python -m pip install --quiet "numpy==2.5.5" "uroman==1.3.1.1" "onnxruntime==1.32.0" "kaldi-native-fbank==1.23.3" "requests==2.32.3" \
            "quran-word-align @ git+https://github.com/voltarostudio/quran-word-align@188aff3032cedede2ac3adcc9d0dc27c59273c40"
      - name: اختباراتُ الأداة والحارس أوّلاً
        run: python -m unittest tools/index_qa/test_timing_witness.py tools/index_qa/test_pin_heard_timing_witness.py tools/index_qa/test_pin_heard_witness.py
      - name: القياس (⛔ بلا رفعٍ ولا دلو)
        env:
          URL: ${{ inputs.url }}
          SURAH: ${{ inputs.surah }}
          RIW: ${{ inputs.riwaya }}
        run: |
          set -o pipefail
          mkdir -p out
          python tools/index_qa/timing_witness.py --url "$URL" --surah "$SURAH" --riwaya "$RIW" --out out 2>&1 | tee out/timing.log
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: timing-witness-s${{ inputs.surah }}-${{ github.run_id }}
          path: |
            out/timing_s*.json
            out/timing.log
          retention-days: 7
