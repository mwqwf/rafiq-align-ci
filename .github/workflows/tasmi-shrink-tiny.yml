# 📦⚖️ **تصغيرُ النموذج الصغير المشحون نفسِه** (‏2026-09-25 · أمرُ المالك: «ركّزوا على ما يغني عن تطوير النماذج»).
#
# ⭐ `tasmi-shrink.yml` صغّر `base` وحده فشُحن q5_1؛ و`tiny` — **وهو ما يسمعه كلُّ مستخدمٍ وكلُّ تتبّعٍ حيّ** —
#    بقي q8 (43.5 م.ب) ولم يُجرَّب له تكميمٌ أشدّ قطّ. فيُكمَّم من أوزانه الأصليّة على HF ويُقاس **بالمرآة نفسِها**
#    (‏البوّابة + سقف 10ث · greedy · `en` كالمشحون) على المجموعات الخمس، ويحكم `shrink_verdict.py` بالقاعدة نفسِها:
#    أصغرُ مرشَّحٍ **لا يخسر شيئاً مفصولاً** أمام المشحون. ⚠️ والحَكَمُ يشترط أيضاً «أفضلَ من المشحون» فيطبع ⛔
#    لمرشَّحٍ لا يخسر ولا يربح — والمقروءُ هنا خانةُ «خسارةٌ مقابل المشحون» وحدَها: المطلوبُ أصغرُ وأسرعُ بلا خسارة.
# 💰 مجّانيّ: مستودعٌ عامّ + `ubuntu-latest` · لا كتابةَ في R2 · **وأربعُ مهامَّ متوازيةٍ فقط** كي لا تزاحم الفهرسة.
# 🔑 الزناد: دفعُ `tools/tasmi_bench/requests/shrink_tiny.json`.
name: tasmi-shrink-tiny
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/tasmi_bench/requests/shrink_tiny.json"
permissions:
  contents: write
concurrency:
  group: tasmi-shrink-tiny-${{ github.ref }}
  cancel-in-progress: false
env:
  UA: "Mozilla/5.0 (QuranRafiq tasmi shrink)"
  PUB: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev
  WCPP_SHA: c4ac0012a8f5a2082dfca6aad4ddfd8b2c02b337
  HF_BASE: tarteel-ai/whisper-tiny-ar-quran
  QTYPES: "q6_k q5_1 q5_0"
jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: r2 creds (يقرأ منه fetch_audio.py — قراءةٌ لا كتابة)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 - <<'PY2'
          import json, os
          c = json.load(open("secure/r2_credentials.json"))
          keys = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"], "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          env = open(os.environ["GITHUB_ENV"], "a")
          for k, v in keys.items():
              print("::add-mask::" + v); env.write(k + "=" + v + chr(10))
          env.close()
          PY2
      - name: deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg cmake build-essential > /dev/null
          pip install -q numpy soundfile scipy boto3
      - name: whisper.cpp (ثنائيٌّ ساكن · الإيداعُ المشحون نفسُه)
        run: |
          # ⛔ مقيس (الشوط 35981806735): ثنائيٌّ بُني بـGGML_NATIVE على آلةٍ خرج بـSIGILL (rc=132) على آلةٍ أخرى،
          #    والمهامُّ هنا على آلاتٍ مختلفة ⇒ بناءٌ محمولٌ بـAVX2 (كلُّ مشغّلات GitHub تدعمه).
          set -eo pipefail
          mkdir -p /tmp/wcpp && git -C /tmp/wcpp init -q \
            && git -C /tmp/wcpp fetch -q --depth 1 https://github.com/ggml-org/whisper.cpp "$WCPP_SHA" \
            && git -C /tmp/wcpp checkout -q FETCH_HEAD
          cmake -S /tmp/wcpp -B /tmp/wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON > /dev/null
          cmake --build /tmp/wcpp/build --config Release -j"$(nproc)" --target whisper-cli whisper-quantize > /dev/null
          mkdir -p bin && cp /tmp/wcpp/build/bin/whisper-cli /tmp/wcpp/build/bin/whisper-quantize bin/
          cp /tmp/wcpp/models/convert-h5-to-ggml.py bin/
          bin/whisper-cli --help 2>&1 | head -1
      - name: sets cache (مفتاحُ tasmi-gate نفسُه)
        id: cache
        uses: actions/cache@v4
        with:
          path: tools/tasmi_bench/work/sets.tar
          key: tasmi-sets-${{ hashFiles('tools/tasmi_bench/sample.json', 'tools/tasmi_bench/inject_plan_riwaya.json', 'tools/tasmi_bench/augment.py', 'tools/tasmi_bench/augment_learner.py', 'tools/tasmi_bench/inject_riwaya_local.py') }}
      - name: build sets (من المصادر الأصلية — لا يُعاد نشرُ صوت)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          cd tools/tasmi_bench
          python fetch_audio.py
          python augment.py --only noise-fan-5
          python augment_learner.py --only learner-combo
          python inject_riwaya_local.py
          for d in work/wav work/g2/noise-fan-5 work/g2/learner-combo work/g3r/clean work/g3r/noisy; do echo "$d: $(ls $d | wc -l)"; done
          tar -cf work/sets.tar -C work wav g2/noise-fan-5 g2/learner-combo g3r/clean g3r/noisy
      - uses: actions/upload-artifact@v4
        with:
          name: sets
          path: tools/tasmi_bench/work/sets.tar
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin/
          retention-days: 2

  quantize:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: sets
          path: tools/tasmi_bench/work
      - name: deps (torch للمعالج وحده)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq time > /dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          pip install -q "transformers<5" huggingface_hub numpy soundfile
          chmod +x bin/*
          git clone -q --depth 1 https://github.com/openai/whisper /tmp/oai
      - name: المرجعُ المشحون من R2 (‏tiny q8)
        run: |
          set -eo pipefail
          mkdir -p models
          curl -sSL -f -A "$UA" -o models/tiny-q8.bin "$PUB/models/whisper-tiny-ar-quran/ggml-q8_0.bin"
          sha256sum models/*.bin
      - name: HF ⇒ ggml f16 ⇒ التكميمات
        run: |
          set -eo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          d = snapshot_download(os.environ["HF_BASE"], local_dir="/tmp/hf_base",
                                allow_patterns=["*.json", "*.bin", "*.safetensors", "*.txt"])
          print(sorted(os.listdir(d)))
          # ⛔ مقيس (الشوط 35981279426): المحوِّلُ يكتب n_text_ctx من `max_length` (1024 هنا) والموترُ طولُه
          #    `max_target_positions` (448) ⇒ «decoder.positional_embedding has wrong size» فلا يُحمَّل. يُوحَّدان.
          import json
          p = os.path.join(d, "config.json"); c = json.load(open(p))
          print("max_length", c.get("max_length"), "⇐ max_target_positions", c["max_target_positions"])
          c["max_length"] = c["max_target_positions"]; json.dump(c, open(p, "w"), indent=1)
          PY
          # ⚠️ أوزانٌ قد تُحفظ bf16 ⇒ تُرفع إلى float32 قبل numpy (الدرسُ نفسُه في kaggle_model_ladder.py)
          sed -i 's/\.squeeze()\.numpy()/.squeeze().float().numpy()/' bin/convert-h5-to-ggml.py
          mkdir -p /tmp/conv && python bin/convert-h5-to-ggml.py /tmp/hf_base /tmp/oai /tmp/conv
          mv /tmp/conv/ggml-model.bin models/tiny-f16.bin
          bin/whisper-quantize models/tiny-f16.bin /tmp/tiny-q8-ours.bin q8_0 > /dev/null
          echo "q8 المحوَّل هنا مقابل المشحون على R2 (نسبُ المرشّحين إلى الأصل نفسِه):"
          sha256sum /tmp/tiny-q8-ours.bin models/tiny-q8.bin
          for q in $QTYPES; do
            n=$(echo "$q" | tr -d '_')
            if bin/whisper-quantize models/tiny-f16.bin "models/tiny-$n.bin" "$q" > "/tmp/q_$n.log" 2>&1; then
              echo "✅ $q ⇒ $(du -m "models/tiny-$n.bin" | cut -f1) م.ب"
            else
              echo "⛔ $q لم يُكمَّم: $(tail -2 /tmp/q_$n.log)"; rm -f "models/tiny-$n.bin"
            fi
          done
          rm -f models/tiny-f16.bin
          ls -l models
      - name: الزمنُ وذروةُ الذاكرة على الآلة نفسِها (عيّنةٌ ثابتة من G1)
        run: |
          set -eo pipefail
          cd tools/tasmi_bench/work && tar -xf sets.tar wav && cd -
          ls tools/tasmi_bench/work/wav/*.wav | sort | head -24 > /tmp/tset.txt
          # ⛔ الشوطُ الأوّل: المكمَّماتُ خرجت في 0.1ث بلا تفريغ (لم تُحمَّل) فقُرئت «RTF 0» ⇒ فحصُ تحميلٍ صريحٌ يُسقط الشوط
          W1=$(head -1 /tmp/tset.txt); BAD=0
          for m in models/*.bin; do
            out=$(bin/whisper-cli -m "$m" -l ar -t 4 -bo 1 -bs 1 -nt -ng -f "$W1" 2>&1; echo "rc=$?")
            if echo "$out" | grep -q "^rc=0$" && echo "$out" | grep -qP "[\x{0600}-\x{06FF}]"; then
              echo "✅ $m يُحمَّل ويفرّغ"
            else
              BAD=1; echo "⛔ $m:"; echo "$out" | tail -40
            fi
          done
          [ "$BAD" = 0 ] || exit 1
          python - <<'PY'
          import json, os, subprocess, soundfile as sf
          files = open("/tmp/tset.txt").read().split()
          sec = sum(sf.info(f).duration for f in files)
          out = {}
          arms = [(m[:-4], "en") for m in sorted(os.listdir("models")) if m.startswith("tiny-")]
          for name, lang in arms:
              m = f"models/{name}.bin"
              row = {"mb": round(os.path.getsize(m) / 1e6, 1), "lang": lang, "audio_sec": round(sec, 1)}
              for t in (4, 2):
                  cmd = ["/usr/bin/time", "-f", "%e %M", "bin/whisper-cli", "-m", m, "-l", lang, "-t", str(t),
                         "-bo", "1", "-bs", "1", "-nt", "-np", "-ng"]
                  for f in files:
                      cmd += ["-f", f]
                  r = subprocess.run(cmd, capture_output=True, text=True)
                  wall, kb = r.stderr.strip().splitlines()[-1].split()
                  row[f"rtf_t{t}"] = round(float(wall) / sec, 3)
                  row[f"peak_rss_mb_t{t}"] = round(int(kb) / 1024, 1)
              out[name] = row
              print(name, row, flush=True)
          json.dump(out, open("timing.json", "w"), indent=1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models/
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: timing
          path: timing.json
          retention-days: 7

  transcribe:
    needs: quantize
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        set: ["g1", "g2:noise-fan-5", "g2:learner-combo", "g3r:clean", "g3r:noisy"]
        arm: ["tiny-q8:en", "tiny-q6k:en", "tiny-q51:en", "tiny-q50:en"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy soundfile scipy
      - uses: actions/download-artifact@v4
        with:
          name: sets
          path: tools/tasmi_bench/work
      - uses: actions/download-artifact@v4
        with:
          name: bin
          path: bin
      - uses: actions/download-artifact@v4
        with:
          name: models
          path: models
      - name: transcribe (البوّابة + سقف 10ث · greedy)
        env:
          WHISPER_CLI: ${{ github.workspace }}/bin/whisper-cli
          PYTHONIOENCODING: utf-8
        run: |
          set -eo pipefail
          chmod +x bin/*
          A="${{ matrix.arm }}"; M="${A%%:*}"; L="${A##*:}"
          [ -f "models/$M.bin" ] || { echo "⏭️ $M غيرُ موجود (لم يُكمَّم)"; exit 0; }
          cd tools/tasmi_bench/work && tar -xf sets.tar && rm sets.tar && cd ..
          T=$(echo "${{ matrix.set }}" | sed 's/:/-/')
          python local_whisper.py --backend cli --model "$GITHUB_WORKSPACE/models/$M.bin" --set "${{ matrix.set }}" \
            --gate --group-cap 10 --threads 4 --lang "$L" --out "work/hyps_ci-$M-${L}_${T}_gate_cap10.json" | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: hyps-${{ strategy.job-index }}
          path: tools/tasmi_bench/work/hyps_ci-*.json
          if-no-files-found: ignore
          retention-days: 7

  judge:
    needs: transcribe
    if: always() && needs.transcribe.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: hyps-*
          merge-multiple: true
          path: tools/tasmi_bench/work
      - uses: actions/download-artifact@v4
        with:
          name: timing
          path: tools/tasmi_bench/work/shrink
      - name: الحكمُ — كلُّ مرشَّحٍ مقابل المشحون
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -eo pipefail
          cd tools/tasmi_bench
          python shrink_verdict.py --selftest > /dev/null
          S=work/shrink; M=$S/summary.md; : > "$M"
          P="work/hyps_{arm}_{tag}_gate_cap10.json"
          cmp() {  # $1 عنوان · $2 الذراع أ · $3 الذراع ب · $4 ملفُّ الملخّص (اختياريّ)
            echo "### $1" >> "$M"
            python v2_gate.py --score-only --pattern "$P" --arms "$2" "$3" --md work/_p.md > /dev/null && cat work/_p.md >> "$M"
            [ -n "$4" ] && cp "work/$3_gate_summary.json" "$4" || true
          }
          # ⚖️ المرجعُ الواحدُ هو المشحون: الملخّصُ نفسُه يُحفظ في الخانتَين فيحكم الحَكَمُ بقاعدته كما هي.
          for c in q6k q51 q50; do
            ls work/hyps_ci-tiny-$c-en_*.json > /dev/null 2>&1 || { echo "⏭️ tiny-$c بلا فرضيّات" >> "$M"; continue; }
            cmp "tiny-$c (en) مقابل المشحون tiny q8 (en)" ci-tiny-q8-en "ci-tiny-$c-en" "$S/vs_shipped_tiny-$c.json"
            cp "$S/vs_shipped_tiny-$c.json" "$S/vs_base_tiny-$c.json"
          done
          python shrink_verdict.py --dir "$S" --out "$S/verdict.json" | tee "$S/verdict.txt"
          { echo "## 📦 tasmi-shrink-tiny · run ${{ github.run_id }}"; echo '```'; cat "$S/verdict.txt"; echo '```'; cat "$S/timing.json" | head -80; cat "$M"; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=حكم التصغير::$(tail -1 "$S/verdict.txt")"
      - name: إيداعُ النتائج نصّاً في الفرع (جلسةُ الوكيل لا تنزّل السجلّات)
        run: |
          set -eo pipefail
          D="ops/shrink/tiny-${{ github.run_id }}"
          mkdir -p "$D" && cp tools/tasmi_bench/work/shrink/* "$D/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D" && git commit -q -m "ops: نتيجةُ tasmi-shrink-tiny ${{ github.run_id }}" -- "$D"
          for i in 1 2 3 4; do
            git push origin "HEAD:${{ github.ref_name }}" && break
            git fetch -q origin "${{ github.ref_name }}" && git merge --no-edit -q "origin/${{ github.ref_name }}"; sleep $((i*3))
          done
