name: audio-qa-contract
on:
  push:
    paths:
      - tools/index_qa/run.py
      - tools/index_qa/test_audio_decode_fallback.py
      - .github/workflows/audio-qa-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audio-qa-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install --quiet numpy soundfile
      - run: python -m unittest tools.index_qa.test_audio_decode_fallback -v
