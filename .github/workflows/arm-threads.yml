# 🧵 **ذراعا خيوطٍ على `arm64` — أيربح رفعُ عدد الخيوط زمناً بلا كسر الزمن الحقيقيّ؟**
#
# ⛔ **لِمَ وُجد — بعطبٍ مقيسٍ لا مفترَض** (‏D-432 · 2026-09-13 · الشوط `34783986553`):
# `WhisperCpuConfig` يُخرج **صفراً لا استثناءً** على جهازٍ متساوي ترددات النوى، فلا يعمل مسارُ
# `CPU variant` البديل، فيُفرَّغ بـ**خيطَين** لا بعدد النوى. ورفعُ العدد **دعوى أداءٍ** لا تُشحن
# بظنّ ⇒ تُقاس **بذراعَين على البنود عينِها** وبشرطَين مجتمعَين: كسبُ زمنٍ **يقينيّ** (الحدُّ
# الأعلى لمجال 95٪ دون الصفر) **وألّا يتجاوز بندٌ الزمنَ الحقيقيّ** في الذراع الجديدة.
#
# ⛔ **ولا منطقَ في YAML:** الحكمُ كلُّه في `tools/tasmi_bench/threads_ab.py` **المختبَرِ نفسَه**
# (`--selftest`: كسبٌ آمنٌ · لا فرقَ · يربح ويكسر الزمنَ الحقيقيَّ · يخسر · ذراعان متطابقتان ·
# مسارُ فكٍّ ناقص) — فما لا يفحصه حارسٌ ولا يُختبر يكتم رقماً.
#
# 🔑 **وزنادُه الإيداع** (‏الإدلاءُ يردّ 403 على بيانة الوكيل): يُدفع
# `tools/tasmi_bench/requests/threads.json`.
#
# ⚠️ **وحدُّه يُقال معه:** لينكس/glibc وأنويةٌ **متماثلة** لا `big.LITTLE` أندرويد ⇒ المقيسُ
# **اتّجاهُ التوسّع بالخيوط على المعمارية**، لا زمنُ جهاز المستخدم. والمستودعُ عامٌّ فدقائقُه مجّانيّة.
name: arm-threads

on:
  workflow_dispatch:
    inputs:
      note:
        description: "سببُ الشوط (يُطبع في الخلاصة)"
        required: false
        default: ""
  push:
    paths:
      - "tools/tasmi_bench/requests/threads.json"
      - ".github/workflows/arm-threads.yml"

permissions:
  contents: write

concurrency:
  group: arm-threads
  cancel-in-progress: false

env:
  PUB: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev
  UA: "Mozilla/5.0 (QuranRafiq arm threads)"
  WC: c4ac0012a8f5a2082dfca6aad4ddfd8b2c02b337   # الالتزامُ المثبَّت — نفسُ الذي في arm-time

jobs:
  # ⛔⛔ **حارسُ التكرار — بعطبٍ مقيسٍ 2026-09-13/14:** زنادُ `paths` يشتعل من **مدى دفعةِ غيرِك**
  # (تدمج الجلساتُ `main` ثمّ تدفع فتحمل دفعتُها إيداعي) ⇒ اشتعل هذا المسارُ **ثلاثَ مرّاتٍ**
  # بطلبٍ واحدٍ لم يتغيّر، وكلُّ شوطٍ نحوُ خمسين دقيقةً ويدوس `LATEST_threads.md`.
  # ⇒ **الهويّةُ بصمةُ الطلب**: إن كان لهذه البصمة أثرٌ منشورٌ في `results/` فالشوطُ **يُختصر
  # إلى ثوانٍ** ولا يُقاس ثانياً. ⭐ **وإعادةٌ مقصودةٌ تُطلب بتغييرِ الطلب** (حرفٌ في `note`
  # أو `seq`) — فالإعادةُ **قرارٌ** لا صدفةَ دفعةٍ عابرة.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      req: ${{ steps.fp.outputs.req }}
      dup: ${{ steps.fp.outputs.dup }}
    steps:
      - uses: actions/checkout@v4
      - name: بصمةُ الطلب
        id: fp
        run: |
          R=$(python3 -c "import hashlib;print(hashlib.sha256(open('tools/tasmi_bench/requests/threads.json','rb').read()).hexdigest()[:12])")
          echo "req=$R" >> "$GITHUB_OUTPUT"
          git fetch -q --depth=1 origin main
          if git cat-file -e "origin/main:results/threads_req_$R.md" 2>/dev/null; then
            echo "dup=1" >> "$GITHUB_OUTPUT"
            echo "⏭️ **بصمةُ الطلب \`$R\` مقيسةٌ ومنشورةٌ سلفاً** ⇒ لا يُعاد القياس. وللإعادة: غيّر الطلب (‏\`note\` أو \`seq\`)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "dup=0" >> "$GITHUB_OUTPUT"
            echo "▶️ بصمةُ الطلب \`$R\` جديدةٌ ⇒ يُقاس." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  t:
    needs: gate
    if: needs.gate.outputs.dup != '1'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 🛡️ حارسٌ: لو لم يكن العدّاءُ arm64 فالشوطُ **باطلٌ** لا ناقص — لا يُقاس عليه شيء.
      - name: المعمارية
        run: |
          uname -m
          [ "$(uname -m)" = "aarch64" ] || { echo "⛔ العدّاءُ ليس arm64 ⇒ لا يُقاس عليه شيء"; exit 1; }
          nproc
          lscpu | grep -iE "model name|^CPU\(s\)|Flags" | head -3 || true

      - name: r2 creds (من السرّ الواحد R2_CREDENTIALS_JSON)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 -c "import json;c=json.load(open('secure/r2_credentials.json'));print('✅ سرُّ R2 مقروءٌ · الدلو', c['bucket'])"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: العدّة
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build ffmpeg > /dev/null
          pip install -q numpy soundfile scipy boto3

      # ⛔ **والحاكمُ يُختبر في الشوط نفسِه قبل أن يُحكم به** — حارسٌ معطوبٌ يكتب رقماً كاذباً.
      - name: اختبارُ الحاكم
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/tasmi_bench/threads_ab.py --selftest

      - name: الطلب
        env:
          I_NOTE: ${{ github.event.inputs.note }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          p = "tools/tasmi_bench/requests/threads.json"
          req = json.load(open(p, encoding="utf-8")) if os.path.exists(p) else {}
          d = {"model": "tiny", "src": "g4n", "plan": "work/long_plan.json",
               "limit": "20", "repeats": "3", "threads_a": "2", "threads_b": "0", "rt": "1.0",
               # ميزانيّةُ خطوة القياس بالثواني — تحت المهلة بهامشٍ يكفي البناءَ والنشر.
               "budget_sec": "3000"}
          for k, v in d.items():
              print("R_%s=%s" % (k.upper(), str(req.get(k, v)).strip() or v))
          note = (os.environ.get("I_NOTE") or "").strip() or str(req.get("note") or "").strip()
          # ⛔ سطرٌ واحدٌ لا أكثر: `GITHUB_ENV` يقرأ سطراً سطراً فسببٌ بسطرَين يفسد البيئةَ كلَّها.
          print("R_NOTE=%s" % (" ".join(note.split()) or "(بلا سبب)"))
          PY
          cat "$GITHUB_ENV"

      - name: بناءُ whisper-cli برايات التطبيق نفسِها
        run: |
          git clone -q --depth 1 https://github.com/ggml-org/whisper.cpp wc && cd wc
          git fetch -q --depth 1 origin "$WC" && git checkout -q FETCH_HEAD
          cmake -S . -B b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+fp16 -O3" -DCMAKE_CXX_FLAGS="-march=armv8.2-a+fp16 -O3" > /dev/null
          cmake --build b --target whisper-cli -j"$(nproc)" > /dev/null
          ls -l b/bin/whisper-cli

      - name: النموذج
        run: |
          curl -sSL -f --retry 4 --retry-delay 5 --retry-all-errors -A "$UA" \
            -o tools/tasmi_bench/work_model.bin "$PUB/models/whisper-$R_MODEL-ar-quran/ggml-q8_0.bin"
          ls -l tools/tasmi_bench/work_model.bin

      # الكاشُ نفسُه الذي يستعمله `arm-time` حرفاً — فالمجموعاتُ صوتٌ لا يتعلّق بالمعمارية.
      - name: المجموعات
        id: sets
        uses: actions/cache@v4
        with:
          path: tools/tasmi_bench/work/sets.tar
          key: tasmi-sets-v4-${{ hashFiles('tools/tasmi_bench/sample.json', 'tools/tasmi_bench/inject_plan_riwaya.json', 'tools/tasmi_bench/augment.py', 'tools/tasmi_bench/augment_learner.py', 'tools/tasmi_bench/inject_riwaya_local.py', 'tools/tasmi_bench/build_long.py') }}

      - name: بناءُ المجموعات إن غاب الكاش
        if: steps.sets.outputs.cache-hit != 'true'
        run: |
          cd tools/tasmi_bench
          python fetch_audio.py && python build_long.py --ayahs 6
          python augment.py --src-dir work/g4 --dest-dir work/g4n --only noise-fan-5
          tar -cf work/sets.tar -C work wav g4 g4n long_plan.json

      - name: فكُّ المجموعات
        run: cd tools/tasmi_bench/work && tar -xf sets.tar && rm -f sets.tar && ls -d g4 g4n 2>/dev/null

      # ⛔ **الإعاداتُ متداخلةٌ لا متسلسلة** (‏أ ب أ ب أ ب): لو جُمعت ذراعٌ كلُّها ثمّ الأخرى
      # لاختلط أثرُ الخيوط بأثر حرارةِ العدّاء وجارِه — والتداخلُ يوزّع ذلك على الذراعَين سواءً.
      - name: القياس — ذراعان متداخلتان بإعاداتٍ
        id: measure
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p tools/tasmi_bench/work_th
          A="$R_THREADS_A"
          B="$R_THREADS_B"
          # ⛔ **لا `[ … ] && …` في خطوةٍ تعمل بـ`set -e`:** شرطٌ كاذبٌ يُخرج الخطوةَ بـ1 وهو آخرُ
          # أمرٍ في السطر — فتسقط الخطوةُ بلا سببٍ مفهوم (فخٌّ معروفٌ يُكتب `if` بدلَه).
          if [ "$B" = "0" ]; then B="$(nproc)"; fi
          echo "A=$A · B=$B · nproc=$(nproc) · بنودٌ=$R_LIMIT · إعاداتٌ=$R_REPEATS" | tee tools/tasmi_bench/work_th/head.txt
          echo "THR_A=$A" >> "$GITHUB_ENV"
          echo "THR_B=$B" >> "$GITHUB_ENV"
          cd tools/tasmi_bench
          rc=0
          # ⛔⛔ **ميزانيّةُ زمنٍ تُقاس لا تُقدَّر — بعطبٍ وقع في أوّل شوطٍ** (`34786469053`):
          # قدّرتُ التمريرةَ بثماني دقائقَ فاختَرتُ 20 بنداً وثلاثَ إعاداتٍ (ستّ تمريرات)، فتجاوزت
          # خطوةُ القياس خمسين دقيقةً وقاربت المهلة — **ولو سقطت بالمهلة لضاع الشوطُ كلُّه بلا
          # حكمٍ منشور**، لأنّ النشرَ في آخره. ⇒ الآن **تُقاس التمريرةُ الأولى** ثمّ يُحسب ما يسع
          # الميزانيّةَ، فتُقلَّص الإعاداتُ **ويُعلن تقليصُها** بدل أن يُفقد كلُّ شيء.
          # ⭐ **والقاعدة: مَن اختار عيّنةً بتقديرِ زمنٍ لم يقِسه فقد راهن بالشوط كلِّه.**
          BUDGET=${R_BUDGET_SEC:-3000}
          T0=$(date +%s)
          done_pairs=0
          for r in $(seq 1 "$R_REPEATS"); do
            if [ "$done_pairs" -ge 1 ]; then
              el=$(( $(date +%s) - T0 ))
              per=$(( el / done_pairs ))
              left=$(( BUDGET - el ))
              if [ "$left" -lt "$per" ]; then
                echo "⚠️ **قُلِّصت الإعاداتُ إلى $done_pairs بحسابٍ مقيس**: التمريرةُ ${per}ث · الباقي ${left}ث من ${BUDGET}ث" | tee -a work_th/head.txt
                break
              fi
            fi
            for side in a b; do
              if [ "$side" = "a" ]; then T="$A"; else T="$B"; fi
              echo "== إعادةٌ $r · ذراعُ $side · خيوطٌ $T"
              python cli_time.py --cli ../../wc/b/bin/whisper-cli --model work_model.bin \
                --src "work/$R_SRC" --plan "$R_PLAN" --threads "$T" --limit "$R_LIMIT" \
                --json "work_th/th_${side}_${r}.json" --md "work_th/th_${side}_${r}.md" || rc=$?
            done
            done_pairs=$(( done_pairs + 1 ))
          done
          echo "الإعاداتُ المنجَزة: $done_pairs من $R_REPEATS · بميزانيّةٍ ${BUDGET}ث" | tee -a work_th/head.txt
          # ⛔ وتمريرةٌ واحدةٌ لا تكفي حكماً زوجيّاً بإعاداتٍ؟ **بل تكفي** (الوسيطُ على إعادةٍ واحدة)
          #    — والعددُ يُطبع في الأثر فيُقرأ الحكمُ بحجم شهادته لا بحجم ما طُلب.
          echo "$rc" > work_th/rc.txt
          ls -l work_th/
          exit "$rc"

      - name: الحكم — من ملفٍّ مختبَرٍ لا من شفرةٍ في YAML
        id: judge
        if: always()
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          python threads_ab.py --rt "$R_RT" \
            --a work_th/th_a_*.json --b work_th/th_b_*.json \
            --md work_th/verdict.md --json work_th/verdict.json
          echo "$?" > work_th/jrc.txt
          cat work_th/verdict.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-threads-${{ github.run_id }}
          path: tools/tasmi_bench/work_th/
          retention-days: 14
          if-no-files-found: ignore

      - name: نشرُ الأثر في git — من شجرةٍ منفصلةٍ لأنّ القياسَ يُوسِّخ الشجرة
        if: always()
        run: |
          R=$(cat tools/tasmi_bench/work_th/rc.txt 2>/dev/null || echo 1)
          V="tools/tasmi_bench/work_th/verdict.md"
          OUT="results/threads_${{ github.run_id }}.md"
          {
            echo "# 🧵 ذراعا الخيوط على arm64 · الشوط ${{ github.run_id }}"
            echo
            echo "- التاريخ: $(date -u +%FT%TZ) · الزناد: \`${{ github.event_name }}\` · رمزُ القياس: \`$R\`"
            echo "- السبب: $R_NOTE"
            echo "- الذراعان: \`$THR_A\` مقابل \`$THR_B\` خيطاً · المجموعة \`$R_SRC\` · بنودٌ \`$R_LIMIT\` · إعاداتٌ \`$R_REPEATS\` · النموذج \`$R_MODEL\`"
            echo "- العدّاء: \`$(uname -m)\` · \`nproc=$(nproc)\`"
            echo
            if [ -s "$V" ]; then cat "$V"; else echo "⛔ **لا حكمَ**: سقط القياسُ قبل أن يُكتب — والأثرُ في المصنوعة."; fi
            echo
            echo "<sub>⚠️ لينكس/glibc وأنويةٌ متماثلة لا big.LITTLE أندرويد ⇒ المقيسُ اتّجاهُ التوسّع لا زمنُ الهاتف.</sub>"
          } > /tmp/out.md
          git config user.name "rafiq-ci"
          git config user.email "ci@users.noreply.github.com"
          for i in 1 2 3; do
            rm -rf /tmp/pub && git fetch -q origin main && git worktree add -q --detach /tmp/pub origin/main || { echo "↻ شجرةٌ $i"; sleep 5; continue; }
            mkdir -p /tmp/pub/results
            cp /tmp/out.md "/tmp/pub/$OUT"
            cp /tmp/out.md /tmp/pub/results/LATEST_threads.md
            # 🔖 **وأثرُ البصمة يُنشر كي يعرف حارسُ التكرار أنّ هذا الطلبَ قِيس** — سطرٌ يدلّ
            #    على الشوط لا نسخةٌ ثانيةٌ من الجدول.
            printf '⏭️ طلبٌ ببصمة `%s` قِيس في الشوط %s ⇒ %s\n' \
              "${{ needs.gate.outputs.req }}" "${{ github.run_id }}" "$OUT" \
              > "/tmp/pub/results/threads_req_${{ needs.gate.outputs.req }}.md"
            git -C /tmp/pub add "$OUT" results/LATEST_threads.md "results/threads_req_${{ needs.gate.outputs.req }}.md"
            git -C /tmp/pub commit -q -m "results(arm-threads): الشوط ${{ github.run_id }} · $THR_A مقابل $THR_B خيطاً" || { echo "لا تغيير"; exit 0; }
            git -C /tmp/pub push -q origin HEAD:main && { echo "✅ أُودع $OUT"; exit 0; }
            echo "↻ دفعٌ $i"; git worktree remove --force /tmp/pub 2>/dev/null; sleep 5
          done
          echo "⛔ تعذّر الدفع"; exit 1

      # ⛔ **ولا تُقرأ خضرةٌ حكماً:** الخضرةُ تعني «قِيس ونُشر»، والحكمُ نصٌّ في `results/`.
      - name: ردُّ الحكم
        if: always()
        run: |
          R=$(cat tools/tasmi_bench/work_th/rc.txt 2>/dev/null || echo 1)
          J=$(cat tools/tasmi_bench/work_th/jrc.txt 2>/dev/null || echo 1)
          [ "$R" = "0" ] || { echo "⛔ سقط القياسُ برمزٍ $R"; exit 1; }
          [ "$J" = "0" ] || { echo "⛔ سقط الحاكمُ برمزٍ $J — ولا يُقرأ نقصُه حكماً"; exit 1; }
          echo "✅ قِيس ونُشر في results/LATEST_threads.md — والحكمُ يُقرأ منه لا من لون الشوط"
