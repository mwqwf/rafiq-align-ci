# 🦾 **المعماريةُ نفسُها مجّاناً وبلا جهاز المالك** — عدّاءُ `arm64` من GitHub (متاحٌ للمستودعات العامة).
#
# ⛔ **العطبُ الذي وُجدت له** (‏D-334): محاكي العدّاء `x86_64` **لا يُظهر انهيارَ `greedy`** أصلاً (صفرُ بندٍ
# من ستّين)، وعلى هاتف المالك `arm64` انهار في بندَين من عشرةٍ فبلغ RTF 1.63، ونسبةُ بطءِ الهاتف عن
# العدّاء تتفجّر إلى ×9.26 في `greedy` وتبقى ×1.3–2.9 في `beam 5`. فسؤالُ «هل يبوّب الحرسُ أسوأَ
# الحالات؟» كان مفتوحاً بلا أداةٍ بعد أن استُنفد إذنُ الهاتف. وهذا يشغّل **المحرك نفسَه** (`whisper.cpp`
# بالرايات نفسِها: `-march=armv8.2-a+fp16` · Release · `-O3`) على `arm64` بخيطَين — سياسةُ `WhisperCpuConfig`
# على جهاز المالك — فيُقاس **السلوك**: أيتفجّر `greedy` على هذه المعمارية أم لا.
#
# ⚠️ وحدُّه يُقال معه: لينكس/glibc لا أندرويد/bionic، والمعالجُ غيرُ معالجِه ⇒ **الرقمُ ليس رقمَ جهازه**،
# والذي يُنقل منه حكمٌ على السلوك لا قيمةٌ مطلقة.
name: arm-time
on:
  workflow_dispatch:
    inputs:
      threads:
        description: "عددُ الخيوط (‏2 = سياسةُ التطبيق على SM-S948B)"
        required: false
        default: "2"
      src:
        description: "مجلدُ المجموعة تحت work/ (‏g4 نظيف · g4n مروحةٌ 5د.ب · g4h بعيدٌ+مروحةٌ+هاتف · wav آيةٌ مفردة · wavn آيةٌ مفردةٌ بمروحةِ 5د.ب — مادّةُ الحلقة الحيّة · g3rn/g3rc مادّةُ الحقن مضجَّجةً/نظيفةً — وفيها وحدَها يُقاس الثمن)"
        required: false
        default: "g4"
      plan:
        description: "ملفُّ المدد (‏work/long_plan.json للطويل · sample.json للآية المفردة · inject_plan_riwaya.json مع g3r*)"
        required: false
        default: "work/long_plan.json"
      model:
        description: "النموذج: tiny (المشحون) · base (الأكبر — D-349)"
        required: false
        default: "tiny"
      limit:
        description: "حدُّ البنود (‏0 = الكلّ)"
        required: false
        default: "0"
      arms:
        description: "ذراعان بالاسم: greedy · guard · shipguard (مرآةُ المشحون · D-522) · hearall (‏الافتراضُ هو المشحونُ سلفاً)"
        required: false
        default: "greedy,guard"
  # 🔑 **وبابٌ ثانٍ: يُستدعى من `arm-request` بإيداعٍ لا بإدلاء** (‏2026-09-14 · دورةُ :50).
  #    السببُ نفسُه المكتوبُ في `emu-request`: بيانةُ الوكيل تردّ **403** على `dispatches`
  #    ⇒ فلو بقي هذا المسارُ على الإدلاء وحدَه لبقي **قياسُ الزمن على `arm64` موقوفاً على
  #    نقرةٍ من المالك** — وهو عينُ ما أُمرنا بإلغائه.
  # ⚠️ **والمداخلُ تُقرأ بـ`inputs` لا `github.event.inputs`**: الثانيةُ **فارغةٌ** في
  #    `workflow_call` فيمرّ الشوطُ بخيوطٍ فارغةٍ ونموذجٍ فارغٍ — عطبٌ صامت.
  workflow_call:
    inputs:
      threads:
        type: string
        required: true
      src:
        type: string
        required: true
      plan:
        type: string
        required: true
      model:
        type: string
        required: true
      limit:
        type: string
        required: true
      arms:
        type: string
        required: true
env:
  # 🔢 **مصدرٌ واحدٌ للعدّ**: يقرؤه مفتاحُ الكاش والبناءُ معاً فلا يتفارقان.
  INJ6_COUNT: "20"
  PUB: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev
  UA: "Mozilla/5.0 (QuranRafiq arm time)"
  WC: c4ac0012a8f5a2082dfca6aad4ddfd8b2c02b337   # الالتزامُ المثبَّت — نفسُ الذي في third_party
jobs:
  t:
    # Owner financial stop 2026-09-18: no runner allocation until verified free.
    if: ${{ false }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: r2 creds (من السرّ الواحد R2_CREDENTIALS_JSON)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 - <<'PY2'
          import json, os
          c = json.load(open("secure/r2_credentials.json"))
          keys = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"], "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          env = open(os.environ["GITHUB_ENV"], "a")
          for k, v in keys.items():
              print("::add-mask::" + v); env.write(k + "=" + v + chr(10))
          env.close()
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 🛡️ حارسٌ: لو لم يكن العدّاءُ arm64 فالشوطُ **باطلٌ** لا ناقص — لا يُقاس عليه شيء.
      - name: المعمارية
        run: |
          uname -m
          [ "$(uname -m)" = "aarch64" ] || { echo "⛔ العدّاءُ ليس arm64 ⇒ لا يُقاس عليه شيء"; exit 1; }
          lscpu | grep -iE "model name|^CPU\(s\)|Flags" | head -3 || true
      - name: العدّة
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build ffmpeg > /dev/null
          pip install -q numpy soundfile scipy boto3
      - name: بناءُ whisper-cli برايات التطبيق نفسِها
        run: |
          git clone -q --depth 1 https://github.com/ggml-org/whisper.cpp wc && cd wc
          git fetch -q --depth 1 origin "$WC" && git checkout -q FETCH_HEAD
          cmake -S . -B b -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+fp16 -O3" -DCMAKE_CXX_FLAGS="-march=armv8.2-a+fp16 -O3" > /dev/null
          cmake --build b --target whisper-cli -j"$(nproc)" > /dev/null
          ls -l b/bin/whisper-cli
      - name: النموذجُ المشحون
        run: |
          curl -sSL -f --retry 4 --retry-delay 5 --retry-all-errors -A "$UA" \
            -o tools/tasmi_bench/work_model.bin "$PUB/models/whisper-${{ inputs.model }}-ar-quran/ggml-q8_0.bin"
          ls -l tools/tasmi_bench/work_model.bin
      - name: المجموعاتُ (كاشُ بوّابة المحاكي نفسُه — لا يتعلّق بالمعمارية)
        id: sets
        uses: actions/cache@v4
        with:
          path: tools/tasmi_bench/work/sets.tar
          # 🔑 **ورقمُ النسخة يُرفع حين تُضاف مجموعةٌ** (‏v4⇒v5 · 2026-09-15): المفتاحُ يُبصم
          #    ملفّاتِ البناء **لا هذا الملفّ** ⇒ مجموعةٌ جديدةٌ في الخطوة أدناه **لا تُبنى
          #    أبداً** ما دام الكاشُ يُستعاد، فيُقاس على مجلَّدٍ غائبٍ ويسقط الشوطُ بلا سبب.
          key: tasmi-sets-v5-${{ hashFiles('tools/tasmi_bench/sample.json', 'tools/tasmi_bench/inject_plan_riwaya.json', 'tools/tasmi_bench/augment.py', 'tools/tasmi_bench/augment_learner.py', 'tools/tasmi_bench/inject_riwaya_local.py', 'tools/tasmi_bench/build_long.py') }}
      - name: بناءُ المجموعات إن غاب الكاش
        if: steps.sets.outputs.cache-hit != 'true'
        run: |
          cd tools/tasmi_bench
          python fetch_audio.py && python build_long.py --ayahs 6
          python augment.py --src-dir work/g4 --dest-dir work/g4n --only noise-fan-5
          # 🔊 **ومجموعةٌ أقسى تُبنى معها** (‏أُضيفت 2026-09-15 · D-517): `g4n` **مروحةٌ عند
          #    5 د.ب** وحدَها، وشكوى المالك «ضجيجٌ كثيفٌ جدّاً» ومعها **بُعدٌ عن الميكروفون**.
          #    و`combo-hard` شرطٌ **قائمٌ في العدّة**: خفضُ جهارةٍ 30 د.ب + مروحةٌ 10 د.ب +
          #    نطاقُ هاتف ⇒ أقربُ ما نملك إلى «بعيدٌ في غرفةٍ صاخبة». ⛔ والبناءُ **إضافةٌ**:
          #    `g4n` كما هي بالبذرة نفسِها فلا يتبدّل رقمٌ منشور.
          python augment.py --src-dir work/g4 --dest-dir work/g4h --only combo-hard
          # 🎤 **ومادّةُ الحلقة الحيّة: آيةٌ مفردةٌ مضجَّجة** (‏أُضيفت 2026-09-15 · D-523).
          #    ⛔ **السببُ مقيسٌ:** على الطويل المضجَّج قِيس الحرسُ **أسرعَ ×0.49** و**أكثرَ
          #    استعادةً بنصفٍ** من `greedy` ⇒ سببُ حصرِ `guardScope` في الحكم النهائيّ (الزمنُ ·
          #    D-328) **ساقطٌ على هذه المادّة**. لكنّ الحلقةَ الحيّةَ تفكّ **مقاطعَ قصيرة**،
          #    وزمنُ القصير ليس زمنَ الطويل (‏D-355) ⇒ **لا يُقلَب نطاقٌ مشحونٌ بقياسٍ في
          #    مادّةٍ أخرى**، وهذه هي المادّةُ التي تحسمه. والبذرةُ والشرطُ نفسُهما (`noise-fan-5`)
          #    فيبقى المقياسُ واحداً بين الطويل والقصير.
          python augment.py --src-dir work/wav --dest-dir work/wavn --only noise-fan-5
          tar -cf work/sets.tar -C work wav wavn g4 g4n g4h long_plan.json
      # ⛔⛔ **والحزمةُ لا تُحذف بعد الفكّ** (‏عطبٌ مقيسٌ 2026-09-15 · D-525): كان السطرُ
      #    ‏`rm -f sets.tar` ⇒ فتأتي خطوةُ ما بعد `actions/cache` فلا تجد ما تحفظه وتقول
      #    حرفاً: «Path Validation Error: Path(s) specified in the action for caching
      #    do(es) not exist, hence no cache is being saved» ⇒ **الكاشُ لا يُحفظ أبداً**،
      #    وكلُّ شوطٍ يعيد `fetch_audio` و`build_long` والتضجيج (‏أربعُ دقائقَ في كلّ شوط،
      #    ثلاثَ مرّاتٍ الليلةَ وحدَها). ⭐ **والتحذيرُ كان في السجلّ منذ أوّل شوطٍ ولم يُقرأ** —
      #    و«صفراءُ في السجلّ» ليست «لا شيء».
      - name: فكُّ المجموعات (‏والحزمةُ تبقى كي يُحفظ الكاش)
        run: cd tools/tasmi_bench/work && tar -xf sets.tar && ls -d g4 g4n g4h wavn 2>/dev/null
      # 🔪 **ومادّةُ الحقن — بحزمةٍ وكاشٍ مستقلَّين بقصد** (‏أُضيفت 2026-09-15 · D-537):
      # ⛔ **لِمَ لا تُضاف إلى `sets.tar`:** مفتاحُ ذلك الكاش **مشتركٌ مع `emu-gate`** (‏مناوبةُ
      #    `:13`) ⇒ فرفعُ نسخته يُبطل كاشَهم ويكلّفهم بناءً لم يطلبوه. **ومَن غيّر مشتركاً
      #    فليحمل ثمنَه لا ليُحمِّله غيرَه** — فمفتاحٌ آخرُ وحزمةٌ أخرى.
      # ⚖️ **وما تقيسه هذه المادّة:** الثمنُ الوحيدُ الباقي على الطريق الثالث — **أيكتم بابُ
      #    D-445 لحناً حقيقيّاً؟** فـ`g4*` تلاواتٌ صحيحةٌ **لا كشفَ فيها** (كسبٌ بلا ثمن)،
      #    و`g3r` فيه **خطأٌ مصنوعٌ معلومُ الموضع** ⇒ فيه **الصرفُ** يُقاس (D-445③: 3.94).
      # 🔪🎙️ **ومادّةُ الثمن الصحيحة: طويلةٌ ومحقونة** (‏أُضيفت 2026-09-15 · D-537):
      # ⛔ **السببُ مقيسٌ:** `g3r` آيةٌ مفردةٌ مدّتُها وسيطاً 10.1ث، و`chunk10` **لا يقطّع
      #    68٪ من بنودها** ⇒ الذراعان نسخةٌ واحدةٌ على أكثرِها (‏وذراعان متطابقتان سؤالٌ
      #    لا جواب · D-385). وهذه ستُّ آياتٍ (‏نحوَ 21ث ⇒ ثلاثةُ مقاطع) بلحنٍ معلومِ الموضع
      #    **وبضجيج `g4n` نفسِه** ⇒ فيُقارَن الثمنُ بالكسب على مادّةٍ واحدةِ الشرط.
      - name: مادّةُ الحقن الطويلة (‏كاشٌ ثالثٌ مستقلّ)
        id: inj6
        if: startsWith(inputs.src, 'g4i')
        uses: actions/cache@v4
        with:
          path: tools/tasmi_bench/work/inj6.tar
          # 🔢⛔⛔ **والعددُ في المفتاح** (‏أُضيف 12:5xZ · فخٌّ أُغلق قبل أن يقع): `--count`
          #    **ليس ملفّاً يُبصَم** ⇒ فمن رفعه إلى 40 طلباً لعيّنةٍ أوسعَ **يستعيد كاشَ
          #    العشرين بعينه** ويقيس على المادّة نفسِها وهو يحسبها ضِعفَها — «عيّنةٌ أوسع»
          #    كذبٌ لا يصرخ. ⇒ فالعددُ **جزءٌ من اسم الكاش**، ومن غيَّره بنى.
          #    (‏وهو درسُ `tasmi-sets-v4⇒v5` نفسُه بصورةٍ أخرى: المفتاحُ يُبصم ما يُبنى به.)
          key: tasmi-inj6-v1-c${{ env.INJ6_COUNT }}-${{ hashFiles('tools/tasmi_bench/build_long_inject.py', 'tools/tasmi_bench/build_long.py', 'tools/tasmi_bench/augment.py') }}
      - name: بناءُ المادّة الطويلة المحقونة إن غاب الكاش
        if: ${{ startsWith(inputs.src, 'g4i') && steps.inj6.outputs.cache-hit != 'true' }}
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          python build_long_inject.py --count "$INJ6_COUNT"
          python augment.py --src-dir work/g4i --dest-dir work/g4in --only noise-fan-5
          tar -cf work/inj6.tar -C work g4i g4in long_inject_plan.json
      - name: فكُّ المادّة الطويلة المحقونة (‏والحزمةُ تبقى)
        if: startsWith(inputs.src, 'g4i')
        run: |
          set -o pipefail
          cd tools/tasmi_bench/work
          [ -d g4i ] || tar -xf inj6.tar
          echo "🔪🎙️ نظيفٌ $(ls g4i | wc -l) · مضجَّجٌ $(ls g4in 2>/dev/null | wc -l)"
          # ⛔ ولا يُقاس على حصىً: ستَّ عشرةَ بنداً حدٌّ أدنى معلَنٌ، وما دونه سقوطٌ.
          [ "$(ls g4i | wc -l)" -ge 16 ] || { echo "⛔ المادّةُ الطويلةُ المحقونة ناقصة"; exit 1; }
      - name: مادّةُ الحقن (‏كاشٌ مستقلٌّ لا يمسّ كاشَ البوّابة)
        id: inj
        if: startsWith(inputs.src, 'g3r')
        uses: actions/cache@v4
        with:
          path: tools/tasmi_bench/work/inj.tar
          key: tasmi-inj-v1-${{ hashFiles('tools/tasmi_bench/inject_plan_riwaya.json', 'tools/tasmi_bench/inject_riwaya_local.py') }}
      - name: بناءُ مادّة الحقن إن غاب الكاش
        if: ${{ startsWith(inputs.src, 'g3r') && steps.inj.outputs.cache-hit != 'true' }}
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          python inject_riwaya_local.py
          tar -cf work/inj.tar -C work g3r
      # ⛔ **والحزمةُ تبقى** (‏درسُ D-525 بنصّه: حذفُها يمنع حفظَ الكاش أبداً)، **والأسماءُ
      #    تُسطَّح** كي يبقى `src` كلمةً واحدةً (‏اسمُ الأثَر ومفتاحُ R2 لا يحملان مِشْطرة).
      - name: فكُّ مادّة الحقن وتسطيحُ اسمَيها
        if: startsWith(inputs.src, 'g3r')
        run: |
          set -o pipefail
          cd tools/tasmi_bench/work
          [ -d g3r ] || tar -xf inj.tar
          ln -sfn g3r/noisy g3rn && ln -sfn g3r/clean g3rc
          echo "🔪 مضجَّجٌ $(ls g3rn | wc -l) · نظيفٌ $(ls g3rc | wc -l)"
          # ⛔ ولا يُقرأ الصفرُ مجموعةً: خيرٌ أن يسقط الشوطُ من أن يُقاس على فراغ.
          [ "$(ls g3rn | wc -l)" -ge 100 ] || { echo "⛔ مادّةُ الحقن ناقصة"; exit 1; }
      # ⤓ **و`--dump-hyps` في كلّ شوطٍ بلا مفتاح** (‏D-537): التفريغُ **نصٌّ**، ومضيفُ الأثَر
      #    والدلوُ **لا يُقرآن من صندوق المناوبة** (مقيسٌ مراراً) ⇒ فبلا هذه الكتلةِ يضيع
      #    التفريغُ بانتهاء الشوط، وكلُّ قاعدةِ حاكمٍ تُقاس بعده **تكلّف شوطاً جديداً**
      #    ورقمُها يخالطه ضجيجُ تفريغٍ آخر (‏±1.5 نقطة · D-523). وثمنُها **نحوُ سبعين سطراً**
      #    في السجلّ، وهي **قبلَ الجدول** فيبقى ذيلُ السجلّ للجدول كما كان.
      - name: القياس (ذراعان متداخلتان لكلّ بند)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          python cli_time.py --cli ../../wc/b/bin/whisper-cli --model work_model.bin \
            --src "work/${{ inputs.src }}" --plan "${{ inputs.plan }}" \
            --threads "${{ inputs.threads }}" --limit "${{ inputs.limit }}" \
            --arms "${{ inputs.arms }}" \
            --dump-hyps \
            --md "work/arm_${{ inputs.model }}_${{ inputs.src }}_t${{ inputs.threads }}.md" \
            --json "work/arm_${{ inputs.model }}_${{ inputs.src }}_t${{ inputs.threads }}.json"
          # 📖 **والجدولُ يُطبع في السجلّ أيضاً لا في الملخّص وحدَه** (‏2026-09-14):
          #    ملخّصُ الشوط وR2 **كلاهما غيرُ مقروءٍ من صندوق الوكيل** (‏قِيس: R2 يردّ
          #    وصلاً فاشلاً، وتنزيلُ الأثر يُحوَّل إلى مضيفٍ محجوب) ⇒ **شوطٌ نجح ورقمُه
          #    لا يُقرأ كأنّه لم يجرِ**. والسجلُّ يُقرأ بـ`get_job_logs` بلا مفتاح.
          tee -a "$GITHUB_STEP_SUMMARY" < "work/arm_${{ inputs.model }}_${{ inputs.src }}_t${{ inputs.threads }}.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arm-time-${{ inputs.src }}-t${{ inputs.threads }}
          path: tools/tasmi_bench/work/arm_*.*
          retention-days: 14
          if-no-files-found: ignore
      - name: رفعٌ إلى R2
        if: always()
        run: |
          cd tools/tasmi_bench
          # 🔑 **والمفتاحُ يحمل العيّنةَ والشوط** (‏2026-09-14): كان `<نموذج>-<مجموعة>-t<خيوط>`
          #    وحدَه ⇒ **شوطٌ بعشرين بنداً كتب فوق أثر شوطٍ بستّين** (‏وقع فعلاً اليومَ،
          #    وحارسُ `r2_put` صاح: «كلُّ رقمٍ نُسب إلى هذا العنوان صار ينسب إلى غيره»).
          #    ⇒ الأثرُ لا يُمحى، والعنوانُ يُسمّي عيّنتَه.
          S="${{ inputs.model }}-${{ inputs.src }}"; T="${{ inputs.threads }}"
          N="n${{ inputs.limit }}-$(echo '${{ inputs.arms }}' | tr ',' '+')-r${{ github.run_id }}"
          for f in work/arm_*.md work/arm_*.json; do
            [ -f "$f" ] && python ../finetune/r2_put.py "$f" "finetune/armtime/$S-t$T-$N/$(basename $f)"
          done
          echo "☁️ $PUB/finetune/armtime/$S-t$T-$N/"
