# 🔒 **اختباراتُ المستودع الخاص على العدّاء العام المجّانيّ** (دراسة المستشار 2026-11-05 §4-د · المرحلة 0 ب1).
#
# ما يحدث: سيرُ ci-dispatch في المستودع الخاص يرسل repository_dispatch بالـSHA ونوعِ المهمّة وحدهما ⇒ هنا يُستنسخ
# الخاصُّ استنساخاً جزئيّاً (‏مجلّداتُ التطبيق والمحرّك فقط) بمفتاح نشرٍ للقراءة، ويُبنى ويُختبر، **وكلُّ مخرجٍ إلى ملفّ**
# يُرفع إلى R2 الخاص؛ والسجلُّ العلنيُّ لا يرى إلا نجح/فشل والعدّ، والحالةُ تعود إلى الإيداع في الخاص برمز statuses وحده.
#
# الضماناتُ الستّ نصّاً (‏§4-د-1) وموضعُ كلٍّ منها:
#   (أ) المفتاحُ في البيئة private-ci (‏فرعُ main وحده) وفي خطوة «الاستنساخ» وحدها؛ ويُمسح بعده (run.sh: scrub_key)؛
#       وحارسُ jobs/private_ci/test_env_scope.py يُفشل أيَّ سيرٍ آخر يذكر البيئةَ أو أسرارَها.
#   (ب) استنساخٌ جزئيّ (‏sparse + blob:none + عمقٌ واحد) بلا cloud/ ولا أدوات المتجر ولا ملفّات أسرار، ويُتحقَّق بعده.
#   (ج) لا actions/cache ولا upload-artifact ولا setup-gradle (‏يخبّئ ضمناً)؛ وما يُرفع يذهب إلى R2 الخاص وحده؛
#       والزنادُ repository_dispatch من الخاص، وworkflow_dispatch تجربةٌ على العامّ نفسِه فقط — ولا pull_request بحال.
#   (د) run.sh يوجّه كلَّ شيءٍ إلى $RUNNER_TEMP/private_ci/out/log.txt من أوّل أمر؛ والحارسُ يفحص الملخّص قبل نشره؛
#       وعند الاشتباه تُعلَّم الخطوةُ «طلب حذف السجل» فيحذف private-ci-sweeper.yml سجلَّ التشغيلة بالواجهة.
#   (هـ) الحمولةُ sha وkind وحدهما — يرفض plan.py أيَّ مفتاحٍ ثالث.
#   (و) «Require approval for all outside collaborators» إعدادٌ يضعه المالك (docs/ops/CI_PUBLIC_RUNNER_MIGRATION.md في الخاص).
#
# 💰 مستودعٌ عامّ + ubuntu-latest قياسيّ ⇒ بلا فوترة دقائق؛ ولا تخزينَ في GitHub (‏لا cache ولا artifacts).
name: private-ci
run-name: private-ci (${{ github.event_name }})

on:
  repository_dispatch:
    types: [private-ci]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربةٌ على المستودع العام نفسِه (لا يُقبل غيرُ true)"
        type: boolean
        required: true
        default: true
      plant_leak:
        description: "ازرع سطراً يشبه الشيفرة في الملخّص لإثبات الحجب وحذف السجل"
        type: boolean
        required: false
        default: false

# 🛡️ أدنى ما يكفي: قراءةُ هذا المستودع العامّ وحدها. (‏حذفُ السجلّ في سيرٍ منفصل له actions: write.)
permissions:
  contents: read

concurrency:
  group: private-ci-${{ github.event.client_payload.kind || 'dry-run' }}-${{ github.event.client_payload.sha || github.sha }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.p.outputs.kind }}
      sha: ${{ steps.p.outputs.sha }}
      source: ${{ steps.p.outputs.source }}
      context: ${{ steps.p.outputs.context }}
      multi: ${{ steps.p.outputs.multi }}
      plant: ${{ steps.p.outputs.plant }}
      legs: ${{ steps.p.outputs.legs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: jobs/private_ci
      # الحمولةُ عبر env لا داخل الصدفة: لا حقنَ من قيمةٍ علنيّةٍ غيرِ موثوقة.
      - id: p
        env:
          PCI_EVENT: ${{ github.event_name }}
          PCI_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          PCI_DRY_RUN: ${{ inputs.dry_run }}
          PCI_PLANT: ${{ inputs.plant_leak }}
          PCI_HEAD_SHA: ${{ github.sha }}
        run: python3 jobs/private_ci/plan.py

  run:
    needs: plan
    runs-on: ubuntu-latest
    # 🔑 البيئةُ وحدها تحمل المفتاحَ وبيانةَ R2 الخاص ورمزَ الحالة؛ وقيدُ فرع main عليها يضعه المالك.
    environment: private-ci
    timeout-minutes: ${{ matrix.leg.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    env:
      PCI_KIND: ${{ needs.plan.outputs.kind }}
      PCI_SHA: ${{ needs.plan.outputs.sha }}
      PCI_SOURCE: ${{ needs.plan.outputs.source }}
      PCI_PLANT: ${{ needs.plan.outputs.plant }}
      PCI_LEG: ${{ matrix.leg.id }}
      PCI_LINT: ${{ matrix.leg.lint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: jobs/private_ci

      # بلا `cache:` — لا ذاكرةَ مؤقّتةٌ لشيءٍ مشتقٍّ من المصدر الخاص.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      # 🔑 الخطوةُ الوحيدة التي يدخلها المفتاح؛ وفي التجربة لا يُمرَّر أصلاً.
      - name: الاستنساخ الجزئي
        env:
          PCI_KEY_B64: ${{ needs.plan.outputs.source == 'private' && secrets.PCI_DEPLOY_KEY_B64 || '' }}
        run: bash jobs/private_ci/run.sh clone

      - name: البناء والاختبار (المخرجات إلى ملف)
        run: bash jobs/private_ci/run.sh build

      - name: المحاكي (المخرجات إلى ملف)
        if: matrix.leg.has_emu
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.leg.emu.api }}
          target: ${{ matrix.leg.emu.target }}
          arch: ${{ matrix.leg.emu.arch }}
          profile: ${{ matrix.leg.emu.profile }}
          ram-size: ${{ matrix.leg.emu.ram }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash jobs/private_ci/run.sh emu

      - name: العد والملخص المرشح
        if: always()
        run: bash jobs/private_ci/run.sh finalize

      # 🛡️ الحارسُ على ما سيُنشر (الملخّص) قبل نشره — يطبع العدَّ وحده.
      - name: الحارس
        id: guard
        if: always()
        run: |
          rc=0
          python3 jobs/private_ci/guard.py --label "الملخّص" "$RUNNER_TEMP/private_ci/out/summary.md" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "suspicious=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "### 🔒 private-ci" "⛔ اشتباه: حُجب الملخّص، ويُحذف سجلُّ هذه التشغيلة." > "$RUNNER_TEMP/private_ci/out/summary.md"
            python3 -c "import json,sys; p=sys.argv[1]; c=json.load(open(p)); c['suspicious']=True; json.dump(c,open(p,'w'))" "$RUNNER_TEMP/private_ci/out/counts.json" || true
          else
            echo "suspicious=false" >> "$GITHUB_OUTPUT"
          fi

      - name: طلب حذف السجل
        if: always() && steps.guard.outputs.suspicious == 'true'
        run: echo "⛔ علامةٌ يقرؤها private-ci-sweeper.yml فيحذف سجلَّ التشغيلة."

      - name: الرفع إلى R2 الخاص
        id: upload
        if: always()
        env:
          PCI_R2_JSON: ${{ needs.plan.outputs.source == 'private' && secrets.PRIVATE_CI_R2_JSON || '' }}
          R2_CREDENTIALS_JSON: ${{ needs.plan.outputs.source == 'public' && secrets.R2_CREDENTIALS_JSON || '' }}
        run: |
          if [ "$PCI_SOURCE" = "private" ]; then MODE=private; CRED=PCI_R2_JSON; else MODE=dryrun; CRED=R2_CREDENTIALS_JSON; fi
          python3 jobs/private_ci/upload_r2.py --mode "$MODE" --creds-env "$CRED" \
            --out "$RUNNER_TEMP/private_ci/out" --state "$RUNNER_TEMP/private_ci/state" \
            --sha "$PCI_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --leg "$PCI_LEG" \
            --extra "$RUNNER_TEMP/private_ci/src/app/build/outputs/androidTest-results" \
                    "$RUNNER_TEMP/private_ci/src/app/build/reports" \
                    "$RUNNER_TEMP/private_ci/device"

      - name: إعادة الحالة إلى المستودع الخاص
        if: always()
        env:
          PCI_STATUS_TOKEN: ${{ needs.plan.outputs.source == 'private' && secrets.PCI_STATUS_TOKEN || '' }}
          PCI_CONTEXT: ${{ needs.plan.outputs.multi == 'true' && format('{0}/{1}', needs.plan.outputs.context, matrix.leg.id) || needs.plan.outputs.context }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RESULT=$(head -c 16 "$RUNNER_TEMP/private_ci/state/verdict" 2>/dev/null || echo error)
          DRY=""; [ "$PCI_SOURCE" = "private" ] || DRY="--dry-run"
          python3 jobs/private_ci/status_back.py $DRY --sha "$PCI_SHA" --context "$PCI_CONTEXT" --result "$RESULT" \
            --run-url "$RUN_URL" --counts "$RUNNER_TEMP/private_ci/out/counts.json" \
            --link-file "$RUNNER_TEMP/private_ci/state/link.txt"

      # ✅ النشرُ الوحيد في الملخّص العلنيّ: ملفٌّ فحصه الحارسُ أعلاه.
      - name: الملخص العلني
        if: always()
        run: python3 -c "import sys; open(sys.argv[2],'a',encoding='utf-8').write(open(sys.argv[1],encoding='utf-8').read())" "$RUNNER_TEMP/private_ci/out/summary.md" "$GITHUB_STEP_SUMMARY"

      - name: الحكم
        if: always()
        env:
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          v=$(head -c 16 "$RUNNER_TEMP/private_ci/state/verdict" 2>/dev/null || echo error)
          [ "$UPLOAD" = "success" ] || { echo "⛔ لم يُرفع السجل"; exit 1; }
          [ "$v" = "success" ] || { echo "⛔ $v"; exit 1; }
          echo "✅ نجح"

  # الحالةُ الجامعة للأنواع متعدّدة الأشواط (ads-emulator-smoke · device-matrix)؛ وكلُّ شوطٍ كتب حالتَه الفرعيّة.
  report:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.multi == 'true'
    runs-on: ubuntu-latest
    environment: private-ci
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: jobs/private_ci
      - name: الحالة الجامعة
        env:
          PCI_STATUS_TOKEN: ${{ needs.plan.outputs.source == 'private' && secrets.PCI_STATUS_TOKEN || '' }}
          PCI_SOURCE: ${{ needs.plan.outputs.source }}
          PCI_SHA: ${{ needs.plan.outputs.sha }}
          PCI_CONTEXT: ${{ needs.plan.outputs.context }}
          RESULT: ${{ needs.run.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DRY=""; [ "$PCI_SOURCE" = "private" ] || DRY="--dry-run"
          python3 jobs/private_ci/status_back.py $DRY --sha "$PCI_SHA" --context "$PCI_CONTEXT" --result "$RESULT" --run-url "$RUN_URL"
