# 🌐 نسخةُ مستودع الحوسبة العامّ (دقائقُ Actions بلا حدّ) — السكربتات مرآةُ QuranRafiq/tools · السرُّ الواحد R2_CREDENTIALS_JSON
# 🎓 تدريبُ `tuned-v2` على GitHub Actions بلا معالجٍ رسوميّ — **المسارُ الذي يعمل والمالكُ نائمٌ وجهازُه مطفأ** (القاعدة 7 ب).
# كولاب أسرع (T4 ≈ 25 د) لكنه يموت بإغلاق المتصفّح؛ هذا المسارُ أبطأ (ساعات) لكنه **يستأنف نفسَه**:
#   كلُّ تشغيلٍ ينزّل الأجزاءَ من R2، ويستأنف من `<prefix>/last.tar` إن وُجد، ويدرّب حتى `time_limit` دقيقة،
#   ثم يحفظ ويرفع ويطلق التشغيلَ التالي بنفسه (`gh workflow run`) حتى يكتمل، فيحوّل إلى ggml q8_0 ويرفعه.
#   يُشغَّل يدوياً مرّةً واحدة:  gh workflow run finetune-train-cpu -f prefix=finetune/out_v2_cpu
#   ⛔ بادئةٌ مستقلّة عن كولاب (`out_v2`) كي لا يكتب المساران فوق نقطة حفظٍ واحدة.
#   ⛔ الاستئنافُ لا يصحّ إلا بوسائط التدريب نفسِها (bs/accum/epochs/parts) بين الحلقات — تُمرَّر كلُّها كما هي.
name: finetune-train-cpu
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "بادئةُ المخرَج على R2"
        required: false
        default: "finetune/out_v2_cpu"
      parts:
        description: "أجزاءُ البيانات"
        required: false
        default: "g0 g1 g2 g3"
      epochs:
        description: "دورات"
        required: false
        default: "2.0"
      max_steps:
        description: "سقفُ الخطوات (0 = بالدورات)"
        required: false
        default: "0"
      time_limit:
        description: "دقائقُ التدريب في هذا التشغيل"
        required: false
        default: "285"
      chain:
        description: "أطلق التشغيلَ التالي إن لم يكتمل"
        required: false
        default: "true"
      aug:
        description: "نسبةُ التسويء (D-270)"
        required: false
        default: "0.5"
      bs:
        description: "حجمُ الدفعة"
        required: false
        default: "16"
      accum:
        description: "تراكمُ الدفعات"
        required: false
        default: "2"
      extra:
        description: "وسائطُ إضافية لـtrain.py (مثل: --target norm --no-trim)"
        required: false
        default: ""
concurrency:
  group: finetune-train-cpu-${{ github.event.inputs.prefix }}
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      PUB: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev
      UA: "Mozilla/5.0 (QuranRafiq finetune ci)"
      W: /mnt/ft
      PREFIX: ${{ github.event.inputs.prefix }}
      PARTS: ${{ github.event.inputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - name: r2 creds (من السرّ الواحد R2_CREDENTIALS_JSON)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 - <<'PY2'
          import json, os
          c = json.load(open("secure/r2_credentials.json"))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for k, v in {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"], "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}.items():
                  print(f"::add-mask::{v}"); env.write(f"{k}={v}
")
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps (torch للمعالج فقط — أخفُّ خمسَ مرّات)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers soundfile numpy boto3
          sudo mkdir -p "$W" && sudo chown -R "$USER" "$W"
          nproc; free -g | head -2; df -h "$W" | tail -1
      - name: data from R2 (كلُّ جزءٍ يُفكّ ثم يُحذف قرصُه)
        run: |
          mkdir -p "$W/data"
          for p in $PARTS; do
            curl -sSL -f -A "$UA" -o "$W/$p.tar" "$PUB/finetune/data_v2/$p.tar"
            tar -xf "$W/$p.tar" -C "$W/data" && rm -f "$W/$p.tar"
            curl -sSL -f -A "$UA" -o "$W/data/$p/audit.json" "$PUB/finetune/data_v2/$p.audit.json" 2>/dev/null && echo "🔎 $p: تدقيقُ العناوين موجود" || true
            echo "📦 $p: $(wc -l < "$W/data/$p/manifest.jsonl") مقطعاً"
          done
          cat "$W"/data/g*/manifest.jsonl > "$W/data/manifest.jsonl"
          echo "📚 $(wc -l < "$W/data/manifest.jsonl") مقطعاً · $(du -sh "$W/data" | cut -f1)"; df -h "$W" | tail -1
      - name: presigned PUT + resume من R2
        run: |
          python tools/finetune/sign_put.py --env --prefix "$PREFIX" --hours 8 >> "$GITHUB_ENV"
          mkdir -p "$W/out"; RESUME=""
          if curl -sSL -f -A "$UA" -o "$W/last.tar" "$PUB/$PREFIX/last.tar?t=$(date +%s)"; then
            tar -xf "$W/last.tar" -C "$W/out" && rm -f "$W/last.tar"
            if [ -f "$W/out/last/state.pt" ]; then RESUME="--resume $W/out/last"; echo "🔁 استئنافٌ من R2: $(du -sh "$W/out/last" | cut -f1)"; fi
          else
            echo "🆕 لا نقطةَ سابقة على $PREFIX — جولةٌ من البداية"
          fi
          echo "RESUME=$RESUME" >> "$GITHUB_ENV"
      - name: train (حتى time_limit ثم حفظٌ نظيف)
        run: |
          python tools/finetune/train.py --data "$W/data" --out "$W/out" --device cpu --workers 3 \
            --aug-p "${{ github.event.inputs.aug }}" --epochs "${{ github.event.inputs.epochs }}" --max-steps "${{ github.event.inputs.max_steps }}" \
            --bs "${{ github.event.inputs.bs }}" --accum "${{ github.event.inputs.accum }}" \
            --save-every 50 --eval-every 400 --time-limit "${{ github.event.inputs.time_limit }}" $RESUME ${{ github.event.inputs.extra }} 2>&1 | tee "$W/train.log"
          tail -1 "$W/out/train_log.jsonl"
      - name: outcome — تحويلٌ ورفعٌ إن اكتمل، وإلا الحلقةُ التالية
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(tail -1 "$W/out/train_log.jsonl")
          curl -sS -f -X PUT -T "$W/out/train_log.jsonl" "$PUT_LOG" && echo "☁️ $PREFIX/train_log.jsonl"
          if echo "$LAST" | grep -q '"event": *"done"'; then
            echo "✅ اكتمل التدريب — تحويلٌ إلى ggml q8_0"
            SRC="$W/out/best"; if [ ! -d "$SRC" ]; then SRC="$W/out/final"; echo "⚠️ لا best — أحوّل final"; fi
            bash tools/finetune/to_ggml.sh "$SRC" "$W/ggml" "$W"
            curl -sS -f -X PUT -T "$W/ggml/ggml-q8_0.bin" "$PUT_GGML" && echo "☁️ $PREFIX/ggml-q8_0.bin مرفوع — يُقاس على المحاكي بالبوّابتين"
            # ⚖️ بلا جهاز المالك: تُطلَق بوّابةُ مرآة المحرك على CI فور اكتمال النموذج
            gh workflow run tasmi-gate.yml -R "$GITHUB_REPOSITORY" -f cand_url="$PUB/$PREFIX/ggml-q8_0.bin" -f tag="$(basename "$PREFIX")"               && echo "⚖️ أُطلقت بوّابةُ tasmi-gate لـ$(basename "$PREFIX")" || echo "⚠️ تعذّر إطلاقُ tasmi-gate"
          elif [ "${{ github.event.inputs.chain }}" = "true" ]; then
            echo "⏭ لم يكتمل ($LAST) — أطلق الحلقةَ التالية"
            gh workflow run finetune-train-cpu.yml -R "$GITHUB_REPOSITORY" \
              -f prefix="$PREFIX" -f parts="$PARTS" -f epochs="${{ github.event.inputs.epochs }}" \
              -f max_steps="${{ github.event.inputs.max_steps }}" -f time_limit="${{ github.event.inputs.time_limit }}" \
              -f chain=true -f aug="${{ github.event.inputs.aug }}" -f bs="${{ github.event.inputs.bs }}" -f accum="${{ github.event.inputs.accum }}"               -f extra="${{ github.event.inputs.extra }}"
          else
            echo "⏸ لم يكتمل ولا تسلسل ($LAST)"
          fi
