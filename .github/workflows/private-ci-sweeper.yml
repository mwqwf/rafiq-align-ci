# 🧹 **كنّاسُ سجلّات private-ci** — الضمانة (د) طبقتُها الثانية.
#
# بعد كلّ تشغيلةٍ لـprivate-ci: يُنزَّل سجلُّها العلنيُّ كما يراه أيُّ زائر، ويُمرَّر على guard.py نفسِه؛ فإن وجد
# الحارسُ شيئاً — أو كانت التشغيلةُ قد علّمت خطوةَ «طلب حذف السجل» — يُحذف سجلُّها بالواجهة البرمجية.
# لماذا سيرٌ منفصل: سجلُّ تشغيلةٍ جارية لا يُحذف، و`workflow_run` يجري بعد اكتمالها من الفرع الافتراضيّ وحده.
# ⛔ بلا بيئةٍ ولا سرٍّ غيرِ GITHUB_TOKEN؛ ولا يطبع إلا العدّ.
name: private-ci-sweeper

on:
  workflow_run:
    workflows: [private-ci]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: private-ci-sweeper-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: jobs/private_ci
      - name: فحص السجل العلني وحذفه عند الاشتباه
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/sweep"; mkdir -p "$W/logs"
          flagged=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '[.jobs[].steps[]? | select(.name == "طلب حذف السجل" and .conclusion == "success")] | length' 2>/dev/null \
            | awk '{s+=$1} END {print s+0}')
          rc=0
          if gh api "repos/$REPO/actions/runs/$RUN_ID/logs" > "$W/logs.zip" 2>/dev/null \
             && python3 -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$W/logs.zip" "$W/logs"; then
            python3 jobs/private_ci/guard.py --label "السجل العلني" "$W/logs" || rc=$?
          else
            echo "الكنّاس: ⚠ تعذّر تنزيلُ السجل (قد يكون محذوفاً) — يُطلب الحذفُ احتياطاً"; rc=2
          fi
          echo "الكنّاس: علاماتُ طلب الحذف $flagged · رمزُ الحارس $rc"
          if [ "$flagged" -gt 0 ] || [ "$rc" -ne 0 ]; then
            if gh api -X DELETE "repos/$REPO/actions/runs/$RUN_ID/logs" >/dev/null 2>&1; then
              echo "الكنّاس: ✅ حُذف سجلُّ التشغيلة"
            else
              echo "الكنّاس: ⛔ تعذّر حذفُ السجل — يلزم حذفُه يدويّاً"; exit 1
            fi
          else
            echo "الكنّاس: ✅ السجلُّ العلنيُّ نظيف — لا حذف"
          fi
