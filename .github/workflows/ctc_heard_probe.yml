name: rafiq-ctc-heard-probe

run-name: "heard-probe س${{ inputs.surah }} · ${{ inputs.reason }}"

# 🔎 **سبرُ خريطة السماع بلا رفع** (‏`tools/alignment_v3/ctc_heard_map.py --probe`):
#    أيُّ آيةٍ تُسمع أين في ملفٍّ واحد — لتسجيلٍ فيه مادّةٌ زائدةٌ أو مقاطعُ مكرّرة
#    (‏عاصم اللحيدان · س38 · تراويح 946ث = 1.58× المتوقَّع). يقيس قبل أن يُبنى شيء.
# ⚖️ قارئٌ محض: لا سرَّ ولا دلوَ ولا كتابة (‏`contents: read`)، والأثرُ مخرَجُ تشغيلةٍ يُقرأ
#    بـ`ci_fleet/show_artifact.py`. 💰 مستودعٌ عامّ + عدّاد ubuntu-latest القياسيّ.
on:
  workflow_dispatch:
    inputs:
      url: {description: "رابطُ صوت السورة الواحد (‏لا قالب)", required: true}
      surah: {description: "رقمُ السورة", required: true}
      riwaya: {description: "الرواية", default: "hafs"}
      build: {description: "true = مع المداخل (‏محاذاةُ النوافذ) بلا رفع · false = الخريطةُ وحدها", default: "false"}
      int8: {description: "1 = نموذجٌ مكمَّم int8 (‏كالأسطول) · 0 = float32 (‏أدقُّ وأبطأ، كشاهد spoken_census)", default: "1"}
      evidence:
        description: "artifacts = النمط السابق · logs = سبر فقط · build-logs = بناء float32 ببصمة مصدر لازمة؛ السجل بلا حفظ cache أو artifacts"
        type: choice
        options: [artifacts, logs, build-logs]
        default: artifacts
      source_sha256: {description: "بصمة مصدر كاملة مقيسة؛ لازمة مع build-logs", default: ""}
      start_ms: {description: "بدءُ النافذة بالم.ث (‏السبرُ وحده): يُفكّ من هنا إلى آخر الملفّ والأزمنةُ مطلقة ويُكتب windowStartMs؛ 0 = الملفُّ كلُّه كما كان", default: "0"}
      reason: {description: "سببُ الإطلاق", default: ""}

permissions:
  contents: read

concurrency:
  # ‏(fixS1 · 2026-10-03) الرابطُ في المجموعة: مسابرُ قرّاءٍ مختلفين للسورة نفسِها كانت تُلغي بعضَها (خمسةٌ لس18).
  group: rafiq-heard-probe-${{ inputs.surah }}-${{ inputs.riwaya }}-${{ inputs.url }}
  cancel-in-progress: false

env:
  PY: "3.11"
  HF_HOME: ${{ github.workspace }}/.hf

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PY }}"}
      - name: كاش ffmpeg (بديلُ apt المعلَّق · لا يغيّر النسخة)
        uses: actions/cache@v4
        with:
          path: .qa-tools/apt-tree
          key: qa-ffmpeg-apt-tree-v1-${{ hashFiles('tools/ci_fleet/install_qa_ffmpeg.py') }}
      - name: الأدوات
        run: |
          QA_FFMPEG_APT_ONLY=1 python tools/ci_fleet/install_qa_ffmpeg.py
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          python -m pip install --quiet "numpy==1.26.4" transformers==5.22.1 ctc-segmentation==1.7.5 rapidfuzz==3.14.6
      - name: اختباراتُ الأداة أوّلاً
        run: python -m unittest tools/alignment_v3/test_ctc_heard_map.py
      - name: كاش النموذج
        if: ${{ inputs.evidence == 'artifacts' }}
        uses: actions/cache@v4
        with:
          path: .hf
          key: ctc-model-jonatasgrosman-xlsr53-ar-v1
      - name: استعادة النموذج فقط لسبر السجل
        if: ${{ inputs.evidence == 'logs' || inputs.evidence == 'build-logs' }}
        uses: actions/cache/restore@v4
        with:
          path: .hf
          key: ctc-model-jonatasgrosman-xlsr53-ar-v1
          fail-on-cache-miss: true
      - name: خريطةُ السماع (⛔ بلا رفع)
        env:
          URL: ${{ inputs.url }}
          SURAH: ${{ inputs.surah }}
          RIW: ${{ inputs.riwaya }}
          BUILD: ${{ inputs.build }}
          CTC_INT8: ${{ inputs.evidence == 'build-logs' && '0' || inputs.int8 }}
          EVIDENCE: ${{ inputs.evidence }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          START_MS: ${{ inputs.start_ms }}
          HF_HUB_OFFLINE: ${{ inputs.evidence != 'artifacts' && '1' || '0' }}
          TRANSFORMERS_OFFLINE: ${{ inputs.evidence != 'artifacts' && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p out logs
          P="--probe"
          STRICT=()
          if [ "$EVIDENCE" = "artifacts" ] && [ "$BUILD" = "true" ]; then P=""; fi
          [[ "${START_MS:-0}" =~ ^[0-9]+$ ]] || { echo "⛔ start_ms عددٌ غيرُ سالب"; exit 1; }
          if [ "${START_MS:-0}" != "0" ]; then
            [ "$P" = "--probe" ] || { echo "⛔ start_ms للسبر وحده (‏build=false · evidence≠build-logs)"; exit 1; }
            STRICT+=(--start-ms "$START_MS")
          fi
          if [ "$EVIDENCE" = "build-logs" ]; then
            [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "بناء السجل يتطلب بصمة مصدر كاملة مقيسة"; exit 1; }
            export CTC_THREADS=2
            P=""
            STRICT=(--strict-tol-ms 1500)
          fi
          /usr/bin/time -v python tools/alignment_v3/ctc_heard_map.py --url "$URL" --surah "$SURAH" \
            --riwaya "$RIW" --out-dir out $P "${STRICT[@]}" --report out/report.txt 2>&1 | tee logs/probe.log
      - name: خريطة كاملة قابلة للاستخراج من السجل
        if: ${{ inputs.evidence == 'logs' }}
        env:
          SURAH: ${{ inputs.surah }}
          RIW: ${{ inputs.riwaya }}
        run: python tools/ci_fleet/emit_probe_map.py --surah "$SURAH" --riwaya "$RIW"
      - name: مخرجات البناء كاملة ببصمة المصدر المقيسة
        if: ${{ inputs.evidence == 'build-logs' }}
        env:
          URL: ${{ inputs.url }}
          SURAH: ${{ inputs.surah }}
          RIW: ${{ inputs.riwaya }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: >-
          python tools/ci_fleet/emit_probe_map.py --surah "$SURAH" --riwaya "$RIW"
          --alignment --url "$URL" --source-sha256 "$SOURCE_SHA256"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.evidence == 'artifacts' }}
        with:
          name: heard-probe-s${{ inputs.surah }}-${{ github.run_id }}
          path: |
            out/*.json
            out/report.txt
            logs/**
          retention-days: 7
