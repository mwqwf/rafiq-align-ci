# 🧱 **حارسُ نطاق private-ci** — خفيف (ثوانٍ، بلا سرّ): يفشل إن ذكر أيُّ سيرٍ غيرُ private-ci.yml البيئةَ private-ci
# أو أسرارَها، أو إن فقد private-ci.yml ضمانةً من الستّ (‏زنادٌ أوسع · cache · artifact · إجراءٌ غيرُ مثبَّت · set -x …).
# ويختبر الحارسَ والرافعَ والخطّةَ بأمثلةٍ موجبةٍ وسالبة.
name: private-ci-scope-guard

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "jobs/private_ci/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "jobs/private_ci/**"

permissions:
  contents: read

concurrency:
  group: private-ci-scope-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: PyYAML
        run: python3 -m pip install --disable-pip-version-check -q "pyyaml==6.0.2"
      - name: نطاق البيئة والأسرار وبنية private-ci.yml
        run: python3 jobs/private_ci/test_env_scope.py -v
      - name: اختبارات الحارس والرافع والخطة والحالة
        run: python3 -m unittest discover -s jobs/private_ci -p 'test_*.py' -v
