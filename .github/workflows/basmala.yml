name: rafiq-basmala

# تمريرة قصّ البسملة على فهارس `timings-staging/` — عشرون وظيفة متوازية.
#
# ⛔ **وظيفةٌ مستقلة عن `audio_qa` عمداً** (ترجيحي وقرار github-f4): التدقيق
#    **يحكم ولا يغيّر**، والقصّ **يغيّر ولا يحكم**. وخلطهما يجعل فشل أحدهما
#    يحجب الآخر، ويجعل مخرَجاً مُعدَّلاً يبدو كأنه حكمٌ على الأصل.
#
# ⛔ ولا تكتب هذه الوظيفة في الدلو بحال: مخرَجها **artifact**. سببه قاعدة
#    «كل كاتبٍ إلى الدلو يحمل حرّاسه داخله» — وقد دخل staging الليلة كاتبٌ
#    ثالث بلا حارس فكشفناه بميتاداتا فارغة. فلا نضيف رابعاً.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "بادئة المفاتيح"
        default: "timings-staging/"
      limit:
        description: "عدد الفهارس في الدفعة (= عدد الوظائف، ≤20)"
        default: "20"
      only:
        description: "مفتاحٌ بعينه — للتشخيص"
        default: ""
      upload:
        description: "⛔ ارفع المقصوص إلى timings-staging ببصمة جديدة (بإذن صريح فقط)"
        type: boolean
        default: false

# ⛔ لا مجموعة تزاحم (أُزيلت 2026-09-03 كما في audio_qa — D-090): كانت تُلغي
#    المعلّق فتمنع إطلاق خمسة إصلاحات معاً؛ والتزاحم الحقيقي على سقف الحساب.

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet boto3
      - id: gen
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          PREFIX: ${{ github.event.inputs.prefix }}
          LIMIT: ${{ github.event.inputs.limit }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, boto3
          only = os.environ.get("ONLY", "").strip()
          if only:
              print(f"matrix={json.dumps([only])}")
              raise SystemExit
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          ks = []
          for p in s3.get_paginator("list_objects_v2").paginate(
                  Bucket=c["bucket"], Prefix=os.environ["PREFIX"]):
              for o in p.get("Contents", []):
                  if o["Key"].endswith(".jz") and ".basmala." not in o["Key"]:
                      ks.append((o["LastModified"], o["Key"]))
          ks.sort()
          print(f"matrix={json.dumps([k for _, k in ks][: int(os.environ['LIMIT'])])}")
          PY

  pass:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120        # التمريرة دقائق: 256ك.ب لكل سورة بترويسة Range
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        key: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: أدوات النظام
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet pywhispercpp numpy boto3

      - name: كاش النموذج
        uses: actions/cache@v4
        with:
          path: assets-archive/ggml
          key: qa-model-q8-v1     # ⛔ المفتاح نفسه الذي في audio_qa: نموذجٌ واحد لا نسختان

      - name: الاعتماد والنموذج والفهرس
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          KEY: ${{ matrix.key }}
        run: |
          mkdir -p secure work
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY'
          import json, os, boto3
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          m = "assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin"
          if not (os.path.exists(m) and os.path.getsize(m) > 10_000_000):
              os.makedirs(os.path.dirname(m), exist_ok=True)
              s3.download_file(c["bucket"], "models/whisper-tiny-ar-quran/ggml-q8_0.bin", m)
          key = os.environ["KEY"]
          s3.download_file(c["bucket"], key, "work/index.jz")
          print("الفهرس:", key, os.path.getsize("work/index.jz") // 1024, "ك.ب")
          PY

      # ⚠️ قالب مصدر الصوت يُشتقّ من القارئ: يُقرأ من قائمة القرّاء في المستودع
      #    ولا يُخمَّن — قالبٌ خاطئ يُنزّل صوتَ قارئٍ آخر فيُنتج قصّاً كاذباً.
      # ⛔ برهان الاستيراد قبل أي تنزيل — **للمرة الرابعة اليوم يسقط أنبوبٌ
      #    لأنّي نسختُ ملفاً ولم أنسخ حزمته** (‏coverage_guard · run.py ·
      #    basmala_local). الدرس لم يعد «انسخ الحزمة» بل: **كل أنبوبٍ يبرهن
      #    استيراد أداته قبل أن ينفق دقيقةً واحدة على تنزيل.**
      - name: برهان أداة البسملة (⛔ قبل أي تنزيل)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools/tasmi_bench")
          import basmala_postpass  # noqa: F401
          print("✅ basmala_postpass وتبعياتها تُستورَد")
          PY

      - name: تمريرة البسملة
        id: pass
        env:
          # ⛔ النموذج بمسار الأداة الخاص بها (‏--model) لا بـQA_MODEL: كلٌّ
          #    يقرأ من متغيّره، ونمرّره صراحةً فلا نعتمد على افتراضٍ يتغيّر.
          KEY: ${{ matrix.key }}
        run: |
          rid="$(basename "$KEY" | cut -d. -f1)"
          # ⛔ **كلُّ قوائم المستودع لا قائمتان** (‏تصحيحُ 2026-09-05): كان
          #    البحثُ محصوراً في `reciters_ci*.tsv`، فسقطت تمريرةُ البسملة على
          #    كلِّ قارئٍ أُضيف في قائمةٍ جديدة بـ«لا قالب صوت» — وهو **قصورُ
          #    بحثٍ لا نقصُ بيانات**: القالبُ موجودٌ في `reciters_wq_gen1.tsv`.
          tpl="$(awk -F'	' -v r="$rid" '!/^#/ && $1==r {print $3; exit}'                  tools/ci_fleet/reciters_*.tsv 2>/dev/null | head -1)"
          if [ -z "$tpl" ]; then
            echo "⛔ لا قالب صوتٍ للقارئ '$rid' في قوائم المستودع — لا تخمين."
            exit 1
          fi
          echo "القارئ: $rid · المصدر: $tpl"
          rc=0
          python tools/tasmi_bench/basmala_postpass.py             --index work/index.jz             --url-template "$(echo "$tpl" | sed 's/{surah:03d}/{s:03d}/')"             --model "$GITHUB_WORKSPACE/assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin"             --out "work/$rid.basmala.jz"             --table "work/${rid}_table.json"             --fail-on-unverified --summary | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # ⛔ رمزٌ مميِّز لا فشلٌ أحمر (تنبيه github-8e، وهو محقّ):
          #    0 لا شيء يحتاج قصّاً · 1 قُصّ كل ما وجب · 2 بقيت حالاتٌ غير
          #    متحقَّقة. **و2 ليس فشلاً**: تلك الحالات **كانت قبل التمريرة ولم
          #    تسوء بها**، فتحميرُ الوظيفة عليها يعلّم الناس تجاهُل الأحمر —
          #    وذاك أسوأ من الخضرة الكاذبة التي نتقيها. فيُوسَم تحذيراً ويُرى.
          if [ "$rc" -eq 2 ]; then
            echo "> ⚠️ **بقيت حالات «بسملة بلا قصّ متحقَّق»** — تحذيرٌ لا فشل: حالٌ سابقةٌ للتمريرة."               >> "$GITHUB_STEP_SUMMARY"
          elif [ "$rc" -gt 2 ]; then
            echo "⛔ خطأ تنفيذ (rc=$rc)"; exit "$rc"
          fi

      # ⛔ الرفع **مأذونٌ لهذا المسار وحده** (أمر github-f4 على `s_alquraishi`):
      #    التمريرة تُغيّر ولا تحكم، فلا تكتب في الدلو عادةً. وحين يُؤذن، ترفع
      #    **ببصمةٍ جديدة** ووسمَي `transform` و`parent` — فيُعرف من أين جاء
      #    الفهرس وبأي تحويل، ولا يلتبس بأصله. ⛔ ولا ترقية من CI.
      - name: رفع المقصوص (بإذن، وببصمة جديدة)
        if: ${{ github.event.inputs.upload == 'true' }}
        env:
          KEY: ${{ matrix.key }}
        run: |
          rid="$(basename "$KEY" | cut -d. -f1)"
          out="work/$rid.basmala.jz"
          if [ ! -s "$out" ]; then echo "⛔ لا مخرَج مقصوص — لا رفع"; exit 1; fi
          python - <<'PY'
          import hashlib, json, os, sys, boto3
          sys.path.insert(0, "tools/ci_fleet")
          from stage_upload import frozen_refuse            # ⛔ حارس التجميد نفسه لا نسخةٌ منه
          key = os.environ["KEY"]
          rid = os.path.basename(key).split(".")[0]
          parent = os.path.basename(key).split(".")[1]
          riwaya = key.split("/")[1]
          refuse, why = frozen_refuse(riwaya, rid)
          if refuse:
              print(f"🧊 {why} — لا رفع"); raise SystemExit(2)
          out = f"work/{rid}.basmala.jz"
          blob = open(out, "rb").read()
          sha8 = hashlib.sha256(blob).hexdigest()[:8]
          tbl = json.load(open(f"work/{rid}_table.json", encoding="utf-8"))
          cut = [str(r["surah"]) for r in tbl.get("rows", []) if "قُصّت" in r.get("verdict", "")]
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          dst = f"timings-staging/{riwaya}/{rid}.{sha8}.jz"
          assert dst.startswith("timings-staging/"), dst
          try:                                  # ⛔ لا كتابة فوق موجود
              s3.head_object(Bucket=c["bucket"], Key=dst)
              print(f"⛔ {dst} موجودٌ سلفاً — والبصمة من المحتوى، فالموجود مطابق. لا كتابة.")
              raise SystemExit(0)
          except s3.exceptions.ClientError:
              pass
          s3.put_object(Bucket=c["bucket"], Key=dst, Body=blob,
                        ContentType="application/gzip",
                        Metadata={"partial": "false", "sha256-8": sha8,
                                  "source": "ci:" + os.environ.get("GITHUB_RUN_ID", "?"),
                                  "transform": "basmala_fix:" + ",".join(cut),
                                  "parent": parent})
          print(f"⬆️ {dst} · قُصّ {len(cut)} سورة: {','.join(cut)} · الأصل {parent}")
          PY

      - name: المخرَج (الفهرس المقصوص والجدول)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basmala-${{ strategy.job-index }}
          # ⛔ الفهرس المقصوص نفسه مخرَجٌ لا الجدول وحده: هو المادة التي
          #    يُقرّر عليها الاستبدال، وبلا رفعه يصير التقرير حكماً بلا شاهد.
          path: |
            work/*.json
            work/*.basmala.jz
          if-no-files-found: warn
          retention-days: 7
