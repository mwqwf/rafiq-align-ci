name: keepalive-contract
on:
  push:
    paths:
      - .github/workflows/keepalive.yml
      - .github/workflows/restore.yml
      - .github/workflows/keepalive-contract.yml
      - tools/ci_fleet/restore_loop.py
      - tools/ci_fleet/blocked_realigns.json
      - tools/ci_fleet/reciters_remaining.tsv
      - tools/ci_fleet/test_keepalive_contract.py
      - tools/ci_fleet/test_agent_cmd_contract.py
      - tools/ci_fleet/agent_cmd.py
      - .github/workflows/package-catalog-cloud.yml
      - tools/ci_fleet/test_restore_loop.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keepalive-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Owner financial stop 2026-09-18: no runner allocation until verified free.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2 boto3
      - run: python -m unittest discover -s tools/ci_fleet -p 'test_*contract.py' -v
      - run: python -m unittest tools.ci_fleet.test_restore_loop -v
