name: rafiq-ctc-splice

run-name: >-
  ctc-splice ${{ inputs.parent }}${{ inputs.surahs && format(' · س{0}', inputs.surahs) || '' }}

# ⭐ **محاذاةُ سور النقص وحدها بـCTC ودمجُها في الفهرس المنشور** (‏إذن المالك
#    2026-09-24: «نفّذ التسريع … المهمُّ ألّا يمسّ القرآنَ بشيء»).
#    كان القارئُ المنشورُ بـWhisper يُعاد كاملاً بـCTC (‏4 أجزاء + خاتم ≈ ساعةٌ ونصف)
#    لأجل آياتٍ غائبةٍ في سورٍ قليلة، ثمّ يُرقّى فقط إن زاد مجموعُه — فسورةٌ
#    تحسّنت وأخرى ساءت تتقاصّان. وهنا وظيفةٌ واحدة تحاذي سورَ النقص وحدها،
#    وتأخذ منها **ما حُلَّ كاملاً فقط**، ولا تمسّ ما سواها بايتاً.
#
# ⛔ والحُرّاسُ زائدةٌ لا ناقصة:
#    - القالبُ يُطابَق بالكتالوج قبل تنزيل بايت (‏كما في realign_surah).
#    - ‏`splice_surah --skip-unresolved`: سورةٌ فيها آيةٌ بلا حدود تُترك كما هي،
#      وما خارج السور المأخوذة يُقارَن حرفاً.
#    - الترويسةُ تُعلن `engineBySurah` لكلّ سورةٍ مأخوذة، و`stage_transform`
#      يردّ إعلاناً ناقصاً.
#    - الترقيةُ تطلب **إحصاءً صوتيّاً شاملاً لكلّ آيةٍ** في تلك السور
#      (‏`splice_census.yml`) فوق الملوح الأربعة للفهرس كلّه.
# 💰 مستودعٌ عامّ + عدّاد ubuntu-latest القياسيّ ⇒ دقائقُ مجّانيّة.
on:
  workflow_dispatch:
    inputs:
      parent: {description: "الأصل المنشور: timings/<riw>/<id>.jz", required: true}
      url_template: {description: "قالبُ الصوت من الكتالوج فيه {s:03d}، أو أساسُ المجلَّد نفسُه (‏الروابطُ من الأب)", required: true}
      riwaya: {description: "الرواية", default: "hafs"}
      surahs: {description: "فارغ = كلُّ سورةٍ ناقصةٍ في الأصل (مقيسةً منه)", default: ""}
      reason: {description: "سببُ التحويل", required: true}
      mode: {description: "full = CTC للسورة كاملة · window = قسمةُ المدخل الذي ابتلع جارتَه بنافذته وحدها (ctc_gapsplit) · heard = خريطةُ السماع ثمّ نوافذُ على مراسٍ مسموعة لتسجيلٍ فيه زيادةٌ أو تكرار (ctc_heard_map) · dualfix = تصحيحُ حدود مرشّح heardmap (base_key) بما اتّفق عليه النموذجان المثبَّتان (ctc_dualfix)", default: "full"}
      base_key: {description: "وضعُ dualfix وحده: مفتاحُ مرشّح heardmap في timings-staging تُصحَّح حدودُه بما اتّفق عليه النموذجان المثبَّتان (ctc_dualfix)", default: ""}
      rewindow: {description: "أوضاعُ window وdualfix وheard (‏heard: تسميةُ المدى المعطوب المقيس شرطٌ لسورةٍ تامّة)؛ وضعا window وdualfix (بالنموذج القرآنيّ بين جارَين ثابتَين، مثل 38:44-51,38:80-88): مدى آياتٍ حاضرةٍ حدودُها معطوبةٌ يُعاد بنافذته بين جارتين ثابتتين، مثل 55:41-75؛ والطرفان: 89:1-2/nb (من بدء الملفّ، /nb = بلا بسملة بشاهد السماع) و92:20-21 (حتى نهاية الملفّ)", default: ""}
      heard_witness: {description: "وضعُ window وحده (fixS2 · بإذن المالك): يُقبل حدُّ المدّة الأعلى (2×) فقط لآيةٍ يوافق حدّاها خريطةَ السماع (ctc_heard_map) بفرقٍ مقيس ≤700/1000م.ث ومِرساةٍ ≥0.85 منفردة", default: "false"}
      truncated_tail: {description: "وضعُ full وحده (أمر المالك 2026-10-02): سورةٌ واحدةٌ مصدرُها مبتورُ الذيل تُحاذى بادئتُها 1..N بالنموذج القرآني المثبَّت ويُعلَن ذيلُها source_truncated — «24:30»؛ وsurahs = السورةُ نفسُها", default: ""}

concurrency:
  group: rafiq-ctc-splice-${{ inputs.parent }}
  cancel-in-progress: false

env:
  PY: "3.11"
  ALIGN_ENGINE: ctc
  HF_HOME: ${{ github.workspace }}/.hf

jobs:
  splice:
    name: ctc-splice ${{ github.event.inputs.parent }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PY }}"}
      - name: الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet "numpy<2" transformers ctc-segmentation boto3 rapidfuzz
      - name: كاش النموذج
        uses: actions/cache@v4
        with:
          path: .hf
          key: ctc-model-jonatasgrosman-xlsr53-ar-v1
      - name: اعتماد R2
        env: {R2_CREDENTIALS_JSON: "${{ secrets.R2_CREDENTIALS_JSON }}"}
        run: mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json

      - name: ⛔ حارسُ الرابط وسورُ النقص من الأصل نفسه
        id: plan
        env:
          PARENT: ${{ github.event.inputs.parent }}
          URLT: ${{ github.event.inputs.url_template }}
          RIW: ${{ github.event.inputs.riwaya }}
          WANT: ${{ github.event.inputs.surahs }}
          MODE: ${{ github.event.inputs.mode }}
          TRUNC: ${{ github.event.inputs.truncated_tail }}
          REWIN: ${{ github.event.inputs.rewindow }}
        run: |
          python - <<'PY'
          import gzip, hashlib, json, os, re, sys, boto3
          # ⭐ الذيلُ المبتور (أمر المالك 2026-10-02): سورةٌ واحدةٌ مسمّاةٌ في surahs هي نفسُها،
          #    وفي وضع full وحده، وبقالبٍ مرقَّمٍ من الكتالوج — يُوقَف قبل تنزيل بايت إن اختلّ شرط.
          trunc = os.environ.get("TRUNC", "").strip()
          if trunc:
              m = re.fullmatch(r"(\d{1,3}):(\d{1,3})", trunc)
              if not m or os.environ.get("MODE", "full") != "full":
                  sys.exit(f"⛔ truncated_tail بصيغة سورة:N في وضع full وحده: {trunc!r}")
              if os.environ.get("WANT", "").strip() != m.group(1):
                  sys.exit(f"⛔ truncated_tail يسمّي س{m.group(1)} وsurahs = {os.environ.get('WANT')!r} — يجب أن تتطابقا")
          sys.stdout.reconfigure(encoding="utf-8")
          sys.path.insert(0, "tools/index_qa")
          from splice_surah import COUNTS
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          parent = os.environ["PARENT"]
          # ⭐ (2026-10-02 · fixF) أو مرشّحٌ في المسرح `timings-staging/<riw>/<id>.<sha8>.jz` — كما يقبله
          #    `realign_surah` — ليُجمع أكثرُ من إصلاحٍ في مرشّحٍ واحدٍ للفهرس (‏الغربي: إعادةُ محاذاة
          #    30/32/68 ثمّ نافذتا 55:2 و20:28) بدل ترقيتين. وسائرُ الحرّاس (الكتالوج · الهويّة · الحتميّة) كما هي.
          if not parent.startswith(("timings/", "timings-staging/")) or parent.count("/") != 2 or not parent.endswith(".jz"):
              sys.exit(f"⛔ الأصلُ يجب أن يكون منشوراً timings/<riw>/<id>.jz أو مرشّحاً timings-staging/<riw>/<id>.<sha8>.jz: {parent}")
          _, riw, fn = parent.split("/")
          rid = fn[:-3].split(".")[0]
          if riw != os.environ["RIW"]:
              sys.exit(f"⛔ الرواية {os.environ['RIW']} والأصلُ {riw}")
          cat = json.loads(s3.get_object(Bucket=c["bucket"], Key="catalog/reciters.json")["Body"].read())
          base, files = None, None
          for r in cat.get("riwayat", []):
              if r["id"] == riw:
                  for x in r.get("reciters", []):
                      if x.get("id") == rid:
                          base = x.get("base") or ""
                          files = x.get("files")
          if base is None:
              sys.exit(f"⛔ {riw}/{rid} ليس في الكتالوج — لا محاذاةَ لمجهول")
          got = os.environ["URLT"]
          want_t = (base if base.endswith("/") else base + "/") + "{s:03d}.mp3"
          # ⭐ (2026-09-28) مضيفُ المجلَّد (‏أسماءٌ من جدول files) يُقبل **بأساس
          #    الكتالوج نفسِه حرفاً** وجدولٍ من 114 اسماً؛ و`fileRef` كلِّ سورةٍ
          #    يُؤخذ من مدخلاتها في الأب (‏`splice_surah --refs-from-parent`)
          #    ويجب أن يساوي أساسَ الكتالوج + اسمَها في الجدول — وإلا يُوقَف.
          #    ⛔ والبديلُ المسجَّل لا يجتمع معه: البديلُ قالبٌ مرقَّمٌ وحده.
          folder = False
          urlt = got
          if "{s:03d}" not in got:
              if "{" in got or not base or "{" in base or got.rstrip("/") != base.rstrip("/"):
                  sys.exit(f"⛔ أساسُ مجلَّدٍ يخالف الكتالوج — يُوقَف قبل تنزيل بايت\n   المعطى {got}\n   الكتالوج {base!r}")
              if not isinstance(files, list) or len(files) != 114 or not all(isinstance(n, str) and n for n in files):
                  sys.exit(f"⛔ مضيفُ مجلَّدٍ بلا جدول files من 114 اسماً لـ{rid} — لا يُخمَّن اسمُ ملفّ")
              folder = True
              urlt = base.rstrip("/") + "/"
          # ⭐ (2026-09-26، بإذن المالك النصّيّ) أو بديلٌ مسجَّلٌ في `source_overrides.json`
          #    لسورٍ مسمّاةٍ صراحةً كلُّها مسجَّلةٌ لهذا القارئ بهذا المصدر نفسِه، لا غير.
          #    فسورةٌ لا يحاذيها Whisper لغياب السكتات (الرحمن عند الركباوي وبلعالية)
          #    تُحاذى بـCTC من مصحف القارئ نفسِه. وسائرُ الحُرّاس (البصمة والإحصاء
          #    والملوح وحارس البتر) تبقى كما هي.
          alt = False
          if not folder and got != want_t:
              ov = json.load(open("tools/ci_fleet/source_overrides.json", encoding="utf-8"))
              ov = ov if isinstance(ov, list) else ov.get("overrides", [])
              asked0 = [int(x) for x in re.findall(r"\d+", os.environ.get("WANT", ""))]
              reg = {int(o["surah"]) for o in ov
                     if o.get("riwaya") == riw and o.get("reciter") == rid
                     and (o["base"] if o["base"].endswith("/") else o["base"] + "/") + "{s:03d}.mp3" == got}
              if not asked0 or not set(asked0) <= reg:
                  sys.exit(f"⛔ القالبُ يخالف الكتالوج ولا بديلَ مسجَّلاً لكلّ السور المسمّاة — يُوقَف قبل تنزيل بايت\n   المعطى {got}\n   الكتالوج {want_t}\n   المسجَّل {sorted(reg)} · المطلوب {asked0}")
              alt = True
              print(f"⭐ بديلٌ مسجَّلٌ لـ{asked0}: {got}")
          body = s3.get_object(Bucket=c["bucket"], Key=parent)["Body"].read()
          open("parent.jz", "wb").write(body)
          idx = json.loads(gzip.decompress(body).decode("utf-8"))
          if idx.get("reciterId") != rid or idx.get("riwaya") != riw:
              sys.exit("⛔ الأصلُ يصف قارئاً آخر")
          # ⛔ المحرّكُ حتميّ: على ملفّ الكتالوج نفسِه يعيد النقصَ نفسَه؛ ومن بديلٍ
          #    مسجَّلٍ فالمدخلُ غيرُه فيُسمح. ووضعا window وheard مُدخَلُهما غيرُ المحاذاة الرتيبة
          #    (‏نافذةُ الجارتين · نوافذُ على مراسٍ مسموعة) فيُسمح بهما على الملفّ نفسِه.
          if idx.get("engineVersion") == "ctc-seg-1" and not alt and os.environ.get("MODE", "full") not in ("window", "heard", "dualfix"):
              sys.exit("⛔ الأصلُ منشورٌ بـCTC نفسِه — المحرّكُ حتميّ فإعادتُه تعيد النقصَ نفسَه")
          have = {}
          for e in idx["entries"]:
              s = int(e["ayahId"].split(":")[0]); have[s] = have.get(s, 0) + 1
          gaps = [s for s in range(1, 115) if have.get(s, 0) < COUNTS[s - 1]]
          asked = [int(x) for x in re.findall(r"\d+", os.environ.get("WANT", ""))]
          todo = asked or gaps
          extra = [s for s in todo if s not in gaps]
          # ⭐ وضعُ dualfix يصحّح حدودَ سورةٍ **تامّةٍ** في الأصل بطبيعته (‏2026-10-02: الصافاتُ نُشرت
          #    ثمّ تُصحَّح 37:88/99/109) — فالتمامُ شرطُه لا مانعُه، والدمجُ يحرس ما خارجَها حرفاً.
          # ⭐ (2026-10-02 · fixF · الغربي 55:2 و20:28) وضعُ window بـ`rewindow` بابُه **آياتٌ حاضرةٌ
          #    حدودُها معطوبة** (‏آيةٌ بلا تلاوة 300م.ث بين جارتين) — فسورةٌ تامّةٌ تُقبل فيه إن كانت
          #    **كلُّ** سورةٍ تامّةٍ مسمّاةً في rewindow؛ وما خارج المدى يحرسه الدمجُ حرفاً.
          rewin_surahs = {int(x.split(":")[0]) for x in os.environ.get("REWIN", "").split(",") if ":" in x}
          if extra and os.environ.get("MODE", "full") == "window" and set(extra) <= rewin_surahs:
              print(f"⭐ سورٌ تامّةٌ تُعاد نافذةُ مدىً منها (rewindow): {extra}")
              extra = []
          # ⭐ (2026-10-03 · fixS1) ووضعُ heard بالشرط نفسِه: سورةٌ تامّةٌ في الأصل **كبس** المنشورُ ذيلَها
          #    (‏خريطةُ السماع: 18:85 عند الشحات منشورةٌ قبل موضعها بـ112ث، والنساء عند mustafa بـ1492ث)
          #    وردّت نوافذُ الجارتين مداها بحرّاسها ⇒ تُبنى السورةُ من مراسٍ مسموعة، **بشرط** أن يُسمّى
          #    المدى المعطوبُ المقيسُ في rewindow لكلّ سورةٍ تامّة (‏فلا تُعاد سورةٌ سليمةٌ بلا قياس)،
          #    والإحصاءُ الشاملُ للسورة كلِّها والملوحُ الأربعةُ حَكَمٌ كما هي.
          if extra and os.environ.get("MODE", "full") == "heard" and set(extra) <= rewin_surahs:
              print(f"⭐ سورٌ تامّةٌ معطوبةُ المدى بقياس السماع تُبنى من مراسٍ مسموعة: {extra}")
              extra = []
          if extra and os.environ.get("MODE", "full") != "dualfix":
              sys.exit(f"⛔ سورٌ تامّةٌ في الأصل لا تُمسّ: {extra}")
          if not todo:
              sys.exit("⛔ لا نقصَ في الأصل — لا شيء يُحاذى")
          if folder:
              # ⛔ الرابطُ من الأب حرفاً، ويُطابَق بما سيُنزَّل فعلاً (‏batch_run
              #    يبني أساسَ الكتالوج + اسمَ الجدول) — سورةٌ بلا مدخلٍ في الأب
              #    أو بروابطَ مختلفة أو برابطٍ غيرِ هذا تُردّ هنا قبل تنزيل بايت.
              from splice_surah import parent_refs
              refs = parent_refs(idx["entries"], todo)
              bad = {s: r for s, r in refs.items() if r != urlt + files[s - 1]}
              if bad:
                  sys.exit("⛔ روابطُ الأب تخالف أساسَ الكتالوج + جدولَ files: "
                           + " · ".join(f"س{s}: {r} ≠ {urlt + files[s - 1]}" for s, r in bad.items()))
              print("📇 مضيفُ مجلَّد — الروابطُ من الأب:", {s: refs[s] for s in todo})
          sha = hashlib.sha256(body).hexdigest()
          print(f"الأصل {parent} ({sha[:12]}) · محرّكه {idx.get('engineVersion')} · "
                f"سورُ النقص {len(gaps)} · المطلوبة {todo}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"rid={rid}\nsha={sha}\nsurahs={','.join(map(str, todo))}\n"
                      f"alt={'1' if alt else ''}\nfolder={'1' if folder else ''}\n"
                      f"urlt={urlt}\n")
          PY

      - name: المحاذاة بـCTC لسور النقص وحدها (⛔ بلا رفع)
        env:
          URLT: ${{ steps.plan.outputs.urlt }}
          RIW: ${{ github.event.inputs.riwaya }}
          RID: ${{ steps.plan.outputs.rid }}
          SURAHS: ${{ steps.plan.outputs.surahs }}
          MODE: ${{ github.event.inputs.mode }}
          REWIN: ${{ github.event.inputs.rewindow }}
          BASEKEY: ${{ github.event.inputs.base_key }}
          TRUNC: ${{ github.event.inputs.truncated_tail }}
          HW: ${{ github.event.inputs.heard_witness }}
        run: |
          set -o pipefail
          if [ "$HW" = "true" ] && [ "$MODE" != "window" ]; then echo "⛔ heard_witness لوضع window وحده"; exit 1; fi
          if [ "$MODE" = "dualfix" ]; then
            # ⭐ تصحيحُ حدود مرشّح heardmap بما اتّفق عليه النموذجان المثبَّتان (‏2026-10-02 · عاصم س38):
            #    لا حدَّ مختلَقاً — مقيسٌ باتّفاقٍ أو موروثٌ من المرشّح. float32 وخيطان كما في الشاهد.
            [ -n "$BASEKEY" ] || { echo "⛔ وضعُ dualfix يلزمه base_key"; exit 1; }
            python -m unittest tools/alignment_v3/test_ctc_dualfix.py
            for s in $(echo "$SURAHS" | tr ',' ' '); do
              U="$(python -c "import sys; print(sys.argv[1].format(s=int(sys.argv[2])))" "$URLT" "$s")"
              CTC_INT8=0 CTC_THREADS=2 python tools/alignment_v3/ctc_dualfix.py --base-key "$BASEKEY" --url "$U" \
                --surah "$s" --riwaya "$RIW" --out-dir "tools/alignment/work/batch_$RID" --rewindow "$REWIN" 2>&1 | tee -a ctc.log
            done
            exit 0
          fi
          if [ -n "$TRUNC" ]; then
            # ⭐ بادئةُ سورةٍ مبتورةِ الذيل (أمر المالك 2026-10-02): نصُّ 1..N والآيةُ N+1 بالوعةً،
            #    بالنموذج القرآني المثبَّت البصمة (float32 · خيطان كما في القياس الذي أثبت 1..30 للعكري).
            case "$URLT" in *"{s:03d}"*) ;; *) echo "⛔ الذيلُ المبتور يلزمه قالبٌ مرقَّم من الكتالوج"; exit 1;; esac
            S="${TRUNC%%:*}"; K="${TRUNC##*:}"
            U="$(python -c "import sys; print(sys.argv[1].format(s=int(sys.argv[2])))" "$URLT" "$S")"
            CTC_INT8=0 CTC_THREADS=2 python tools/alignment_v3/ctc_prefix_align.py --url "$U" --surah "$S" \
              --riwaya "$RIW" --keep "$K" --quran-model --out-dir "tools/alignment/work/batch_$RID" 2>&1 | tee ctc.log
            exit 0
          fi
          if [ "$MODE" = "window" ]; then
            # ⭐ قسمةُ المبتلع بنافذة الجارتين وحدها — مداخلُ الأب كما هي إلا الجارتين.
            #    (‏fixS1 · 2026-10-03) والطرفان: «س:1-ب[/nb]» من بدء الملفّ و«س:أ-آخرُها» حتى نهايته — تُختبر أوّلاً.
            python -m unittest tools/alignment_v3/test_ctc_gapsplit_edges.py
            HWD=""
            if [ "$HW" = "true" ]; then
              # ⭐ شاهدُ السماع لحدّ المدّة الأعلى وحده — يُختبر أوّلاً، والخريطةُ بلا رفع لكلّ سورة.
              python -m unittest tools/alignment_v3/test_ctc_gapsplit_heard_witness.py
              HWD="tools/alignment/work/heard_$RID"; mkdir -p "$HWD"
              for s in $(echo "$SURAHS" | tr ',' ' '); do
                U="$(python -c "import sys; print(sys.argv[1].format(s=int(sys.argv[2])))" "$URLT" "$s")"
                python tools/alignment_v3/ctc_heard_map.py --url "$U" --surah "$s" --riwaya "$RIW" \
                  --out-dir "$HWD" --probe --report "$HWD/report_s$s.txt" 2>&1 | tail -3
              done
            fi
            python tools/alignment_v3/ctc_gapsplit.py --index parent.jz --surahs "$SURAHS" \
              --riwaya "$RIW" --out-dir "tools/alignment/work/batch_$RID" --rewindow "$REWIN" \
              ${HWD:+--heard-witness-dir "$HWD"} 2>&1 | tee ctc.log
            exit 0
          fi
          if [ "$MODE" = "heard" ]; then
            # ⭐ خريطةُ السماع ثمّ نوافذُ على مراسٍ مسموعة (‏2026-10-02 · عاصم س38): لتسجيلٍ طويلٍ
            #    فيه زيادةٌ أو تكرار. الأداةُ تُختبر أوّلاً، والمخرَجُ بصيغة batch_run نفسِها.
            python -m unittest tools/alignment_v3/test_ctc_heard_map.py
            for s in $(echo "$SURAHS" | tr ',' ' '); do
              U="$(python -c "import sys; print(sys.argv[1].format(s=int(sys.argv[2])))" "$URLT" "$s")"
              python tools/alignment_v3/ctc_heard_map.py --url "$U" --surah "$s" --riwaya "$RIW" \
                --out-dir "tools/alignment/work/batch_$RID" 2>&1 | tee -a ctc.log
            done
            exit 0
          fi
          sudo chmod 755 /root
          # ‏batch_run يكتب ملفَّ سورةٍ لكلّ ما نجح؛ وفهرسُه الجزئيُّ في آخره لا يُستعمل.
          # ‏وأساسُ المجلَّد (‏بلا {s:03d}) يمرّ كما هو فيقرأ batch_run جدولَ files.
          BASE="$(printf '%s' "$URLT" | sed 's/{s:03d}/{surah:03d}/')"
          python tools/alignment/batch_run.py --reciter "$RID" --riwaya "$RIW" \
            --base "$BASE" --surahs "$SURAHS" 2>&1 | tee ctc.log

      - name: الدمجُ بحُرّاسه وبصماتُ الصوت
        env:
          URLT: ${{ steps.plan.outputs.urlt }}
          FOLDER: ${{ steps.plan.outputs.folder }}
          RID: ${{ steps.plan.outputs.rid }}
          SURAHS: ${{ steps.plan.outputs.surahs }}
          ALT: ${{ steps.plan.outputs.alt }}
          MODE: ${{ github.event.inputs.mode }}
          TRUNC: ${{ github.event.inputs.truncated_tail }}
        run: |
          set -e
          d="tools/alignment/work/batch_$RID"
          # ⛔ (2026-09-28) المصدرُ البديلُ يُعلَن في `sourceBySurah` فيُحصى كلُّ آيةٍ منه.
          ALTF=""; [ -n "$ALT" ] && ALTF="--alt-source"
          # ⭐ وضعُ النافذة: الغيابُ الموروثُ من الأب يبقى غائباً ولا يُعدّ نقضاً (‏test_splice_keep_parent_gaps).
          ETAG="ctc-seg-1"
          if [ "$MODE" = "window" ]; then ALTF="$ALTF --keep-parent-gaps"; ETAG="ctc-gapsplit-1"; fi
          # ⭐ وضعُ السماع: محرّكٌ باسمه (‏promote.SPLICE_OPS) فيُعلَن ويلزمه الإحصاءُ الشامل.
          if [ "$MODE" = "heard" ]; then ETAG="ctc-heardmap-1"; fi
          if [ "$MODE" = "dualfix" ]; then ETAG="ctc-dualfix-1"; fi
          # ⭐ الذيلُ المبتور: بادئةٌ 1..N وحدها بمحرّك النموذج القرآني، وN من المُطلِق تُطابَق بإعلان المحاذي.
          if [ -n "$TRUNC" ]; then ALTF="$ALTF --truncated-tail $TRUNC"; ETAG="ctc-quran-surah-1"; fi
          # ⭐ مضيفُ المجلَّد: `fileRef` من الأب حرفاً (‏والتحقّقُ بعده يطابقه بالمنزَّل).
          [ -n "$FOLDER" ] && ALTF="$ALTF --refs-from-parent"
          S=""; F=""
          for s in $(echo "$SURAHS" | tr ',' ' '); do
            j=$(printf "%s/s%03d.json" "$d" "$s")
            if [ -f "$j" ]; then S="$S,$s"; F="$F $j"; else echo "⚠️ س$s: لم تُحاذَ — تبقى كما هي"; fi
          done
          S="${S#,}"
          [ -n "$S" ] || { echo "⛔ لا سورةَ حوذيت"; exit 1; }
          python tools/index_qa/splice_surah.py --index parent.jz --surah "$S" \
                 --aligned $F --url "$URLT" --skip-unresolved --engine-tag "$ETAG" $ALTF \
                 --out patched.jz
          python - <<'PY'
          import gzip, json, os
          d = f"tools/alignment/work/batch_{os.environ['RID']}"
          idx = json.loads(gzip.decompress(open("patched.jz", "rb").read()).decode())
          taken = [int(x) for x in open("patched.jz.taken").read().split(",") if x]
          present = sorted({int(e["ayahId"].split(":")[0]) for e in idx["entries"]})
          sha = idx.get("audioSha256")
          if isinstance(sha, list) and len(sha) == len(present):
              pos = {s: i for i, s in enumerate(present)}
              for s in taken:
                  rec = json.load(open(f"{d}/s{s:03d}.json", encoding="utf-8"))
                  # ⛔ الفهرسُ يُشير إلى ملفّ الكتالوج نفسِه — والبصمةُ من الملفّ
                  #    الذي نُزّل وحوذي فعلاً في هذه التشغيلة، لا مُصطنعة.
                  for e in idx["entries"]:
                      if int(e["ayahId"].split(":")[0]) == s and e["fileRef"] != rec["fileRef"]:
                          raise SystemExit(f"⛔ س{s}: fileRef المدموج {e['fileRef']} ≠ المحاذى {rec['fileRef']}")
                  if rec.get("sha256"):
                      if sha[pos[s]] and sha[pos[s]] != rec["sha256"]:
                          print(f"🔄 س{s}: بصمةُ الصوت تبدّلت عند المصدر — تُكتب المقيسة")
                      sha[pos[s]] = rec["sha256"]
              idx["audioSha256"] = sha
          else:
              print(f"⚠️ قائمةُ البصمات {len(sha) if isinstance(sha, list) else '—'} "
                    f"والسورُ {len(present)} — تُترك كما هي")
          with open("patched.jz", "wb") as f:
              f.write(gzip.compress(json.dumps(idx, ensure_ascii=False).encode("utf-8")))
          print("المأخوذ:", taken, "· engineBySurah:", idx.get("engineBySurah"),
                "· sourceBySurah:", idx.get("sourceBySurah"))
          PY

      - name: رفعٌ إلى الاختبار بحُرّاس stage_transform
        env:
          PARENT: ${{ github.event.inputs.parent }}
          SHA: ${{ steps.plan.outputs.sha }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          TAKEN="$(cat patched.jz.taken)"
          # ⭐ وضعُ النافذة وحده: الغيابُ الموروثُ يُقبل بلا غائبٍ جديد وبزيادةٍ فعليّة (test_stage_inherited_gaps).
          INH=""; OPN="ctc_surah_splice"
          if [ "${{ github.event.inputs.mode }}" = "window" ]; then INH="--allow-inherited-gaps"; OPN="ctc_gapsplit"; fi
          if [ "${{ github.event.inputs.mode }}" = "heard" ]; then OPN="ctc_heardmap_splice"; fi
          if [ "${{ github.event.inputs.mode }}" = "dualfix" ]; then OPN="ctc_dualfix_splice"; fi
          # ⭐ الذيلُ المبتور (أمر المالك 2026-10-02): الخيارُ الضيّق يُسمّي N صراحةً ويبقى الحارسُ الأصل كما هو.
          TRUNC="${{ github.event.inputs.truncated_tail }}"
          if [ -n "$TRUNC" ]; then OPN="ctc_quran_surah_splice"; INH="--owner-truncated-tail $TRUNC"; fi
          python tools/index_qa/stage_transform.py --file patched.jz \
                 --parent "$PARENT" --parent-sha "$SHA" \
                 --op "$OPN:$TAKEN" --reason "$REASON" \
                 --by "github-ctc-splice" $INH --yes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctc-splice-${{ github.run_id }}
          path: |
            tools/alignment/work/batch_*/s*.json
            ctc.log
          retention-days: 7
