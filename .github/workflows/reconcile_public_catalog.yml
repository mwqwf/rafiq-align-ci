name: rafiq-public-catalog-reconciliation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rafiq-public-catalog-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: ${{ github.repository == 'mwqwf/rafiq-align-ci' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - run: python tools/index_qa/reconcile_public_catalog.py
