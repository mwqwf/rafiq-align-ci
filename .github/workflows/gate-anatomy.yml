# 🔬 **تشريحُ الكشف صنفاً صنفاً لشوطِ بوّابةٍ مضى** — بلا محاكٍ وبلا عتادٍ يُنزَّل على جهاز أحد.
#
# ⛔ **لِمَ وُجد — بسببٍ مقيسٍ لا مفترَض** (‏2026-09-13): صفُّ «كشف» في جدول البوّابة **لا يرى
# `INSERT`** (‏D-351)، فنموذجٌ يسمع الكلمةَ الدخيلةَ **أكثر** يظهر في ذلك الصفّ **أقلَّ كشفاً**.
# وحسمُ ذلك يحتاج `detect_anatomy.py` على فرضيّات الشوط، وهي في مصنوعةٍ وفي R2 — **وكلتاهما
# محجوبةٌ (403) عن الوكيل السحابيّ**. فقرأت مناوبتان الشوطَ نفسَه (`34740158210`) وانتهتا إلى
# **حكمَين متعاكسَين** لأنّ إحداهما لم تستطع التشريح. ⇒ **مَن حُجب عنه العتادُ يُشرِّح في الشوط**:
# العدّاءُ ينزّل الفرضيّات من R2 العامّ (لا حجبَ عليه) ويُودع الجدولَ **ملفّاً في git** يقرؤه
# الوكيلُ بـ`git pull` والمالكُ من هاتفه.
#
#   ‏الشوطُ يكلّف دقائقَ معدودةً (لا محاكي) — فلا يُضَنّ به على حكمٍ مشتبَه.
name: gate-anatomy
# ⛔⛔ **وزنادُه الإيداعُ لا `workflow_dispatch` وحدَه — بسببٍ مقيسٍ 2026-09-13:**
# بيانةُ الوكيل السحابيّ **لا تستطيع الإدلاء**: `POST …/dispatches` يردّ
# `403 Resource not accessible by integration` — وجُرّب على `keepalive.yml` أيضاً فردَّ الشيءَ
# نفسَه ⇒ **المنعُ في الصلاحيّة لا في المسار الجديد**. والوكيلُ **يستطيع الدفعَ إلى `main`**.
# ⇒ فصار الطلبُ ملفّاً يُدفع: `tools/tasmi_bench/requests/anatomy.json` ‏(`tag` · `arms` · `sets` · `chain`)،
# **فمن قدر على الدفع قدر على إشعال الحوسبة** بلا أن يُطلب من المالك مفتاحٌ ولا نقرةٌ.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "وسمُ شوط البوّابة (مجلدُه في R2: finetune/gate/<tag>/)"
        required: true
      arms:
        description: "الذراعان مفصولتَين بمسافة — بأسمائهما كما في ملفّات الفرضيّات (مثل: shipped-W v2-vs-tiny-ar-W)"
        required: true
      sets:
        description: "مجموعاتُ الحقن الروائيّ (‏`restore_probe` لا يقرأ إلّا ما بدأ بـ`g3r`)"
        required: false
        default: "g3r-clean g3r-noisy"
      chain:
        description: "سلسلةُ الواجهة كما كُتبت في اسم الملفّ (‏cap المقيس)"
        required: false
        default: "cap"
  push:
    paths:
      - "tools/tasmi_bench/requests/anatomy.json"
# 🔑 صلاحيّةٌ واحدةٌ: إيداعُ الجدول في المستودع. ⛔ ولا تعليقَ آليّاً في لوحة المتابعة —
# **المعنى يكتبه الوكيل**، ورقمٌ بلا معناه لا يُرسَل إلى هاتف المالك.
permissions:
  contents: write
env:
  PUB: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev
jobs:
  anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: الطلبُ — من الإدلاء أو من الملفِّ المدفوع
        env:
          I_TAG: ${{ github.event.inputs.tag }}
          I_ARMS: ${{ github.event.inputs.arms }}
          I_SETS: ${{ github.event.inputs.sets }}
          I_CHAIN: ${{ github.event.inputs.chain }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys
          req = {}
          p = "tools/tasmi_bench/requests/anatomy.json"
          if os.path.exists(p):
              req = json.load(open(p, encoding="utf-8"))
          def pick(k, d=""):
              v = (os.environ.get("I_" + k.upper()) or "").strip()
              return v or str(req.get(k) or "").strip() or d
          tag, arms = pick("tag"), pick("arms")
          # ⛔ **الطلبُ الناقصُ يسقط هنا لا بعد تنزيلٍ فاشل:** «لا ملفّات» رسالةٌ تُقرأ حجباً في R2
          # وهي في الحقيقة طلبٌ بلا وسم. ⇒ يُسمّى النقصُ باسمه قبل أن يُلمس الشبكة.
          if not tag or len(arms.split()) != 2:
              sys.exit(f"⛔ طلبٌ ناقص: tag={tag!r} · arms={arms!r} — والأذرعُ اسمان بمسافةٍ لا أكثرَ ولا أقلّ")
          # 📝 و`note` سببُ الطلب بسطرٍ واحد — يُكتب في ملفّ النتيجة فيُعرف **لِمَ قُرئ** هذا
          # الشوطُ مرّةً ثانية، ولا يُظنّ تكراراً بلا سبب (درسُ D-365).
          note = pick("note").replace("\n", " ")[:200]
          # 🎛️ `rule_ab`: اسمُ ذراعٍ واحدةٍ يُقاس عليها **أثرُ قاعدةِ التعادل** (مسطرتان على
          # فرضيّاتٍ واحدة · D-366). فارغٌ = لا يُقاس. ⛔ وتُراجَع صحّةُ الاسم بأنّه إحدى الذراعَين.
          rule_ab = pick("rule_ab")
          if rule_ab and rule_ab not in arms.split():
              sys.exit(f"⛔ `rule_ab`={rule_ab!r} ليست إحدى الذراعَين {arms!r} — ولا تُقاس قاعدةٌ على فرضيّاتٍ لا تُنزَّل")
          for k, v in (("TAG", tag), ("ARMS", arms),
                       ("SETS", pick("sets", "g3r-clean g3r-noisy")), ("CHAIN", pick("chain", "cap")),
                       ("NOTE", note), ("RULE_AB", rule_ab)):
              print(f"{k}={v}")
          PY
          cat "$GITHUB_ENV"
      - name: تنزيلُ فرضيّات الشوط من R2 العامّ (‏بلا مفتاح)
        run: |
          cd tools/tasmi_bench && mkdir -p work && rm -f work/hyps_emu_*.json
          n=0
          # ⛔⛔ **والسلسلةُ تُجرَّب لكلّ ذراعٍ على حدة** (‏أُصلح 2026-09-13): ذراعان في الدلو على
          #     `g4n` — أصعبِ خليّةٍ نعرفها — محفوظتان بـ`caponly` و`gateonly`، وكان الطلبُ
          #     يبني الاسمَ بسلسلةٍ **واحدةٍ لكلّ الأذرع** ⇒ **لا تُقرآن أبداً** ولو طُلبتا،
          #     فيُظَنّ أنّ الفرضيّاتَ غائبةٌ من R2 وتُشعَل نصفُ ساعةِ محاكٍ على قياسٍ موجود.
          #     ⇒ تُجرَّب السلسلةُ المطلوبةُ أوّلاً ثمّ سائرُ السلاسل ثمّ **بلا سلسلة**، ويُقال
          #     بأيّها قُرئت — فمقارنةُ ذراعٍ بسلسلةٍ بأخرى بسلسلةٍ **قرارٌ يُرى لا يُخفى**.
          for s in $SETS; do
            for a in $ARMS; do
              got=""
              for c in "$CHAIN" cap caponly gateonly chain gate lvl __none__; do
                [ -n "$c" ] || continue
                if [ "$c" = "__none__" ]; then f="hyps_emu_${s}_${a}.json"; else f="hyps_emu_${s}_${c}_${a}.json"; fi
                u="$PUB/finetune/gate/$TAG/emu_$f"
                if curl -fsS --retry 2 -o "work/$f" "$u"; then
                  got="$f"
                  if [ "$c" = "$CHAIN" ]; then echo "✅ $f ($(wc -c < "work/$f") بايتاً)";
                  else echo "✅ $f — ⚠️ **بسلسلةٍ غيرِ المطلوبة** (‏$c لا $CHAIN) فيُقرأ ذلك في الجدول"; fi
                  n=$((n+1)); break
                fi
                rm -f "work/$f"
              done
              # ⚠️ والغائبُ يُسمّى بعنوانه: «لا تشريح» بلا اسمِ الملفّ الغائب يُقرأ عطباً في الأداة.
              [ -n "$got" ] || echo "⛔ غائبٌ بكلّ سلسلة: $PUB/finetune/gate/$TAG/emu_hyps_emu_${s}_*_${a}.json"
            done
          done
          # ⛔ **ذراعٌ واحدةٌ لا تُشرَّح:** التشريحُ فرقٌ بين ذراعَين، و`arms_or_die` يسقط بلا الثانية.
          [ "$n" -ge 2 ] || { echo "⛔ $n ملفاً فقط — والتشريحُ يحتاج ذراعَين على البنود عينِها"; exit 1; }
          # 🧹 **وفرضيّاتُ `g1` النظيفةِ إن كانت محفوظةً لهذا الوسم** — تُجرَّب ولا تُشترط:
          # بها يُقاس الزوائدُ الكاذبةُ على **تلاوةٍ صحيحةٍ** وهي الحالةُ الغالبةُ للمستخدم (‏D-368).
          # ⛔ **والشرطُ لكلِّ ذراعٍ على حدة — لا للذراعَين معاً** (‏عطبٌ مقيسٌ في الشوط
          # `34748763538`): طُلبت ذراعان إحداهما بلا `g1` فسقط الشرطُ **للاثنتَين** وتخطّى
          # الشوطُ قياسَ التهدئة **صامتاً** — فانتظرتُ رقماً لا يجيء. **والصمتُ ليس رقماً.**
          CA=""
          for a in $ARMS; do
            f="hyps_emu_g1_cap_${a}.json"
            if curl -fsS --retry 2 -o "work/$f" "$PUB/finetune/gate/$TAG/emu_$f"; then
              echo "✅ نظيفة: $f"; CA="$CA $a"
            else
              echo "ℹ️ لا فرضيّاتِ g1 لـ$a في هذا الوسم (يُقال ولا يُكتَم)"
            fi
          done
          CA="$(echo $CA | xargs echo)"
          echo "CLEAN_ARMS=$CA" >> "$GITHUB_ENV"
          # 📜 **وخطّةُ التلاوة الطويلة إن كانت محفوظةً لهذه المجموعات** — بها وحدَها يصير
          # لبنود `g4*` مرجعٌ (`pool_items` يقرأ `work/long_plan.json`)، وبلا ذلك تُطبع
          # «⛔ بلا مرجع» فيُظَنّ العطبُ في الأداة. وتُدمج بنودُ كلِّ مجموعةٍ وُجدت خطّتُها.
          rm -f work/long_plan.json
          for s in $SETS; do
            curl -fsS --retry 2 -o "work/lp_$s.json" "$PUB/finetune/gate/$TAG/emu_long_plan_$s.json" \
              && echo "📜 خطّةُ $s" || echo "ℹ️ لا خطّةَ طويلةً لـ$s (متوقَّعٌ لمجموعاتٍ قصيرة)"
          done
          python3 - <<'PY'
          import glob, json, os
          items, seen = [], set()
          for p in sorted(glob.glob("work/lp_*.json")):
              try:
                  d = json.load(open(p, encoding="utf-8"))
              except Exception as e:
                  print(f"⛔ خطّةٌ لا تُقرأ {p}: {e}")   # تُقال ولا تُكتَم
                  continue
              for it in d.get("items", []):
                  if it.get("id") in seen:
                      continue
                  seen.add(it["id"]); items.append(it)
          if items:
              json.dump({"items": items}, open("work/long_plan.json", "w", encoding="utf-8"),
                        ensure_ascii=False)
              print(f"📜 {len(items)} بنداً طويلاً لها مرجعٌ الآن")
          PY
          echo "CLEAN_OK=$([ -n "$CA" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
      - name: 📜 مرجعُ التلاوة الطويلة — يُعاد بناؤه **ويُصدَّق** إن لم يكن محفوظاً
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⭐ **لِمَ هذه الخطوة (‏وُجدت حاجتُها 2026-09-13):** في الدلو ذراعان على `g4n` — أصعبِ
          # خليّةٍ نعرفها (‏`shipped-Nnogate` بلا بوّابةِ ضجيج · `shipped-Ncap25` بسقفِ 25) —
          # **ولم يُقرأ لهما رقمٌ قطّ**، مع أنّ D-341 تقول: «كلُّ مفتاحٍ يُقاس على `g4n` قبل أن
          # يُقرَّر فيه شيء». وسببُ تعذُّر قراءتهما أنّ مرجعَ بنود `g4*` (`long_plan.json`)
          # **لم يكن يُرفع مع الفرضيّات** قبل إصلاح اليوم ⇒ فيُعاد بناؤه هنا **بالبذرة نفسِها**.
          case "$SETS" in *g4*) ;; *) echo "ℹ️ لا مجموعةَ `g4` في الطلب — لا مرجعَ يُبنى"; exit 0 ;; esac
          if [ -s work/long_plan.json ]; then
            echo "✅ الخطّةُ محفوظةٌ مع الفرضيّات ⇒ لا تُبنى ثانيةً — **والمحفوظُ أصدقُ من المُعاد**"
            exit 0
          fi
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || true
          pip install -q numpy soundfile || true
          python build_long.py --ayahs 6 2>&1 | tail -3 || echo "⚠️ تعذّر بناءُ المرجع (يُقال ولا يُكتَم)"
          # ⛔⛔ **ولا يُقبل مرجعٌ مُعادٌ حتى تُصدَّق معرّفاتُه:** بنيةُ البناء عشوائيّةٌ ببذرةٍ
          #     ثابتة، فإن تبدّل صوتٌ أو شفرةٌ تبدّلت البنود ⇒ **مرجعٌ لبندٍ غيرِ الذي قِيس =
          #     رقمٌ كاذبٌ لا نقصٌ معلَن**. فإن نقص معرّفٌ واحدٌ **تُحذف الخطّةُ** ويُقرأ الجدولُ
          #     «بلا مرجع» — وهو نقصٌ يُرى، والكاذبُ لا يُرى.
          python3 - <<'PY'
          import glob, json, os, sys
          p = "work/long_plan.json"
          plan = json.load(open(p, encoding="utf-8")) if os.path.exists(p) else {"items": []}
          ids = {i["id"] for i in plan.get("items", [])}
          hyp = set()
          for f in glob.glob("work/hyps_emu_g4*.json"):
              hyp |= set((json.load(open(f, encoding="utf-8")) or {}).get("hyps", {}))
          if not hyp:
              print("ℹ️ لا فرضيّاتِ `g4` نُزّلت — لا شيءَ يُصدَّق"); sys.exit(0)
          miss = sorted(hyp - ids)
          print(f"📜 خطّةٌ مُعادةٌ: {len(ids)} بنداً · وفرضيّاتٌ {len(hyp)} بنداً · "
                f"مطابَقةٌ {len(hyp) - len(miss)}/{len(hyp)}")
          if miss:
              os.path.exists(p) and os.remove(p)
              print(f"⛔⛔ **{len(miss)} معرّفاً في الفرضيّات ولا مرجعَ له في الخطّة المُعادة** "
                    f"(‏أوّلُها: {' · '.join(miss[:4])}) ⇒ **حُذفت الخطّةُ**: نقصٌ معلَنٌ خيرٌ من "
                    "رقمٍ على مرجعٍ ليس مرجعَه.")
          else:
              print("✅ كلُّ معرّفٍ في الفرضيّات له مرجعُه ⇒ الخطّةُ المُعادةُ **مصدَّقة**")
          PY
      - name: مِن أين جاءت الفرضيّات — **من الملفّ لا من الزناد**
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⛔ **النسبُ يُقرأ من المادّة لا يُفترض من الأمر** (‏2026-09-13): جدولُ `v2_gate` يكتب
          # «المحرك (المحاكي)» أو «مرآةُ المحرك (whisper-cli)» **بحسب كيف استُدعي** لا بحسب
          # مصدرِ الفرضيّات ⇒ جدولٌ من فرضيّات محاكٍ قد يُوسَم مرآةً (والعكس)، **والوسمُ الكاذبُ
          # يُسقط رقماً صحيحاً أو يرفع رقماً لا يُشحن به**. ⇒ تُطبع ترويسةُ كلّ ملفٍّ كما هي.
          python3 - <<'PY' | tee work/provenance.md
          import glob, json
          print("| ملفُّ الفرضيّات | المحرك كما كتبه الشوط | الجهاز | النموذج | الواجهة | 🧬 شفرةُ المقياس | 🧬 بناءُ المحرك |")
          print("|---|---|---|---|---|---|---|")
          revs, apks, old, mixed_files = {}, {}, [], []
          for p in sorted(glob.glob("work/hyps_emu_*.json")):
              m = (json.load(open(p, encoding="utf-8")) or {}).get("meta") or {}
              fe = m.get("frontEnd")
              f = p.split("/")[-1]
              rev, apk = m.get("benchRev"), m.get("apkSha")
              if m.get("stampMixed"):
                  mixed_files.append((f, m["stampMixed"], m.get("stampMixedItems")))
              if rev: revs.setdefault(rev, []).append(f)
              if apk: apks.setdefault(apk, []).append(f)
              if not rev: old.append(f)
              print(f"| `{f}` | {m.get('engine', '⛔ بلا ترويسة')} | "
                    f"{m.get('device', '—')} | `{m.get('model', '—')}` | `{fe if isinstance(fe, str) else m.get('chain', '—')}` | "
                    f"`{rev or '؟'}` | `{apk or '؟'}` |")
          # ⛔⛔ **ذراعان بشفرتَي مقياسٍ مختلفتَين ليستا مقارنة**: الفرقُ المقيسُ حينئذٍ قد يكون
          #     فرقَ شفرةٍ لا فرقَ ذراع — **وهو تشويشٌ صامتٌ لا يظهر في أيّ رقم**. يُقال ولا يُكتم.
          for label, d in (("شفرةِ المقياس", revs), ("بناءِ المحرك", apks)):
              if len(d) > 1:
                  print(f"\n⛔⛔ **اختلافُ {label} بين الملفّات — فالفرقُ قد يكون فرقَها لا فرقَ الذراع:**")
                  for k, fs in sorted(d.items()):
                      print(f"- `{k}` ⇐ " + " · ".join(f"`{x}`" for x in fs))
          # ⛔⛔ **وملفٌّ فيه بنودٌ من بصمتَين ليس ذراعاً واحدة**: استُؤنف مسحُه بعد تبدُّل
          #     الشفرة أو البناء (‏يكتبه `emu_sweep` في `stampMixed`) ⇒ **لا يُقارن كأنّه واحد**.
          for f, mx, n in mixed_files:
              print(f"\n⛔⛔ **`{f}` بنودٌ من بصمتَين** (‏{n} بنداً من الأولى): "
                    + " · ".join(f"`{k}`: {a} ⇒ {b}" for k, (a, b) in mx.items())
                    + " ⇒ **لا يُقرأ ذراعاً واحدة**.")
          if any(r.endswith("غيرُ مودَع") for r in revs):
              print("\n⛔ **وفيها ما قِيس على شجرةٍ غيرِ مودَعة** ⇒ لا يُعاد إنتاجُه بالبصمة وحدَها.")
          if old:
              print(f"\n⚠️ و**{len(old)}** ملفّاً بلا بصمةٍ (‏قِيس قبل 2026-09-13) — «؟» تعني **لم يُعرف** لا «متطابق».")
          PY
      - name: إعادةُ حساب جدول البوّابة من الفرضيّات نفسِها
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⭐⭐ **ولِمَ يُعاد الحسابُ وقد حُسب في الشوط؟** لأنّ سؤالاً جديداً على شوطٍ مضى كان
          # يُكلّف **شوطَ محاكٍ جديداً** (‏نصفُ ساعةٍ بذراعَين) وفرضيّاتُه محفوظةٌ في R2 منذ أوّل مرّة.
          # ⛔ **وقد وقع الثمنُ فعلاً 2026-09-13:** أُشعل الشوط `34743021435` ليقيس `base` ضدّ
          # المشحون `TINY` وكان **مقيساً في D-349/D-351 بالأرقام عينِها** — والناقصُ لم يكن قياساً
          # بل **قراءةً** لملفّاتٍ كانت محجوبةً عن الوكيل. ⇒ **فالقراءةُ تصير دقيقةً واحدةً هنا.**
          python v2_gate.py --score-only --arms $ARMS --md work/gate.md >/dev/null
          cat work/gate.md
      - name: التشريحُ صنفاً صنفاً
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⛔ **بمسافةٍ لا بفاصلة:** `--arms` يأخذ اسمَين، ومجلدُ `--dirs` لاحقتُه فارغةٌ
          # (‏`work:`) كي **لا تُقلَّم** لاحقةُ الوسم من أسماء الأذرع.
          python detect_anatomy.py --dirs "work:" --arms $ARMS | tee work/anatomy.md
          { echo "### 🔬 تشريحُ الكشف (‏$TAG)"; cat work/anatomy.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: 🧹 الزوائدُ الكاذبةُ على تلاوةٍ نظيفة (‏إن كانت فرضيّاتُ g1 محفوظة)
        if: env.CLEAN_OK == '1'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # الأذرعُ التي وُجدت لها فرضيّاتُ `g1` وحدَها (‏قد تكون واحدةً — ولا يُسكت ذلك القياس).
          python extras_noise_probe.py --dirs "work:" --arms $CLEAN_ARMS --clean | tee work/extras_clean.md
      - name: 🧹 الزوائدُ الكاذبة (‏قناةٌ لا يعدّها الاتّهامُ الكاذب)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⭐ تُقاس في **كلّ** قراءةٍ لا بطلبٍ خاصّ: ثمنُها ثوانٍ، وهي الرقمُ الذي يقرّر
          # أيُعرَض توطينُ الزوائد للمستخدم أم يحتاج تهدئةً (‏D-366).
          python extras_noise_probe.py --dirs "work:" --arms $ARMS | tee work/extras_noise.md
      - name: 🤫 تهدئةُ الزوائد — هدوءٌ مقابل إمساك (‏إن توفّرت النظيفةُ والمحقونة)
        if: env.CLEAN_OK == '1'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⭐ **والذراعان كلتاهما:** القياسُ بين **قواعدِ عرضٍ**، لكنّ نسبةَ الهدوء إلى الإمساك
          # **تختلف بالنموذج** (‏الأكبرُ يسمع الدخيلةَ ضِعفاً · D-366) ⇒ فقرارُ العرض قد يكون
          # «نعم لهذا النموذج ولا لذاك»، ولا يُعرف ذلك من ذراعٍ واحدة.
          rm -f work/extras_quiet.md
          touch work/extras_quiet.md
          for A in $CLEAN_ARMS; do
            if python extras_quiet_ab.py --dirs "work:" --arm "$A" >> work/extras_quiet.md; then
              echo "" >> work/extras_quiet.md
            else
              echo "تعذّرت التهدئةُ على $A — يُقال ولا يُكتَم" >> work/extras_quiet.md
            fi
          done
          cat work/extras_quiet.md
      - name: ⏱️ ثمنُ الزمن بين الذراعَين (‏من `ms` المحفوظة — لا شوطَ زمنٍ خاصّاً)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⭐ **يُقرأ في كلِّ تشريحٍ لا بطلبٍ خاصّ:** قرارُ مفتاحٍ بلا ثمنِه نصفُ قرار، و`ms`
          # محفوظةٌ في الفرضيّات أصلاً. ⛔ والسقوطُ **لا يُسقط** التشريحَ كلَّه (فرضيّاتٌ قديمةٌ
          # بلا `ms` واردةٌ) — يُقال ويُمضى.
          python hyps_time_ab.py --dirs "work:" --arms $ARMS | tee work/time_ab.md || \
            echo "ℹ️ لا زمنَ في هذه الفرضيّات (يُقال ولا يُكتَم)" | tee work/time_ab.md
      - name: 🎛️ أثرُ قاعدةِ التعادل (‏إن طُلب — مسطرتان على فرضيّاتٍ واحدة)
        if: env.RULE_AB != ''
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          python tie_rule_ab.py --dirs "work:" --arm "$RULE_AB" | tee work/rule_ab.md
      - name: 🧾 جردُ الفرضيّات المحفوظة في R2 (‏فلا يُعاد قياسُ ما هو مقروءٌ بدقيقة)
        if: always()
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          PYTHONIOENCODING: utf-8
        run: |
          # ⛔ **لِمَ جردٌ مُودَع؟** درسُ D-365: أُنفق شوطُ محاكٍ على سؤالٍ جوابُه في فرضيّاتٍ
          # محفوظةٍ — **والوكيلُ لا يستطيع سردَ R2** (لا تصل شبكتُه، ولا السردُ متاحٌ للعامّ).
          # ⇒ العدّاءُ يسرد **بالسرّ** ويُودع الجردَ ملفّاً في git يقرؤه الجميعُ بـ`git pull`.
          pip install -q boto3 || { echo "⛔ تعذّر boto3 — لا جرد"; exit 0; }
          python3 - <<'PY' > /tmp/inv.md || { echo "⛔ تعذّر الجرد (يُقال ولا يُكتَم)"; exit 0; }
          import json, os, collections, boto3
          c = json.loads(os.environ["R2_CREDENTIALS_JSON"])
          s3 = boto3.client("s3", endpoint_url=c["endpoint"], aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          tags = collections.defaultdict(lambda: collections.defaultdict(set))
          when, n = {}, 0
          # ⛔⛔ **والجردُ كان يُسقط صامتاً كلَّ ما لم يكن `_cap_`** (‏ثغرةٌ وُجدت 2026-09-13):
          #     `partition("_cap_")` يردّ فراغاً لذراعِ `caponly` أو `gateonly` أو **ذراعٍ بلا
          #     سلسلةٍ أصلاً** (‏`hyps_emu_g4n10_shipped-N2.json`) ⇒ فتُقرأ «غيرُ محفوظة» فيُشعل
          #     محاكٍ لنصف ساعةٍ على قياسٍ **موجودٍ في الدلو** — وهو ثمنُ درس D-365 بعينه.
          #     ⭐ والمجموعةُ لا تحمل `_` (‏`tag_of` تصنعها بالشرطات) ⇒ **أوّلُ مقطعٍ هو المجموعة**،
          #     وما بعده سلسلةٌ إن كان منها وإلّا فالذراعُ. ولا يُسقَط شيءٌ بلا أن يُعَدّ.
          CHAINS = ("cap", "caponly", "gateonly", "chain", "gate", "lvl")
          def parse(base):
              body = base[len("emu_hyps_emu_"):-5]
              seg = body.split("_")
              if len(seg) < 2:
                  return None
              st = seg[0]
              if seg[1] in CHAINS:
                  chain, arm = seg[1], "_".join(seg[2:])
              else:
                  chain, arm = "بلا", "_".join(seg[1:])
              return (st, chain, arm) if arm else None
          skipped = 0
          tok = None
          while True:
              kw = {"Bucket": c["bucket"], "Prefix": "finetune/gate/"}
              if tok:
                  kw["ContinuationToken"] = tok
              r = s3.list_objects_v2(**kw)
              for o in r.get("Contents", []):
                  k = o["Key"]
                  base = k.split("/")[-1]
                  if not base.startswith("emu_hyps_emu_") or not base.endswith(".json"):
                      continue
                  tag = k.split("finetune/gate/", 1)[1].split("/", 1)[0]
                  got = parse(base)
                  if not got:
                      skipped += 1
                      continue
                  st, chain, arm = got
                  tags[tag][(st, chain)].add(arm)
                  when[tag] = max(when.get(tag, ""), o["LastModified"].strftime("%m-%d %H:%M"))
                  n += 1
              if not r.get("IsTruncated"):
                  break
              tok = r.get("NextContinuationToken")
          print("# 🧾 جردُ الفرضيّات المحفوظة (‏ما يُقرأ بدقيقةٍ بلا شوطِ محاكٍ)\n")
          print(f"**{n}** ملفَّ فرضيّاتٍ في **{len(tags)}** وسماً · وآخرُ تحديثٍ لكلِّ وسمٍ في العمود الأخير.\n")
          print("⭐ **وقبل أيّ شوطٍ جديد:** إن كانت ذراعاك في وسمٍ واحدٍ هنا فـ**ادفعْ طلبَ "
                "`gate-anatomy`** (دقيقة) ولا تُشعل محاكياً (نصف ساعة) — درسُ D-365.\n")
          # ⛔ **والأذرعُ تُسرد لكلِّ مجموعةٍ على حدة:** وسمٌ فيه `g1` و`g3r` بأذرعٍ **مختلفة**
          # يُقرأ خطأً لو جُمعت أذرعُه في خانةٍ واحدة — فيُطلب زوجٌ لا وجودَ له في تلك المجموعة
          # فيسقط الشوطُ أو يُقاس على نصف عيّنة. **فالجردُ يُجيب بلا حدس.**
          print("| الوسم | المجموعة | السلسلة | الأذرع المحفوظة | آخرُ تحديثٍ للوسم |")
          print("|---|---|---|---|---|")
          for tag in sorted(tags):
              for st, chain in sorted(tags[tag]):
                  arms = sorted(tags[tag][(st, chain)])
                  print(f"| `{tag}` | `{st}` | `{chain}` | {' · '.join('`'+x+'`' for x in arms)} "
                        f"| {when.get(tag,'—')} |")
          if skipped:
              print(f"\n⚠️ و**{skipped}** ملفّاً لم يُفهَم اسمُه فلم يُدرَج — **يُعَدُّ ولا يُكتَم** "
                    "(‏وكان الجردُ يُسقط كلَّ ما ليس `_cap_` صامتاً).")
          # 🧹 وخانةٌ تُسهّل أكثرَ ما نحتاجه: أوسمةٌ فيها **زوجٌ في `g1` النظيفة**.
          g1 = {t: sorted(a for (st, ch), arms in tags[t].items() if st == "g1" for a in arms)
                for t in tags}
          pairs = [(t, g1[t]) for t in sorted(tags) if len(g1.get(t, ())) >= 2]
          if pairs:
              print("\n**🧹 وأوسمةٌ تُقاس فيها الزوائدُ الكاذبةُ على تلاوةٍ نظيفة (‏`g1` بذراعَين):**\n")
              for t, arms in pairs:
                  print(f"- `{t}`: {' · '.join('`'+x+'`' for x in arms)}")
          PY
          mkdir -p results && cp /tmp/inv.md results/HYPS_INVENTORY.md
          cat results/HYPS_INVENTORY.md >> "$GITHUB_STEP_SUMMARY"
      - name: إيداعُ الجدول في المستودع (‏كي يقرأه الوكيلُ السحابيُّ والمالك)
        run: |
          T="$TAG"
          M="tools/tasmi_bench/work/anatomy.md"
          [ -s "$M" ] || { echo "⛔ لا جدولَ — لا شيءَ يُودَع"; exit 1; }
          mkdir -p results
          OUT="results/anatomy_${T}_${{ github.run_id }}.md"
          {
            echo "# تشريحُ الكشف · الوسم \`${T}\` · الشوط ${{ github.run_id }}"
            echo
            echo "- التاريخ: $(date -u +%FT%TZ)"
            echo "- الذراعان: \`$ARMS\` · المجموعات: \`$SETS\` · السلسلة: \`$CHAIN\` · الزناد: \`${{ github.event_name }}\`"
            echo "- المصدر: فرضيّاتُ الشوط من \`finetune/gate/${T}/\` على R2 العامّ"
            [ -n "$NOTE" ] && echo "- سببُ القراءة: $NOTE"
            echo
            echo "## 🧾 نسبُ الفرضيّات (‏من ترويسة كلّ ملفٍّ لا من الزناد)"
            echo
            cat tools/tasmi_bench/work/provenance.md
            echo
            echo "## ⚖️ جدولُ البوّابة — أُعيد حسابُه من الفرضيّات نفسِها"
            echo
            # ⚠️ وترويسةُ `v2_gate` تقول «مرآةُ المحرك» متى مُرِّر `--pattern`؛ وهي هنا **بلا
            # `--pattern`** فتقول «المحرك (المحاكي)» — والنسبُ الصادقُ في الجدول أعلاه لا فيها.
            cat tools/tasmi_bench/work/gate.md
            echo
            if [ -s tools/tasmi_bench/work/extras_noise.md ]; then
              cat tools/tasmi_bench/work/extras_noise.md; echo
            fi
            if [ -s tools/tasmi_bench/work/extras_clean.md ]; then
              cat tools/tasmi_bench/work/extras_clean.md; echo
            fi
            if [ -s tools/tasmi_bench/work/extras_quiet.md ]; then
              cat tools/tasmi_bench/work/extras_quiet.md; echo
            fi
            if [ -s tools/tasmi_bench/work/time_ab.md ]; then
              cat tools/tasmi_bench/work/time_ab.md; echo
            fi
            if [ -s tools/tasmi_bench/work/rule_ab.md ]; then
              # ⛔ **علامتا `` ` `` داخل «...» تنفيذُ أمرٍ لا اقتباسٌ** — فخرج العنوانُ فارغاً في
              # أوّل شوط (‏`34747396287`). ⇒ تُهرَّب بـ\` كما في بقيّة هذا المسار.
              echo "## 🎛️ أثرُ قاعدةِ التعادل (ذراعُ \`$RULE_AB\`)"; echo; cat tools/tasmi_bench/work/rule_ab.md; echo
            fi
            echo "## 🔬 تشريحُ الكشف صنفاً صنفاً"
            echo
            cat "$M"
          } > "$OUT"
          cp "$OUT" results/LATEST_anatomy.md
          git config user.name "rafiq-ci"
          git config user.email "ci@users.noreply.github.com"
          git add "$OUT" results/LATEST_anatomy.md
          [ -s results/HYPS_INVENTORY.md ] && git add results/HYPS_INVENTORY.md
          git commit -q -m "results(anatomy): ${T} · الشوط ${{ github.run_id }}" || { echo "لا تغيير"; exit 0; }
          for i in 1 2 3; do
            git fetch -q origin main && git merge -q --no-edit origin/main && git push -q origin HEAD:main && { echo "✅ أُودع $OUT"; exit 0; }
            echo "↻ محاولةٌ $i"; sleep 5
          done
          echo "⛔ تعذّر الدفع"; exit 1
