          python extras_noise_probe.py --dirs "work:" --arms $CLEAN_ARMS --clean | tee work/extras_clean.md || { echo "⚠️ **تعذّر مسبارُ الزوائد على النظيف**" | tee -a work/extras_clean.md; }
      - name: 🧹 الزوائدُ الكاذبة (‏قناةٌ لا يعدّها الاتّهامُ الكاذب)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⭐ تُقاس في **كلّ** قراءةٍ لا بطلبٍ خاصّ: ثمنُها ثوانٍ، وهي الرقمُ الذي يقرّر
          # أيُعرَض توطينُ الزوائد للمستخدم أم يحتاج تهدئةً (‏D-366).
          # 🪤 الأنبوبُ يكتم فشلَ أوّله و`||` **لا يشتعل بلا هذا السطر** (‏مقيسٌ 2026-09-14).
          set -o pipefail
          python extras_noise_probe.py --dirs "work:" --arms $ARMS | tee work/extras_noise.md             || echo "⚠️ تعذّر قياسُ الزوائد لهذه المجموعات — يُقال ولا يُسقِط الشوط" | tee work/extras_noise.md
      - name: 🤫 تهدئةُ الزوائد — هدوءٌ مقابل إمساك (‏إن توفّرت النظيفةُ والمحقونة)
        if: env.CLEAN_OK == '1'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⭐ **والذراعان كلتاهما:** القياسُ بين **قواعدِ عرضٍ**، لكنّ نسبةَ الهدوء إلى الإمساك
          # **تختلف بالنموذج** (‏الأكبرُ يسمع الدخيلةَ ضِعفاً · D-366) ⇒ فقرارُ العرض قد يكون
          # «نعم لهذا النموذج ولا لذاك»، ولا يُعرف ذلك من ذراعٍ واحدة.
          rm -f work/extras_quiet.md
          touch work/extras_quiet.md
          for A in $CLEAN_ARMS; do
            if python extras_quiet_ab.py --dirs "work:" --arm "$A" >> work/extras_quiet.md; then
              echo "" >> work/extras_quiet.md
            else
              echo "تعذّرت التهدئةُ على $A — يُقال ولا يُكتَم" >> work/extras_quiet.md
            fi
          done
          cat work/extras_quiet.md
      - name: ⏱️ ثمنُ الزمن بين الذراعَين (‏من `ms` المحفوظة — لا شوطَ زمنٍ خاصّاً)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # ⭐ **يُقرأ في كلِّ تشريحٍ لا بطلبٍ خاصّ:** قرارُ مفتاحٍ بلا ثمنِه نصفُ قرار، و`ms`
          # محفوظةٌ في الفرضيّات أصلاً. ⛔ والسقوطُ **لا يُسقط** التشريحَ كلَّه (فرضيّاتٌ قديمةٌ
          # بلا `ms` واردةٌ) — يُقال ويُمضى.
          # 🪤 الأنبوبُ يكتم فشلَ أوّله و`||` **لا يشتعل بلا هذا السطر** (‏مقيسٌ 2026-09-14).
          set -o pipefail
          python hyps_time_ab.py --dirs "work:" --arms $ARMS | tee work/time_ab.md || \
            echo "ℹ️ لا زمنَ في هذه الفرضيّات (يُقال ولا يُكتَم)" | tee work/time_ab.md
      - name: 🎛️ أثرُ قاعدةِ التعادل (‏إن طُلب — مسطرتان على فرضيّاتٍ واحدة)
        if: env.RULE_AB != ''
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          # 🪤 **فخُّ الأنبوب الكاتم** (‏كشفه حارسُ `workflow_heredoc_guard.py`، ووقع فعلاً في
          #    الشوط `34795058366`): حالةُ `cmd | tee f` حالةُ `tee` ⇒ صفرٌ دائماً. فـ`pipefail`
          #    يُرجع حالةَ الأداة، و`||` **يشتعل فعلاً** فيكتب السببَ في الجدول ولا يُسقط الشوط.
          set -o pipefail
          python tie_rule_ab.py --dirs "work:" --arm "$RULE_AB" | tee work/rule_ab.md || { echo "⚠️ **تعذّر قياسُ قاعدة التعادل**" | tee -a work/rule_ab.md; }
      - name: 🌊 جرفُ الخطأ في التلاوة الطويلة (‏إن طُلبت `g4*`) — تعليلُ D-335 يُقاس
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          case "$SETS" in *g4*) ;; *) echo "ℹ️ لا مجموعةَ `g4` — ولا جرفَ يُقاس (المسطرةُ للطويل)"; exit 0 ;; esac
          # 🪤 الأنبوبُ يكتم فشلَ أوّله و`||` **لا يشتعل بلا هذا السطر** (‏مقيسٌ 2026-09-14).
          set -o pipefail
          python drift_probe.py --dirs "work:" --arms "$ARMS" --sets "$SETS" | tee work/drift.md             || echo "⚠️ تعذّر قياسُ الجرف (يُقال ولا يُكتَم)" | tee work/drift.md
          # 📜 **وقائمةُ الكلمات تُلحَق** (‏سندُها D-389: أخطاءُ النظيف مادّةٌ ثابتةٌ ×13.3) —
          #    فالنسبةُ وحدَها لا تُعالَج، والقائمةُ تُصنَّف ثمّ يُقاس علاجُها بذراع.
          python drift_probe.py --dirs "work:" --arms "$ARMS" --sets "$SETS" --words --top 25 >> work/drift.md             || echo "⚠️ تعذّرت قائمةُ الكلمات (يُقال ولا يُكتَم)" >> work/drift.md
          # ⛔ وجدولُ الجرف نفسُه كان خلفَ `tee` (‏تُقرأ حالةُ `tee` لا حالةُ بايثون) ⇒ يُفحص
          #    مضمونُه صراحةً: فارغٌ يُنطق بسببه ولا يُعدّ «لا جرف».
          [ -s work/drift.md ] || echo "⚠️ **جدولُ الجرف خرج فارغاً** — يُقرأ «لم يُقَس» لا «لا جرف»." > work/drift.md
      - name: 🔖 تصنيفُ الأخطاء الباقية (‏شكلُ العلاقة · وأهي كلمةٌ قرآنيّةٌ أخرى؟)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd tools/tasmi_bench
          case "$SETS" in *g4*) ;; *) echo "ℹ️ لا مجموعةَ `g4` — ولا تصنيفَ (المسطرةُ للطويل)"; exit 0 ;; esac
          # ⛔ **كشفٌ لا شحنٌ:** الجدولُ يصنّف الأزواجَ (‏مرجعٌ · ما سُمع) بشكل العلاقة ويُعلن
          #    ما وافق **كلمةً قرآنيّةً أخرى** — ولا يُفتح به بابٌ ولا تُخفَّض عتبة.
          # ⛔⛔ **`cmd | tee f` يُخفي سقوطَ `cmd`** — حالةُ الخروج حالةُ `tee` (صفرٌ دائماً)
          #     فلا يشتعل `||`، ويبقى الملفُّ فارغاً فيسقط من الأثر **صامتاً**. وقعت في
          #     الشوط `34795058366`: خطوةٌ «ناجحةٌ» بصفرِ ثانيةٍ وجدولٌ لا وجودَ له.
          #     ⇒ الحالةُ تُقرأ من بايثون وحدَه، وكلُّ سقوطٍ **يُكتب نصُّه في الجدول**.
          # 🧱 **وأرضيّةُ المواضع تُكتب وتُقابَل**: الفرقُ المجملُ يُخفي انقساماً (‏درسُ D-392:
          #    +0.14 وفيها قالونُ +1.12 وورشٌ ‎−0.88) — أمّا الموضعُ فلا يُخفي شيئاً.
          #    فتُكتب أرضيّةُ الذراع الأولى، وإن وُجدت أرضيّةٌ مُودَعةٌ قُوبلت بها الأذرعُ الأخرى.
          FLOOR=""
          [ -f ../../results/CLEAN_FLOOR.json ] && FLOOR="--floor ../../results/CLEAN_FLOOR.json"
          if python error_triage.py --dirs "work:" --arms "$ARMS" --sets "$SETS" --top 60             --floor-out work/clean_floor.json $FLOOR > work/triage.md 2> work/triage.err; then
            cat work/triage.md
          else
            { echo "### 🔖 تصنيفُ الأخطاء — ⚠️ **تعذّر**، ونصُّ الخطأ كما هو:"; echo
              echo '```'; tail -12 work/triage.err; echo '```'; } >> work/triage.md
            cat work/triage.md
          fi
          [ -s work/triage.md ] || echo "⚠️ **التصنيفُ خرج فارغاً بلا خطأ** — يُقرأ «لم يُقَس» لا «لا أخطاء»." > work/triage.md
          # ⛔ **والأرضيّةُ المُودَعةُ أرضيّةُ المشحون على النظيف وحدَها** — فلا تُكتب بذراعٍ
          #    مرشَّحةٍ ولا بمجموعةٍ أخرى، وإلّا صار «الأساسُ» متحرّكاً فلا يقيس شيئاً.
          # ⛔ و`if` لا `[ … ] && …`: لو كان الشرطُ كاذباً **وهو آخرُ أمرٍ في الكتلة** لسقطت
          #    الخطوةُ كلُّها (‏الفخُّ الثاني في حارسِنا — ويُتجنَّب بالبناء لا بالحظّ).
          WRITE_FLOOR=0
          case "$ARMS" in shipped*)
            case "$SETS" in
              *g4n*) ;;
              *g4*) WRITE_FLOOR=1 ;;
            esac ;;
          esac
          if [ "$WRITE_FLOOR" = "1" ] && [ -s work/clean_floor.json ]; then
            mkdir -p ../../results
            cp work/clean_floor.json ../../results/CLEAN_FLOOR.json
            echo "🧱 أُودعت أرضيّةُ المشحون على النظيف (‏أساسٌ تُقابَل به الأذرعُ القادمة)."
          else
            echo "ℹ️ لا تُكتب الأرضيّةُ في هذا الشوط (‏ليست ذراعَ المشحون على `g4` النظيفة)."
          fi
      - name: 💠 سعرُ البابِ المقفل — وأتُعمَّم القائمةُ على أرضيّةٍ محجوبةٍ أم تحفظ؟ (D-443)
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          # ⛔ **كشفٌ لا شحنٌ** — يُسعَّر بابُ «اغفرْ هذه الأزواجَ بعينها» بعملة D-390 (مواضعُ
          #    عمًى في المصحف كلِّه) ويُقابَل بـ125 إبدالاً مصنوعاً في خطط الحقن. ولا يُفتح باب.
          # 🎯 **والشهادةُ التي يُبنى عليها شحنٌ هي هذه الخطوةُ لا القسمةُ الداخليّة**: القائمةُ
          #    من أرضيّة المشحون على `g4` النظيفة (‏المُودَعةُ في `results/`) تُقاس على أرضيّةِ
          #    **هذا الشوط** — فإن كان `SETS` غيرَها (‏`g4n` المضجَّجة · أو ملحٌ آخر) فالأرضيّةُ
          #    **محجوبةٌ عن البناء والصوت والنموذج** معاً.
          if [ ! -f ../../results/CLEAN_FLOOR.json ]; then
            echo "ℹ️ لا أرضيّةَ مُودَعةٌ بعد ⇒ لا قائمةَ تُبنى (‏وهذا «لم يُقَس» لا «صفرُ ثمن»)." > work/pairdoor.md
            cat work/pairdoor.md; exit 0
          fi
          AGAINST=""
          # ⛔ ولا تُقاس القائمةُ على الأرضيّة التي بُنيت منها — فذلك 100٪ بالبناء لا بالقياس.
          if [ -s work/clean_floor.json ] && ! cmp -s work/clean_floor.json ../../results/CLEAN_FLOOR.json; then
            AGAINST="--against work/clean_floor.json"
          fi
          if python error_triage.py --pair-door ../../results/CLEAN_FLOOR.json $AGAINST             > work/pairdoor.md 2> work/pairdoor.err; then
            [ -n "$AGAINST" ] || echo "ℹ️ **لا أرضيّةَ محجوبةٌ في هذا الشوط** (‏أرضيّتُه هي التي بُنيت منها القائمةُ أو لم تُكتب) ⇒ **السعرُ وحدَه قِيس، والتعميمُ لم يُقَس**." >> work/pairdoor.md
          else
            { echo "### 💠 البابُ المقفل — ⚠️ **تعذّر**، ونصُّ الخطأ كما هو:"; echo
              echo '```'; tail -12 work/pairdoor.err; echo '```'; } >> work/pairdoor.md
          fi
          [ -s work/pairdoor.md ] || echo "⚠️ **خرج فارغاً بلا خطأ** — «لم يُقَس» لا «صفرُ ثمن»." > work/pairdoor.md
          cat work/pairdoor.md
      - name: 🧾 جردُ الفرضيّات المحفوظة في R2 (‏فلا يُعاد قياسُ ما هو مقروءٌ بدقيقة)
        if: always()
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          PYTHONIOENCODING: utf-8
        run: |
          # ⛔ **لِمَ جردٌ مُودَع؟** درسُ D-365: أُنفق شوطُ محاكٍ على سؤالٍ جوابُه في فرضيّاتٍ
          # محفوظةٍ — **والوكيلُ لا يستطيع سردَ R2** (لا تصل شبكتُه، ولا السردُ متاحٌ للعامّ).
          # ⇒ العدّاءُ يسرد **بالسرّ** ويُودع الجردَ ملفّاً في git يقرؤه الجميعُ بـ`git pull`.
          pip install -q boto3 || { echo "⛔ تعذّر boto3 — لا جرد"; exit 0; }
          python3 - <<'PY' > /tmp/inv.md || { echo "⛔ تعذّر الجرد (يُقال ولا يُكتَم)"; exit 0; }
          import json, os, collections, boto3
          c = json.loads(os.environ["R2_CREDENTIALS_JSON"])
          s3 = boto3.client("s3", endpoint_url=c["endpoint"], aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          tags = collections.defaultdict(lambda: collections.defaultdict(set))
          when, n = {}, 0
          # ⛔⛔ **والجردُ كان يُسقط صامتاً كلَّ ما لم يكن `_cap_`** (‏ثغرةٌ وُجدت 2026-09-13):
          #     `partition("_cap_")` يردّ فراغاً لذراعِ `caponly` أو `gateonly` أو **ذراعٍ بلا
          #     سلسلةٍ أصلاً** (‏`hyps_emu_g4n10_shipped-N2.json`) ⇒ فتُقرأ «غيرُ محفوظة» فيُشعل
          #     محاكٍ لنصف ساعةٍ على قياسٍ **موجودٍ في الدلو** — وهو ثمنُ درس D-365 بعينه.
          #     ⭐ والمجموعةُ لا تحمل `_` (‏`tag_of` تصنعها بالشرطات) ⇒ **أوّلُ مقطعٍ هو المجموعة**،
          #     وما بعده سلسلةٌ إن كان منها وإلّا فالذراعُ. ولا يُسقَط شيءٌ بلا أن يُعَدّ.
          CHAINS = ("cap", "caponly", "gateonly", "chain", "gate", "lvl")
          def parse(base):
              body = base[len("emu_hyps_emu_"):-5]
              seg = body.split("_")
              if len(seg) < 2:
                  return None
              st = seg[0]
              if seg[1] in CHAINS:
                  chain, arm = seg[1], "_".join(seg[2:])
              else:
                  chain, arm = "بلا", "_".join(seg[1:])
              return (st, chain, arm) if arm else None
          skipped = 0
          tok = None
          while True:
              kw = {"Bucket": c["bucket"], "Prefix": "finetune/gate/"}
              if tok:
                  kw["ContinuationToken"] = tok
              r = s3.list_objects_v2(**kw)
              for o in r.get("Contents", []):
                  k = o["Key"]
                  base = k.split("/")[-1]
                  if not base.startswith("emu_hyps_emu_") or not base.endswith(".json"):
                      continue
                  tag = k.split("finetune/gate/", 1)[1].split("/", 1)[0]
                  got = parse(base)
                  if not got:
                      skipped += 1
                      continue
                  st, chain, arm = got
                  tags[tag][(st, chain)].add(arm)
                  when[tag] = max(when.get(tag, ""), o["LastModified"].strftime("%m-%d %H:%M"))
                  n += 1
              if not r.get("IsTruncated"):
                  break
              tok = r.get("NextContinuationToken")
          print("# 🧾 جردُ الفرضيّات المحفوظة (‏ما يُقرأ بدقيقةٍ بلا شوطِ محاكٍ)\n")
          print(f"**{n}** ملفَّ فرضيّاتٍ في **{len(tags)}** وسماً · وآخرُ تحديثٍ لكلِّ وسمٍ في العمود الأخير.\n")
          print("⭐ **وقبل أيّ شوطٍ جديد:** إن كانت ذراعاك في وسمٍ واحدٍ هنا فـ**ادفعْ طلبَ "
                "`gate-anatomy`** (دقيقة) ولا تُشعل محاكياً (نصف ساعة) — درسُ D-365.\n")
          # ⛔ **والأذرعُ تُسرد لكلِّ مجموعةٍ على حدة:** وسمٌ فيه `g1` و`g3r` بأذرعٍ **مختلفة**
          # يُقرأ خطأً لو جُمعت أذرعُه في خانةٍ واحدة — فيُطلب زوجٌ لا وجودَ له في تلك المجموعة
          # فيسقط الشوطُ أو يُقاس على نصف عيّنة. **فالجردُ يُجيب بلا حدس.**
          print("| الوسم | المجموعة | السلسلة | الأذرع المحفوظة | آخرُ تحديثٍ للوسم |")
          print("|---|---|---|---|---|")
          for tag in sorted(tags):
              for st, chain in sorted(tags[tag]):
                  arms = sorted(tags[tag][(st, chain)])
                  print(f"| `{tag}` | `{st}` | `{chain}` | {' · '.join('`'+x+'`' for x in arms)} "
                        f"| {when.get(tag,'—')} |")
          if skipped:
              print(f"\n⚠️ و**{skipped}** ملفّاً لم يُفهَم اسمُه فلم يُدرَج — **يُعَدُّ ولا يُكتَم** "
                    "(‏وكان الجردُ يُسقط كلَّ ما ليس `_cap_` صامتاً).")
          # 🧹 وخانةٌ تُسهّل أكثرَ ما نحتاجه: أوسمةٌ فيها **زوجٌ في `g1` النظيفة**.
          g1 = {t: sorted(a for (st, ch), arms in tags[t].items() if st == "g1" for a in arms)
                for t in tags}
          pairs = [(t, g1[t]) for t in sorted(tags) if len(g1.get(t, ())) >= 2]
          if pairs:
              print("\n**🧹 وأوسمةٌ تُقاس فيها الزوائدُ الكاذبةُ على تلاوةٍ نظيفة (‏`g1` بذراعَين):**\n")
              for t, arms in pairs:
                  print(f"- `{t}`: {' · '.join('`'+x+'`' for x in arms)}")
          PY
          mkdir -p results && cp /tmp/inv.md results/HYPS_INVENTORY.md
          cat results/HYPS_INVENTORY.md >> "$GITHUB_STEP_SUMMARY"
      - name: إيداعُ الجدول في المستودع (‏كي يقرأه الوكيلُ السحابيُّ والمالك)
        run: |
          T="$TAG"
          M="tools/tasmi_bench/work/anatomy.md"
          # ⛔⛔ **وحارسٌ كان يرمي قياساً صحيحاً (‏وقع في الشوط `34776548806`):** كان الإيداعُ
          #     مشروطاً بتشريح الحقن وحدَه، فقراءةُ `g4n` (تلاوةٌ طويلةٌ **غيرُ محقونة**) خرج
          #     تشريحُها فارغاً ⇒ **سقطت الخطوةُ وضاع جدولُ الدقّة الذي حُسب فعلاً** (‏61.01٪
          #     مقابل 53.50٪). ⭐ **فالشرطُ صار: يُودَع إن وُجد جدولٌ واحدٌ ذو مضمون** — وأمّا
          #     التشريحُ الفارغُ فيُكتب سببُه في الملفّ ولا يُسقط الشوط.
          [ -s "$M" ] || echo "⚠️ لا تشريحَ حقنٍ لهذه المجموعات (‏مجموعاتُ \`g4*\` تلاوةٌ طويلةٌ غيرُ محقونة) — والأرقامُ في الجداول أعلاه." > "$M"
          HAVE=0
          for f in work/track.md work/gate.md work/provenance.md work/anatomy.md work/identical.md work/drift.md work/triage.md work/pairdoor.md; do
            [ -s "tools/tasmi_bench/$f" ] && HAVE=1
          done
          [ "$HAVE" = "1" ] || { echo "⛔ لا جدولَ فيه مضمونٌ — لا شيءَ يُودَع"; exit 1; }
          mkdir -p results
          OUT="results/anatomy_${T}_${{ github.run_id }}.md"
          {
            echo "# تشريحُ الكشف · الوسم \`${T}\` · الشوط ${{ github.run_id }}"
            echo
            echo "- التاريخ: $(date -u +%FT%TZ)"
            echo "- الذراعان: \`$ARMS\` · المجموعات: \`$SETS\` · السلسلة: \`$CHAIN\` · الزناد: \`${{ github.event_name }}\`"
            echo "- المصدر: فرضيّاتُ الشوط من \`finetune/gate/${T}/\` على R2 العامّ"
            [ -n "$NOTE" ] && echo "- سببُ القراءة: $NOTE"
            echo
            echo "## 🧾 نسبُ الفرضيّات (‏من ترويسة كلّ ملفٍّ لا من الزناد)"
            echo
            cat tools/tasmi_bench/work/provenance.md
            echo
            echo "## ⚖️ جدولُ البوّابة — أُعيد حسابُه من الفرضيّات نفسِها"
            echo
            # ⚠️ وترويسةُ `v2_gate` تقول «مرآةُ المحرك» متى مُرِّر `--pattern`؛ وهي هنا **بلا
            # `--pattern`** فتقول «المحرك (المحاكي)» — والنسبُ الصادقُ في الجدول أعلاه لا فيها.
            cat tools/tasmi_bench/work/gate.md
            echo
            if [ -s tools/tasmi_bench/work/drift.md ]; then
              cat tools/tasmi_bench/work/drift.md; echo
            fi
            if [ -s tools/tasmi_bench/work/triage.md ]; then
              cat tools/tasmi_bench/work/triage.md; echo
            fi
            if [ -s tools/tasmi_bench/work/pairdoor.md ]; then
              cat tools/tasmi_bench/work/pairdoor.md; echo
            fi
            if [ -s tools/tasmi_bench/work/identical.md ]; then
              echo "## 🛡️ حارسُ «ذراعان متطابقتان» (‏على النصّ لا على المجال)"
              echo
              cat tools/tasmi_bench/work/identical.md; echo
            fi
            if [ -s tools/tasmi_bench/work/track.md ]; then
              echo "## 📏 دقّةُ التتبّع على المجموعات المطلوبة (‏بالمسطرة نفسِها التي يحكم بها الشوط)"
              echo
              cat tools/tasmi_bench/work/track.md; echo
            fi
            if [ -s tools/tasmi_bench/work/extras_noise.md ]; then
              cat tools/tasmi_bench/work/extras_noise.md; echo
            fi
            if [ -s tools/tasmi_bench/work/extras_clean.md ]; then
              cat tools/tasmi_bench/work/extras_clean.md; echo
            fi
            if [ -s tools/tasmi_bench/work/extras_quiet.md ]; then
              cat tools/tasmi_bench/work/extras_quiet.md; echo
            fi
            if [ -s tools/tasmi_bench/work/time_ab.md ]; then
              cat tools/tasmi_bench/work/time_ab.md; echo
            fi
            if [ -s tools/tasmi_bench/work/rule_ab.md ]; then
              # ⛔ **علامتا `` ` `` داخل «...» تنفيذُ أمرٍ لا اقتباسٌ** — فخرج العنوانُ فارغاً في
              # أوّل شوط (‏`34747396287`). ⇒ تُهرَّب بـ\` كما في بقيّة هذا المسار.
              echo "## 🎛️ أثرُ قاعدةِ التعادل (ذراعُ \`$RULE_AB\`)"; echo; cat tools/tasmi_bench/work/rule_ab.md; echo
            fi
            echo "## 🔬 تشريحُ الكشف صنفاً صنفاً"
            echo
            cat "$M"
          } > "$OUT"
          cp "$OUT" results/LATEST_anatomy.md
          git config user.name "rafiq-ci"
          git config user.email "ci@users.noreply.github.com"
          git add "$OUT" results/LATEST_anatomy.md
          [ -s results/CLEAN_FLOOR.json ] && git add results/CLEAN_FLOOR.json
          [ -s results/HYPS_INVENTORY.md ] && git add results/HYPS_INVENTORY.md
          git commit -q -m "results(anatomy): ${T} · الشوط ${{ github.run_id }}" || { echo "لا تغيير"; exit 0; }
          for i in 1 2 3; do
            git fetch -q origin main && git merge -q --no-edit origin/main && git push -q origin HEAD:main && { echo "✅ أُودع $OUT"; exit 0; }
            echo "↻ محاولةٌ $i"; sleep 5
          done
          echo "⛔ تعذّر الدفع"; exit 1
