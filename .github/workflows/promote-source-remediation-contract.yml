name: promote-source-remediation-contract
on:
  push:
    paths:
      - tools/index_qa/promote.py
      - tools/index_qa/test_promote_source_remediation.py
      - tools/index_qa/test_shrink_declared_gaps.py
      - tools/index_qa/splice_surah.py
      - tools/index_qa/test_splice_truncated_excuse.py
      - tools/index_qa/test_build_same_source_candidate.py
      - tools/ci_fleet/source_overrides.json
      - tools/index_qa/declarations.py
      - tools/index_qa/drop_ayahs.py
      - tools/index_qa/drop_surah.py
      - tools/index_qa/pin_heard.py
      - tools/index_qa/heard_gate.py
      - tools/index_qa/post_stage_heard.py
      - tools/index_qa/test_heard_owntext.py
      - tools/index_qa/test_heard_witnessed_absent.py
      - tools/index_qa/test_drop_ayahs_witnessed.py
      - tools/index_qa/stage_transform.py
      - tools/alignment_v3/heard_absent.py
      - tools/alignment_v3/test_heard_absent_witnessed.py
      - tools/index_qa/test_pin_heard_owntext.py
      - tools/index_qa/test_drop_ayahs_inherit.py
      - tools/index_qa/test_drop_ayahs.py
      - tools/index_qa/test_pin_heard_declaration.py
      - tools/index_qa/test_pin_heard_disputed.py
      - tools/index_qa/test_heard_disputed.py
      - tools/index_qa/test_drop_surah_declarations.py
      - .github/workflows/promote-source-remediation-contract.yml
  pull_request:
    paths:
      - tools/index_qa/promote.py
      - tools/index_qa/test_promote_source_remediation.py
      - tools/index_qa/test_shrink_declared_gaps.py
      - tools/index_qa/splice_surah.py
      - tools/index_qa/test_splice_truncated_excuse.py
      - tools/index_qa/test_build_same_source_candidate.py
      - tools/ci_fleet/source_overrides.json
      - tools/index_qa/declarations.py
      - tools/index_qa/drop_ayahs.py
      - tools/index_qa/drop_surah.py
      - tools/index_qa/pin_heard.py
      - tools/index_qa/heard_gate.py
      - tools/index_qa/post_stage_heard.py
      - tools/index_qa/test_heard_owntext.py
      - tools/index_qa/test_heard_witnessed_absent.py
      - tools/index_qa/test_drop_ayahs_witnessed.py
      - tools/index_qa/stage_transform.py
      - tools/alignment_v3/heard_absent.py
      - tools/alignment_v3/test_heard_absent_witnessed.py
      - tools/index_qa/test_pin_heard_owntext.py
      - tools/index_qa/test_drop_ayahs_inherit.py
      - tools/index_qa/test_drop_ayahs.py
      - tools/index_qa/test_pin_heard_declaration.py
      - tools/index_qa/test_pin_heard_disputed.py
      - tools/index_qa/test_heard_disputed.py
      - tools/index_qa/test_drop_surah_declarations.py
      - .github/workflows/promote-source-remediation-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: promote-source-remediation-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m unittest tools.index_qa.test_promote_source_remediation -v
      - run: python -m unittest tools/index_qa/test_shrink_declared_gaps.py tools/index_qa/test_promote_shrink.py tools/index_qa/test_drop_ayahs.py tools/index_qa/test_splice_truncated_excuse.py tools/index_qa/test_splice_keep_parent_gaps.py tools/index_qa/test_truncated_tail.py tools/index_qa/test_build_same_source_candidate.py tools/index_qa/test_build_registered_candidate.py tools/index_qa/test_drop_ayahs_inherit.py tools/index_qa/test_pin_heard_declaration.py tools/index_qa/test_pin_heard_disputed.py tools/index_qa/test_heard_disputed.py tools/index_qa/test_heard_owntext.py tools/index_qa/test_pin_heard_owntext.py tools/index_qa/test_heard_witnessed_absent.py tools/index_qa/test_drop_ayahs_witnessed.py tools/alignment_v3/test_heard_absent_witnessed.py tools/index_qa/test_drop_surah_declarations.py -v
