name: rafiq-realign-surah

# ⛔ الهويّةُ عند الإنشاء لا عند التشغيل — انظر التعليقَ نفسَه في `audio_qa.yml`.
run-name: >-
  realign ${{ inputs.riwaya }}/${{ inputs.parent }} · س${{ inputs.surahs }} ·
  skip=${{ inputs.skip_ms }}

# إعادةُ محاذاةِ **سورةٍ أو سورٍ بعينها** في فهرسٍ منشور — لا القارئ كلَّه.
#
# ⛔ سببُه مقيس (قرار المشرف github-10، 2026-09-05): العلّةُ في `deban/22`
#    و`lhdan/103` وأخواتِهما **سورةٌ واحدةٌ مزاحة** لا فهرسٌ فاسد، وإعادةُ
#    القارئ كاملاً لأجلها إنفاقُ ساعةٍ على منجَز. وهذا المدخل هو **شرطُ إعادة
#    فتح D-186** بنصّه: متى توفّر، تُعاد السورُ المسقَطة.
#
# ⛔ ولا يمسّ شبكةَ المالك: الصوتُ يُنزَّل على عدّاء GitHub لا محلياً.
# ⛔ ولا يكتب إلا إلى `timings-staging/` عبر `stage_transform.py` بحُرّاسه —
#    كاتبٌ واحدٌ إلى الدلو لا كاتبان.
on:
  workflow_dispatch:
    inputs:
      parent:
        description: "الأصل: timings/<riw>/<id>.jz أو timings-staging/<riw>/<id>.<sha8>.jz"
        required: true
      surahs:
        description: "سورةٌ أو أكثر بفواصل، مثل 22 أو 25,30"
        required: true
      skip_ms:
        description: "بدءُ المحاذاة بعد n م.ث من رأس الملفّ (لتخطّي بسملةٍ مقيسة)"
        default: "0"
      url_template:
        description: "قالبُ الصوت، مثل https://server16.mp3quran.net/deban/Rewayat-Hafs-A-n-Assem/{s:03d}.mp3"
        required: true
      riwaya:
        description: "hafs | warsh | qalun"
        default: "hafs"
      reason:
        description: "سببُ التحويل — يُكتب في الترويسة والسجل"
        required: true
      allow_batch:
        description: "جمعُ أكثر من سورةٍ عمداً (الأصلُ المنعُ — الدرسُ الرابع)"
        default: "false"
      whisper_ac:
        # ⛔ سببُه مقيس: `koshi_warsh/037.mp3` يدخل حلقةَ تكرارٍ هلوسيّة
        #    («كل كل كل» · «اهموا اهموا») فلا تُحلّ ولا آية — و**سياقٌ صوتيٌّ
        #    مقصوصٌ (512 من 1500) علّةٌ معروفةٌ لهذه الحلقة في whisper.cpp**.
        # ✅ **وصار مقيساً لا مفترَضاً (2026-09-08):** `kshidan_qalun/56`
        #    (الواقعة) و`akri_qalun/24` (النور) سقطتا **ثلاثَ مرّاتٍ لكلٍّ**
        #    بـ512 — وبـ**256 نجحتا في المحاولة الأولى**. ⇒ متى ظهر في السجلّ
        #    تكرارٌ هلوسيّ («الرافع وفع…» · «بي بي بي ي…») **فالعلاجُ الأوّل
        #    `whisper_ac=256` قبل أيّ شيء آخر**، ولا يُظنّ الصوتُ معيباً.
        #    ⛔ ويبقى الافتراضُ 512: تغييرُه يمسّ كلَّ تشغيلةٍ صامتاً، والمقبضُ
        #    يُطلب عند علّته لا يُعمَّم.
        #    فالمعامل يُعرَض مدخلاً اختياريّاً **بالقيمة نفسِها افتراضاً**، فلا
        #    يتغيّر شيءٌ لمن لا يمرّره، ويُجرَّب على السورة العصيّة وحدها.
        # ⛔ وهذا هو السبيلُ المشروع لفتح `koshi_warsh` — لا خلطُ محرّكين
        #    (`source_timing_splice`) ولا إسقاطُ سورةٍ بـ182 آية.
        description: "سياقُ whisper الصوتيّ (الافتراض 512؛ 1500 = كاملٌ بلا قصّ)"
        default: "512"

env:
  PY: "3.11"
  # ⛔ مثبَّتٌ كما في align.yml: ثنائيٌّ مختلفٌ بين تشغيلتين = حكمان لا يُقارَنان.
  WHISPER_REF: eacbd8234c6654cdbf2c377f72b2106875479bdc

jobs:
  realign:
    # ⛔ الاسمُ يحمل الهويّة — `gh run view --json jobs` يقرؤه **والتشغيلةُ جارية**،
    #    بلا سجلٍّ (‏سجلُّ الجارية 404) ولا انتظار. أُضيف بعد أن سُدّت العلّةُ نفسُها في
    #    `align.yml` وحدَها فبقيت هنا: تشغيلةٌ اصطفّت 21:38Z **وهويّتُها متعذّرةُ
    #    القياس**، فتُقايَض الأولويةُ على ظنّ. ⇒ **الدرسُ الذي يسكن ملفّاً ولا يسكن
    #    جارَه لا يحرس** — وهو الحادي والعشرون في ثوبٍ رابع.
    name: realign ${{ github.event.inputs.parent }} [${{ github.event.inputs.surahs }}]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY }}

      - name: أدوات النظام
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg cmake build-essential
          python -m pip install --quiet boto3 numpy

      # ⚠️ GGML_NATIVE=OFF عمداً كما في align.yml: الكاش يُستهلك على عدّاءٍ قد
      #    يختلف طرازه، وثنائيٌّ بتعليمات معالجٍ آخر يسقط بـSIGILL.
      - name: كاش ثنائي whisper
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper-bin
          key: whisper-cli-${{ runner.os }}-${{ env.WHISPER_REF }}-noNative-v1

      - name: بناء whisper.cpp (عند غياب الكاش)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p wsrc && cd wsrc && git init -q .
          git remote add origin https://github.com/ggml-org/whisper.cpp.git
          git fetch -q --depth 1 origin "$WHISPER_REF"
          git checkout -q FETCH_HEAD
          cd ..
          cmake -S wsrc -B wsrc/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF \
                -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build wsrc/build --config Release -j"$(nproc)"
          mkdir -p whisper-bin
          cp "$(find wsrc/build -name whisper-cli -type f | head -1)" whisper-bin/whisper-cli
          find wsrc/build -name "*.so*" -exec cp {} whisper-bin/ \;

      - name: تنصيب الثنائي وبرهانُ عمله
        run: |
          mkdir -p assets-archive/ggml/bin/Release
          cp whisper-bin/whisper-cli assets-archive/ggml/bin/Release/whisper-cli.exe
          cp whisper-bin/*.so* assets-archive/ggml/bin/Release/ 2>/dev/null || true
          chmod +x assets-archive/ggml/bin/Release/whisper-cli.exe
          # ⛔ المكتبات المشتركة بجوار الثنائي لا في مسار النظام ⇒ يلزم تصديرها،
          #    وإلا فـexit 127 على كل سورة بعد أن تلتهم المهلة.
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/assets-archive/ggml/bin/Release:${LD_LIBRARY_PATH:-}"
          if ! assets-archive/ggml/bin/Release/whisper-cli.exe --help >/dev/null 2>&1; then
            echo "⛔ whisper-cli لا يعمل:"; ldd assets-archive/ggml/bin/Release/whisper-cli.exe 2>&1 | grep -i "not found" || true
            exit 1
          fi
          echo "✅ whisper-cli يعمل"

      - name: اعتماد R2 والنموذجان
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          # ⛔ عبر متغيّر بيئة لا سطر أمر: سطرُ الأمر يظهر في السجل العام.
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY'
          import json, os, boto3
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          os.makedirs("assets-archive/ggml", exist_ok=True)
          s3.download_file(c["bucket"], "models/whisper-tiny-ar-quran/ggml-q8_0.bin",
                           "assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin")
          # نموذجُ الصقل مستقلٌّ (D-179): التفريغُ بالسريع والصقلُ بالأدقّ.
          s3.download_file(c["bucket"], "models/whisper-base-ar-quran/ggml-q8_0.bin",
                           "assets-archive/ggml/ggml-refine-q8_0.bin")
          print("النموذجان جاهزان")
          PY

      - name: ⛔ حارسُ الرابط — لا تخمينَ في قوالب الصوت
        env:
          PARENT: ${{ github.event.inputs.parent }}
          URLT: ${{ github.event.inputs.url_template }}
        run: |
          # ⛔ **درسٌ بثمنه (2026-09-05):** أُطلقت إعادتا محاذاةٍ بقالبَي صوتٍ
          #    **مخمَّنين** بدل قراءتهما من الكتالوج — ولولا أنّهما أُلغيتا
          #    لحاذتا صوتَ قارئٍ آخر وأنتجتا فهرساً يبدو سليماً وهو كذبٌ تامّ.
          #    والوصيّةُ لا تحرس؛ الحارسُ يحرس. فالقالبُ يُطابَق بالكتالوج
          #    **حرفاً** قبل تنزيل بايتٍ واحد.
          python - <<'PY'
          import json, os, sys, boto3
          sys.stdout.reconfigure(encoding="utf-8")
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          cat = json.loads(s3.get_object(Bucket=c["bucket"],
                                         Key="catalog/reciters.json")["Body"].read())
          # الأصلُ إمّا منشورٌ `timings/<riw>/<id>.jz` أو مرشَّحٌ في الاختبار
          # `timings-staging/<riw>/<id>.<sha8>.jz` — والمعرّفُ أوّلُ مقطعٍ قبل
          # النقطة في الحالين.
          parent = os.environ["PARENT"]
          _, riw, fn = parent.split("/")
          rid = fn.split(".")[0]
          base = None
          for r in cat.get("riwayat", []):
              if r["id"] != riw:
                  continue
              for x in r.get("reciters", []):
                  if x.get("id") == rid:
                      base = x.get("base") or ""
          if base is None:
              sys.exit(f"⛔ {riw}/{rid} ليس في الكتالوج — لا محاذاةَ لمجهول")
          if base and not base.endswith("/"):
              base += "/"
          want = base + "{s:03d}.mp3"
          got = os.environ["URLT"]
          # ⛔ **ومرآتُنا وحدَها استثناءٌ — لأنها ليست تخميناً** (2026-09-08):
          #    الحارسُ وُضع ليمنع **رابطاً مخمَّناً** لمضيفٍ غريب. ومرآتُنا في
          #    دلونا مسارٌ قانونيّ **مشتقٌّ من الرواية والمعرّف نفسِهما**، وما
          #    يُرفع إليها مرَّ بحرّاس `mirror_reciter` (‏فاحصُ الحشو · مطابقةُ
          #    الحجم بعد الرفع · بصمةٌ مكتوبةٌ مع الكائن). ⇒ يُقبل هذا المسارُ
          #    بعينِه لهذا القارئ، **ولا يُقبل سواه**.
          #    وسببُه مقيس: `s_sadeiq/042.mp3` عند الناشر **حشوٌ لا صوت**، وسورةٌ
          #    ميّتةٌ واحدة كانت تحجب قارئاً عطبُه الصوتيُّ 2.0–2.5%. والتطبيقُ
          #    يقرأ `remoteUrl = e.fileRef` **لكلّ آية**، فسورةٌ من مضيفٍ آخر
          #    لا تمسّ بقيّةَ القارئ.
          mirror = (f"https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev/"
                    f"audio/{riw}/{rid}/" + "{s:03d}.mp3")
          if got not in (want, mirror):
              print("⛔ القالبُ المعطى يخالف الكتالوج ولا هو مرآتُنا — يُوقَف قبل تنزيل بايت.")
              print(f"   المعطى:   {got}")
              print(f"   الكتالوج: {want}")
              print(f"   المرآة:   {mirror}")
              sys.exit(1)
          print(f"✅ القالبُ مقبول: {got}"
                + ("" if got == want else "  (مرآتُنا — لا مضيفٌ غريب)"))
          PY

      - name: إعادة المحاذاة سورةً سورة
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/assets-archive/ggml/bin/Release
          ALIGN_REFINE: "1"
          REFINE_MODEL: ${{ github.workspace }}/assets-archive/ggml/ggml-refine-q8_0.bin
          REFINE_DTW: base
          # ⛔ الاحتياطُ `|| '512'` ليس زينة: مدخلٌ غائبٌ يُمرَّر فارغاً فيصير
          #    السياقُ صفراً ويتغيّر المحرّك صمتاً — والصمتُ أخطرُ من الفشل.
          WHISPER_AC: ${{ github.event.inputs.whisper_ac || '512' }}
          WHISPER_THREADS: "4"
          PARENT: ${{ github.event.inputs.parent }}
          SURAHS: ${{ github.event.inputs.surahs }}
          URLT: ${{ github.event.inputs.url_template }}
          RIWAYA: ${{ github.event.inputs.riwaya }}
          SKIP_MS: ${{ github.event.inputs.skip_ms }}
          ALLOW_BATCH: ${{ github.event.inputs.allow_batch }}
        run: |
          set -e
          # ⛔ حارسُ الدرس الرابع — **موضعُه هنا لأنّ المستندَ لا يحرس** (الدرس 21):
          #    `splice_surah --skip-unresolved` يمضي بالباقيات، ثم يردّ حارسُ
          #    الاكتمال في `stage_transform` **الدفعةَ كلَّها** لأن مجموع المداخل
          #    نقص — فآيةٌ واحدةٌ لم تُحلّ في سورةٍ **ترمي عملَ السورة السليمة**.
          #    قِيس ثلاثَ مرّات: 34056103284 (‏koshi [37,46]) · 34056100966
          #    (‏qeniwa [6,31]) · 34152721621 (‏koshi [37,47,108] ⇒ «221 والرواية
          #    223» — عدّاءٌ كاملٌ ضاع بعد كتابة الدرس في المستند بيومٍ واحد).
          #    والفحصُ **قبل تنزيل بايت** فلا يُحرق عدّاءٌ ليسقط في آخره.
          N=$(echo "$SURAHS" | tr ',' ' ' | wc -w)
          if [ "$N" -gt 1 ] && [ "${ALLOW_BATCH:-false}" != "true" ]; then
            echo "⛔ $N سورٍ في تشغيلةٍ واحدة ($SURAHS) — سورةٌ واحدةٌ لكلّ تشغيلة."
            echo "   رتّبها من القصيرة (فوق حدّ العجز) إلى الطويلة، تشغيلةً لكلٍّ."
            echo "   وإن قُصد الجمعُ عمداً ومع علمٍ بالكلفة: allow_batch=true."
            exit 1
          fi
          mkdir -p work
          python - <<'PY'
          import json, os, boto3
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          s3.download_file(c["bucket"], os.environ["PARENT"], "work/parent.jz")
          print("نُزّل الأصل:", os.environ["PARENT"])
          PY
          FILES=""
          for S in $(echo "$SURAHS" | tr ',' ' '); do
            URL=$(python -c "import os,sys; print(os.environ['URLT'].format(s=int(sys.argv[1])))" "$S")
            echo "── سورة $S ← $URL"
            SRC="$URL"
            if [ "${SKIP_MS:-0}" != "0" ]; then
              curl -sL -o "$GITHUB_WORKSPACE/work/full_$S.mp3" "$URL"
              SEC=$(python -c "print(int('${SKIP_MS}')/1000)")
              ffmpeg -y -v error -ss "$SEC" -i "$GITHUB_WORKSPACE/work/full_$S.mp3" -c copy "$GITHUB_WORKSPACE/work/cut_$S.mp3"
              SRC="file://$GITHUB_WORKSPACE/work/cut_$S.mp3"
              echo "  تُخطّيت ${SKIP_MS} م.ث من رأس الملفّ (بسملةٌ مقيسة)"
            fi
            ( cd tools/alignment && python pipeline.py --url "$SRC" --surah "$S" \
                --riwaya "$RIWAYA" --json "$GITHUB_WORKSPACE/work/s$S.json" )
            if [ "${SKIP_MS:-0}" != "0" ]; then
              python tools/index_qa/shift_entries.py "$GITHUB_WORKSPACE/work/s$S.json" "${SKIP_MS}"
            fi
            FILES="$FILES $GITHUB_WORKSPACE/work/s$S.json"
          done
          # ⛔ **الردُّ بالسورة لا بالدفعة**: آيةٌ واحدةٌ لم تُحلّ كانت تردّ
          #    ثمانيَ سورٍ سليمةً معها — عقوبةٌ على التجميع لا على العطب.
          #    والسورةُ التي لم تُحلّ تُترك كما هي وتُسمَّى، والباقياتُ تمضي.
          python tools/index_qa/splice_surah.py --index work/parent.jz --surah "$SURAHS" \
                 --aligned $FILES --url "$URLT" --skip-unresolved --out work/patched.jz

      - name: ملءُ بصمةِ الصوت للسور المُعاد محاذاتُها
        env:
          SURAHS: ${{ github.event.inputs.surahs }}
        run: |
          # ⛔ **إعادةُ المحاذاة تُصلح المداخل ولا تملأ البراهين** (قياس 2026-09-08):
          #    `splice_surah` ينسخ ترويسةَ الأصل كما هي، فبصمةُ صوتٍ فارغةٌ في
          #    الأصل تبقى فارغةً في المرشَّح — و`run.py` يردّه بـ«بصمات فارغة»
          #    **فيدور القارئُ في حلقةٍ لا تنتهي**: تُصلَح السورةُ ويبقى الحجب.
          #    (‏`obk` س36 دار ثلاثَ تشغيلات.) والملفُّ منزَّلٌ هنا سلفاً،
          #    فالبصمةُ تُحسب منه — **برهانُ تنزيلٍ حقيقيٌّ لا مُصطنَع**.
          python - <<'PY'
          import gzip, hashlib, json, os
          idx = json.loads(gzip.decompress(open("work/patched.jz", "rb").read()).decode())
          sha = idx.get("audioSha256")
          if not isinstance(sha, list):
              print("لا قائمةَ بصمات — لا شيء يُملأ"); raise SystemExit
          while len(sha) < 114:
              sha.append("")
          filled = []
          for s in os.environ["SURAHS"].split(","):
              s = s.strip()
              if not s.isdigit():
                  continue
              n = int(s)
              p = f"work/full_{n}.mp3"
              if not os.path.exists(p):
                  print(f"⚠️ س{n}: لا ملفَّ منزَّل — تُترك بصمتُه كما هي"); continue
              h = hashlib.sha256(open(p, "rb").read()).hexdigest()
              if sha[n - 1] and sha[n - 1] != h:
                  print(f"⚠️ س{n}: بصمةٌ قائمةٌ تخالف المقيسة — تُترك ولا تُكتب فوقها")
                  continue
              sha[n - 1] = h
              filled.append(n)
          idx["audioSha256"] = sha
          with open("work/patched.jz", "wb") as f:
              f.write(gzip.compress(json.dumps(idx, ensure_ascii=False).encode("utf-8")))
          print(f"بصماتٌ مُلئت: {filled} · فارغةٌ باقية: "
                f"{[i + 1 for i, v in enumerate(sha) if not v]}")
          PY

      - name: رفعٌ إلى الاختبار بحُرّاس stage_transform
        env:
          PARENT: ${{ github.event.inputs.parent }}
          SURAHS: ${{ github.event.inputs.surahs }}
          REASON: ${{ github.event.inputs.reason }}
        run: |
          SHA=$(python - <<'PY'
          import json, os, hashlib, boto3
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          b = s3.get_object(Bucket=c["bucket"], Key=os.environ["PARENT"])["Body"].read()
          print(hashlib.sha256(b).hexdigest())
          PY
          )
          # التحويلُ يُسمّي ما استُبدل فعلاً (‏`--skip-unresolved` قد يترك سورة)
          TAKEN="$(cat work/patched.jz.taken 2>/dev/null)"
          [ -z "$TAKEN" ] && TAKEN="$SURAHS"
          python tools/index_qa/stage_transform.py --file work/patched.jz \
                 --parent "$PARENT" --parent-sha "$SHA" \
                 --op "realign_surah:$TAKEN" --reason "$REASON" \
                 --by "github-cd" --yes

      - name: جدولُ قبل/بعد (‏أثرٌ يُقرأ لا يُصدَّق)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realign-${{ github.run_id }}
          path: work/s*.json
          if-no-files-found: warn
