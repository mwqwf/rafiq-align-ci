# دمجٌ تلقائيٌّ لطلبات فروع claude/ في كل مستودعات المالك غير المؤرشفة (خاصّها وعامّها)
# بعد نجاح كل فحوصها. بإذن المالك الصريح في 2026-10-17.
#
# - لماذا في المستودع العامّ: دقائقه مجانية، فلا إنفاق في المستودع الخاص.
# - لماذا توكن المالك (AUTOMERGE_TOKEN) لا GITHUB_TOKEN: الدمج بـGITHUB_TOKEN لا يُشعل
#   سير عمل push على main فيتوقف نشر العامل والموقع وPlay، ولا يصل إلى المستودع الخاص.
# - الجلسات لا تدمج بنفسها بعد الآن؛ هذا السير هو الدامج الوحيد.
# - وسم hold (أو no-automerge) على الطلب يوقف دمجه.
# - تغيير store/release-request.json يلزمه وسم release-approved.
name: automerge
run-name: دمج تلقائي لطلبات claude/ (${{ github.event_name }})

on:
  schedule:
    # دقائقُ بعيدةٌ عن رأس الساعة: GitHub يُسقط الجداول المزدحمة عند :00
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

concurrency:
  group: automerge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # يكفي السكربت وحده؛ المستودع كاملاً 47 ألف ملف
          sparse-checkout: tools/ci_fleet/automerge.py
          sparse-checkout-cone-mode: false
      - name: دمج الطلبات الجاهزة
        env:
          AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        # جداولُ GitHub تُسقَط في هذا المستودع المزدحم (لم تشتعل إلا مرّةً في ساعات 2026-10-17)،
        # فالتشغيلةُ تدور خمسَ دوراتٍ كلَّ 5 دقائق ثم تُطلق نفسَها (بأمر المالك 2026-10-17 15:18Z). دقائقُ المستودع العامّ مجّانية.
        run: |
          for i in 1 2 3 4 5; do
            python3 tools/ci_fleet/automerge.py || true
            [ "$i" = 5 ] || sleep 300
          done
      - name: إطلاقُ الدورة التالية
        if: always()
        env:
          AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: |
          [ -n "$AUTOMERGE_TOKEN" ] || exit 0
          curl -fsS -X POST -H "Authorization: Bearer $AUTOMERGE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/automerge.yml/dispatches" \
            -d '{"ref":"main"}' || echo "تعذّر الإطلاق الذاتي؛ يبقى الجدول احتياطاً"
