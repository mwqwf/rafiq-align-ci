name: rafiq-independent-window-census
run-name: independent-window-census ${{ inputs.key }} s${{ inputs.surah }}
# شاهدٌ مستقلٌّ لصفوف الإحصاء «غير الحاسمة» في سورةٍ محصاة: نموذجا CTC مثبَّتان (عامٌّ
# وقرآنيّ) بدقّة float32 يحاذيان نصَّ كلّ آيةٍ بسياقها داخل نافذة المرشّح على الصوت الأصليّ.
# لا يحوّل جسيماً ولا طفيفاً، ولا يرقّي؛ يكتب التقريرَ المحدَّث بشرط ETag ويؤرشف الأصل.
on:
  workflow_dispatch:
    inputs:
      key:
        description: مفتاحُ المرشّح في timings-staging (‏مثل timings-staging/hafs/asim.48b0baaa.jz)
        required: true
      surah:
        description: رقمُ السورة المحصاة التي تُقاس نوافذُها غير الحاسمة
        required: true
      dry_run:
        description: قياسٌ وتشخيصٌ بلا كتابةٍ في الدلو (‏للضبط السالب)
        type: boolean
        default: false
      reason:
        description: السببُ المقيس
        default: ''
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      CTC_THREADS: '2'
      CTC_INT8: '0'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded binary dependencies
        timeout-minutes: 10
        run: |
          python tools/ci_fleet/install_qa_ffmpeg.py
          python -m pip install --only-binary=:all: --timeout 60 --retries 2 --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --only-binary=:all: --timeout 60 --retries 2 'numpy<2' 'transformers<5' boto3 soundfile
          python -m pip install --timeout 60 --retries 2 ctc-segmentation
      - name: Unit tests of the witness
        run: python -m unittest tools/alignment_v3/test_window_census_witness.py -v
      - name: Restore existing model cache only
        uses: actions/cache/restore@v4
        with:
          path: .hf
          key: ctc-model-jonatasgrosman-xlsr53-ar-v1
      - name: Measure inconclusive windows with two independent pinned models
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          KEY: ${{ inputs.key }}
          SURAH: ${{ inputs.surah }}
          DRY: ${{ inputs.dry_run }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          EXTRA=""
          if [ "$DRY" = "true" ]; then EXTRA="--dry-run"; fi
          python tools/index_qa/ci_window_census.py --key "$KEY" --surah "$SURAH" $EXTRA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-window-census-s${{ inputs.surah }}-${{ github.run_id }}
          path: ops/out/window-census-witness-*.json
          retention-days: 7
          if-no-files-found: ignore
