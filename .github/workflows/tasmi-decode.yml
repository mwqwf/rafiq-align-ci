# 🎛️ **مسحُ معاملات الفكّ لـ«سمّع معي» والتسميع — المستشار (‏القياس)** · 2026-10-02
#
# يحكم بالأرقام على المفاتيح المطفأة في `WhisperDecode`/`NoiseGate`/`FeatureFlags` بلا تدريبٍ ولا APK ولا جهاز المالك،
# على عدّاء `ubuntu-24.04-arm` المجّانيّ (المستودعُ عامّ، العدّادُ القياسيّ، لا كتابةَ في R2 ولا كاشَ جديداً):
#  1. `live`  — نافذةُ الحلقة الحيّة (3.6ث من وسط البند): منحنى `audio_ctx` (هوامش · حدٌّ أدنى) · `-nf` (`liveNoFallback`) ·
#               الخيوط 2/3/4 — الزمنُ والاتّفاقُ وoov (`live_sweep.py`)؛ ثمّ بصمةُ الجلسة (`noise_profile_ab.py`)؛
#               ثمّ `vad_filter` السحابيّ (`cloud_vad_ab.py`) على الصغير وحده.
#  2. `judge` — الحاكمُ الزوجيُّ المعتمد (`v2_gate.py`: دقّةٌ ترتفع · اتّهامٌ كاذبٌ لا يرتفع) على المجموعات الخمس لكلّ ذراع
#               فكٍّ (‏`-nf` · `-nth 1.01` · حرسُ الحكم النهائيّ beam/entropy/best_of) عبر `local_whisper.py --cli-extra`.
# الزنادُ: دفعُ `tools/tasmi_bench/requests/decode.json` (‏`workflow_dispatch` يردّ 403 من الجلسة).
name: tasmi-decode
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/tasmi_bench/requests/decode.json"
permissions:
  contents: read
concurrency:
  group: tasmi-decode
  cancel-in-progress: false
env:
  UA: "Mozilla/5.0 (QuranRafiq tasmi decode)"
  WC: c4ac0012a8f5a2082dfca6aad4ddfd8b2c02b337
jobs:
  live:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: tiny
            lang: en
            url: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev/models/whisper-tiny-ar-quran/ggml-q8_0.bin
          - model: base
            lang: ar
            url: https://github.com/mwqwf/rafiq-align-ci/releases/download/model-whisper-base-ar-quran-q51/ggml-q5_1.bin
    steps:
      - uses: actions/checkout@v4
      - name: المعمارية
        run: |
          [ "$(uname -m)" = "aarch64" ] || { echo "⛔ ليس arm64"; exit 1; }
          echo "nproc=$(nproc)"; grep -m1 -i "^Features" /proc/cpuinfo || true
      - name: مفاتيحُ القراءة من R2 (‏بنودُ العيّنة غيرُ العامّة · لا كتابة)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 - <<'PY2'
          import json, os
          c = json.load(open("secure/r2_credentials.json"))
          keys = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"], "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          env = open(os.environ["GITHUB_ENV"], "a")
          for k, v in keys.items():
              print("::add-mask::" + v); env.write(k + "=" + v + chr(10))
          env.close()
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: العدّة
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build ffmpeg > /dev/null
          pip install -q numpy soundfile scipy boto3
      - name: بناءُ whisper-cli (‏+dotprod+i8mm — أسرعُ نواةٍ مقيسة · المصدرُ المثبّت)
        run: |
          set -o pipefail
          git clone -q --filter=blob:none --no-checkout https://github.com/ggml-org/whisper.cpp wc
          git -C wc fetch -q --depth 1 origin "$WC" && git -C wc checkout -q --detach FETCH_HEAD
          cmake -S wc -B b_i8 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH="armv8.6-a+dotprod+i8mm" > /dev/null
          cmake --build b_i8 --target whisper-cli -j"$(nproc)" > /dev/null
          echo "sdot=$(objdump -d b_i8/bin/whisper-cli | grep -c '\bsdot\b') smmla=$(objdump -d b_i8/bin/whisper-cli | grep -c '\bsmmla\b')"
      - name: النموذج
        run: |
          curl -sSL -f --retry 4 --retry-delay 5 --retry-all-errors -A "$UA" -o tools/tasmi_bench/work_model.bin "${{ matrix.url }}"
          sha256sum tools/tasmi_bench/work_model.bin
      - name: المجموعات (نظيفٌ ومضجَّج — من مصادرها، بلا كاش)
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          python fetch_audio.py
          python augment.py --src-dir work/wav --dest-dir work/wavn --only noise-fan-5
          echo "wav=$(ls work/wav | wc -l) wavn=$(ls work/wavn | wc -l)"
      - name: مسحُ نافذة الحلقة الحيّة — نظيف ومضجَّج
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          R=requests/decode.json
          L=$(python -c "import json;r=json.load(open('$R'));print(r.get('limit_${{ matrix.model }}', r.get('limit',0)))")
          T=$(python -c "import json;print(json.load(open('$R')).get('threads',2))")
          PADS=$(python -c "import json;print(' '.join(str(x) for x in json.load(open('$R')).get('pads',[1,2,3,5])))")
          MINS=$(python -c "import json;print(' '.join(str(x) for x in json.load(open('$R')).get('mins',[512,768,1024])))")
          NFP=$(python -c "import json;print(' '.join(str(x) for x in json.load(open('$R')).get('nf_pads',[2])))")
          TA=$(python -c "import json;print(' '.join(str(x) for x in json.load(open('$R')).get('thread_arms',[3,4])))")
          CLI=../../b_i8/bin/whisper-cli
          python live_sweep.py --cli $CLI --model work_model.bin --lang "${{ matrix.lang }}" --src work/wav --threads "$T" --limit "$L" \
            --pads $PADS --mins $MINS --nofallback --nf-pads $NFP --thread-arms $TA \
            --md work/live_${{ matrix.model }}_wav.md --json work/live_${{ matrix.model }}_wav.json | tail -25
          cat work/live_${{ matrix.model }}_wav.md >> "$GITHUB_STEP_SUMMARY"
          python live_sweep.py --cli $CLI --model work_model.bin --lang "${{ matrix.lang }}" --src work/wavn --clean-src work/wav --threads "$T" --limit "$L" \
            --pads $PADS --mins $MINS --nofallback --nf-pads $NFP --thread-arms $TA \
            --md work/live_${{ matrix.model }}_wavn.md --json work/live_${{ matrix.model }}_wavn.json | tail -25
          cat work/live_${{ matrix.model }}_wavn.md >> "$GITHUB_STEP_SUMMARY"
      - name: بصمةُ الجلسة مقابل بصمة النافذة (‏مضجَّج)
        if: always()
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          R=requests/decode.json
          L=$(python -c "import json;r=json.load(open('$R'));print(r.get('limit_${{ matrix.model }}', r.get('limit',0)))")
          T=$(python -c "import json;print(json.load(open('$R')).get('threads',2))")
          python noise_profile_ab.py --cli ../../b_i8/bin/whisper-cli --model work_model.bin --lang "${{ matrix.lang }}" \
            --noisy-src work/wavn --clean-src work/wav --threads "$T" --limit "$L" \
            --md work/noise_${{ matrix.model }}.md --json work/noise_${{ matrix.model }}.json | tail -12
          cat work/noise_${{ matrix.model }}.md >> "$GITHUB_STEP_SUMMARY"
      - name: ‏`vad_filter` السحابيّ (‏الصغيرُ وحده — ذراعان على المقطع نفسِه)
        if: matrix.model == 'tiny'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          CL=$(python -c "import json;print(json.load(open('requests/decode.json')).get('cloud_limit',0))")
          if [ "$CL" -gt 0 ]; then
            python cloud_vad_ab.py --src work/wav --src work/wavn --limit "$CL" --md work/cloud_vad.md --json work/cloud_vad.json | tail -12
            cat work/cloud_vad.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cloud_limit=0 ⇒ لا نداءَ سحابيّاً"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tasmi-decode-live-${{ matrix.model }}
          path: |
            tools/tasmi_bench/work/live_*.*
            tools/tasmi_bench/work/noise_*.*
            tools/tasmi_bench/work/cloud_vad.*
          retention-days: 14
          if-no-files-found: ignore

  judge:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # 🪞 المرآةُ القائمة (‏`-bo 1 -bs 1`) · والحيُّ الحقيقيّ greedy بـbest_of 5 (‏`whisper_full_default_params(GREEDY)` في jni.c)
          - arm: shipped
            extra: ""
          - arm: bo5
            extra: "-bo 5"
          # ⏱️ `liveNoFallback`: temperature_inc 0 (‏best_of بلا أثرٍ حينئذٍ)
          - arm: nf
            extra: "-bo 5 -nf"
          # 🔇 `hearAll`: no_speech_thold فوق أيّ احتمال
          - arm: hearall
            extra: "-bo 5 -nth 1.01"
          # 🛡️ حرسُ الحكم النهائيّ كما يُشحن (‏beam 5 · et 1.8 · best_of −1 ⇒ مفكٌّ واحدٌ في التراجع = `-bo 1`)
          - arm: guard
            extra: "-bs 5 -et 1.8 -bo 1"
          # 🪞 `guardBestOf`: خمسةُ مرشَّحين في أشواط التراجع
          - arm: guard_bo5
            extra: "-bs 5 -et 1.8 -bo 5"
          # حزمةٌ أضيق لتقليل الزمن
          - arm: beam3
            extra: "-bs 3 -et 1.8 -bo 1"
    steps:
      - uses: actions/checkout@v4
      - name: مفاتيحُ القراءة من R2 (‏لا كتابة)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 - <<'PY2'
          import json, os
          c = json.load(open("secure/r2_credentials.json"))
          keys = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"], "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          env = open(os.environ["GITHUB_ENV"], "a")
          for k, v in keys.items():
              print("::add-mask::" + v); env.write(k + "=" + v + chr(10))
          env.close()
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: العدّة
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build ffmpeg > /dev/null
          pip install -q numpy soundfile scipy boto3
      - name: بناءُ whisper-cli (‏المصدرُ المثبّت · +dotprod+i8mm)
        run: |
          set -o pipefail
          git clone -q --filter=blob:none --no-checkout https://github.com/ggml-org/whisper.cpp wc
          git -C wc fetch -q --depth 1 origin "$WC" && git -C wc checkout -q --detach FETCH_HEAD
          cmake -S wc -B b_i8 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH="armv8.6-a+dotprod+i8mm" > /dev/null
          cmake --build b_i8 --target whisper-cli -j"$(nproc)" > /dev/null
      - name: النموذجُ المشحون (‏tiny q8)
        run: |
          curl -sSL -f --retry 4 --retry-delay 5 --retry-all-errors -A "$UA" -o models.bin \
            https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev/models/whisper-tiny-ar-quran/ggml-q8_0.bin
          sha256sum models.bin
      - name: المجموعاتُ الخمس (‏كما تبنيها tasmi-gate — بلا كاش)
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          python fetch_audio.py
          python augment.py --only noise-fan-5
          python augment_learner.py --only learner-combo
          python inject_riwaya_local.py
          for d in work/wav work/g2/noise-fan-5 work/g2/learner-combo work/g3r/clean work/g3r/noisy; do echo "$d: $(ls $d | wc -l)"; done
      - name: التفريغ (‏البوّابة + سقف 10ث · الذراع ${{ matrix.arm }})
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          JL=$(python -c "import json;print(json.load(open('requests/decode.json')).get('judge_limit',0))")
          for S in g3r:noisy g3r:clean g1 g2:noise-fan-5 g2:learner-combo; do
            T=$(echo "$S" | sed 's/:/-/')
            echo "▶ $T · ${{ matrix.arm }} (${{ matrix.extra }})"
            python local_whisper.py --backend cli --cli "$GITHUB_WORKSPACE/b_i8/bin/whisper-cli" --model "$GITHUB_WORKSPACE/models.bin" \
              --set "$S" --gate --group-cap 10 --threads 4 --lang en --limit "$JL" --cli-extra "${{ matrix.extra }}" \
              --out "work/hyps_dec-${{ matrix.arm }}_${T}_gate_cap10.json" | tail -1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tasmi-decode-hyps-${{ matrix.arm }}
          path: tools/tasmi_bench/work/hyps_dec-*.json
          retention-days: 14
          if-no-files-found: ignore

  verdict:
    needs: judge
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: tasmi-decode-hyps-*
          merge-multiple: true
          path: tools/tasmi_bench/work
      - name: الحكمُ الزوجيّ لكلّ ذراعٍ على مقابلها + الزمن
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          cd tools/tasmi_bench
          ls work/hyps_dec-*.json
          M="work/decode_verdict.md"; : > "$M"
          pair() {  # $1 الأساس · $2 المرشّح · $3 العنوان
            echo "### $3 (‏\`$1\` ⇐ \`$2\`)" >> "$M"
            python v2_gate.py --pattern "work/hyps_{arm}_{tag}_gate_cap10.json" --arms "dec-$1" "dec-$2" --md work/_p.md && cat work/_p.md >> "$M" || echo "⚠️ تعذّر الزوج $1/$2" >> "$M"
          }
          pair shipped bo5      "best_of 5 في greedy (‏الحيُّ الحقيقيّ) مقابل مرآة -bo 1"
          pair bo5 nf           "liveNoFallback (‏temperature_inc 0)"
          pair bo5 hearall      "hearAll (‏no_speech_thold 1.01)"
          pair shipped guard    "حرسُ الحكم النهائيّ المشحون (‏beam 5 · et 1.8 · مفكٌّ واحدٌ في التراجع) مقابل greedy"
          pair guard guard_bo5  "guardBestOf (‏خمسةُ مرشَّحين في التراجع)"
          pair guard beam3      "beam 3 بدل 5"
          python - <<'PY' >> "$M"
          import glob, json, os, statistics as st
          arms = sorted({os.path.basename(p).split("_")[1][4:] for p in glob.glob("work/hyps_dec-*_gate_cap10.json")})
          sets = ["g3r-noisy", "g3r-clean", "g1", "g2-noise-fan-5", "g2-learner-combo"]
          print("\n### ⏱️ وسيطُ زمن البند (م.ث · 4 خيوط · arm64 i8mm) وأقصاه\n")
          print("| الذراع | " + " | ".join(sets) + " |"); print("|---|" + "---:|" * len(sets))
          for a in arms:
              cells = []
              for s in sets:
                  p = f"work/hyps_dec-{a}_{s}_gate_cap10.json"
                  if not os.path.exists(p): cells.append("—"); continue
                  ms = [v["ms"] for v in json.load(open(p, encoding="utf-8"))["hyps"].values() if "ms" in v]
                  cells.append(f"{st.median(ms):.0f} / {max(ms)}" if ms else "—")
              print(f"| {a} | " + " | ".join(cells) + " |")
          PY
          cat "$M" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tasmi-decode-verdict
          path: tools/tasmi_bench/work/decode_verdict.md
          retention-days: 14
