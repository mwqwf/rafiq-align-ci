name: rafiq-splice-census

run-name: census ${{ inputs.only }}

# ⭐ **الإحصاءُ الصوتيُّ الشامل للسور المدموجة بمحرّكٍ آخر** (‏إذن المالك 2026-09-24).
#    كلُّ آيةٍ في كلّ سورةٍ يسمّيها `engineBySurah` في ترويسة الفهرس تُسمع وتُحكم —
#    والسورُ تُقرأ من الفهرس نفسِه لا من المُطلِق. ويُكتب الحكمُ في `state-census/`
#    وحدها، فلا يُعَدّ ملحاً ولا يختلط بعيّنات `state/`. وحارسُ الترقية يطلبه
#    على بصمة الفهرس بعينها، فوق الملوح الأربعة.
# 💰 مستودعٌ عامّ + عدّاد ubuntu-latest القياسيّ ⇒ دقائقُ مجّانيّة.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "مفتاحٌ أو أكثر بفواصل في timings-staging/ — ما لا دمجَ فيه يُتخطّى"
        required: true
      force:
        description: "true = يُعاد الإحصاءُ ولو أُحصي على البصمة نفسها (‏نافذةٌ تعذّرت فردّ الحارسُ)"
        required: false
        default: "false"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      # ‏المرشّحُ يقرأ أسماءَ تحويلات الدمج من `promote.SPLICE_OPS` لا من نسخةٍ هنا.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet boto3
      - id: gen
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import gzip, hashlib, json, os, sys, boto3
          sys.path.insert(0, "tools/index_qa")
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          out = []
          for k in [x for x in os.environ["ONLY"].replace(",", " ").split() if x]:
              if not k.startswith("timings-staging/") or not k.endswith(".jz"):
                  print(f"⏭ {k} — ليس مرشّحاً في الاختبار", file=sys.stderr); continue
              b = s3.get_object(Bucket=c["bucket"], Key=k)["Body"].read()
              d = json.loads(gzip.decompress(b).decode("utf-8"))
              tr = d.get("transform")
              op = str((tr or {}).get("op") or "") if isinstance(tr, dict) else str(tr or "")
              # ‏الاسمان من مصدرٍ واحد (`promote.SPLICE_OPS`): دمجُ CTC في Whisper وعكسُه.
              # ‏ومرآةُ `census_gate`: سورٌ بمحرّكٍ آخر ولو كان آخرُ تحويلٍ إعلانَ غياب (2026-09-25).
              ebs = [s for s, v in (d.get("engineBySurah") or {}).items()
                     if v and v != d.get("engineVersion")]
              if not ebs:
                  print(f"⏭ {k} — لا دمجَ محرّكين", file=sys.stderr); continue
              sha = hashlib.sha256(b).hexdigest()
              try:
                  old = json.loads(s3.get_object(
                      Bucket=c["bucket"],
                      Key="state-census/" + k.replace("/", "_") + ".json")["Body"].read())
                  if old.get("sha256") == sha and os.environ.get("FORCE") != "true":
                      print(f"⏭ {k} — أُحصي على هذه البصمة سلفاً", file=sys.stderr); continue
              except Exception:
                  pass
              out.append(k)
          print(f"matrix={json.dumps(out)}")
          PY

  census:
    name: census ${{ matrix.key }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        key: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: أدوات النظام
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet pywhispercpp soundfile numpy boto3
      - name: كاش النموذج
        uses: actions/cache@v4
        with:
          path: assets-archive/ggml
          key: qa-model-q8-v1
      - name: الإحصاء
        env:
          KEY: ${{ matrix.key }}
          QA_MODEL: ${{ github.workspace }}/assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin
          QA_CACHE: ${{ github.workspace }}/qa_audio
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          eval "$(python - <<'PY'
          import json, shlex
          c = json.load(open("secure/r2_credentials.json"))
          m = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"],
               "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          for k, v in m.items():
              print(f"export {k}={shlex.quote(v)}")
          PY
          )"
          SHA=$(python - <<'PY'
          import hashlib, os, boto3
          s3 = boto3.client("s3", endpoint_url=os.environ["R2_ENDPOINT"],
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
                            region_name="auto")
          b = s3.get_object(Bucket=os.environ["R2_BUCKET"], Key=os.environ["KEY"])["Body"].read()
          print(hashlib.sha256(b).hexdigest())
          PY
          )
          python tools/index_qa/ci_run.py --key "$KEY" --expect-sha "$SHA" --census \
                 --source ci --run-id "${{ github.run_id }}"
