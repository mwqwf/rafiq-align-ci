name: rafiq-struct-candidate

run-name: "struct-candidate ${{ github.event.inputs.key || 'push' }}"

# فحصُ **البنية** لمرشّحٍ في timings-staging بلا كتابةٍ في أيّ مكان (‏`index_qa/run.py --struct-only`): البوّابةُ الأولى
# قبل المطالع والسماع والإحصاء والملوح. تشخيصٌ بأمر القائد (ناصر الماجد س6) — فرعٌ مؤقّتٌ بلا دفعٍ إلى main.
# قارئٌ محض (contents: read): الدلوُ يُقرأ ولا يُكتب، والحكمُ نصّاً في سجلّ التشغيلة ومخرَجِها.
# يُطلَق بدفع ملفّ المعاملات إلى فرع هذا الطلب وحده (workflow_dispatch لا يرى ملفّاً غيرَ موجودٍ في main).
# 💰 مستودعٌ عامّ + ubuntu-latest القياسيّ ⇒ دقائقُ مجّانيّة.
on:
  push:
    branches: [claude/heard-absent-ayahs-nasser6]
    paths: [ops/shadow/struct_candidate.json]
  workflow_dispatch:
    inputs:
      key: {description: "مفتاحُ المرشّح timings-staging/<riw>/<id>.<sha8>.jz", default: ""}

permissions:
  contents: read

concurrency:
  group: rafiq-struct-candidate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  struct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet boto3==1.43.123
      - name: اعتماد R2
        env: {R2_CREDENTIALS_JSON: "${{ secrets.R2_CREDENTIALS_JSON }}"}
        run: mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
      - name: فحصُ البنية (⛔ بلا رفع)
        env:
          EVENT: ${{ github.event_name }}
          IN_KEY: ${{ github.event.inputs.key }}
        run: |
          set -o pipefail
          if [ "$EVENT" = "push" ]; then
            KEY="$(python -c "import json;print(json.load(open('ops/shadow/struct_candidate.json'))['key'])")"
          else KEY="$IN_KEY"; fi
          case "$KEY" in timings-staging/*/*.jz) ;; *) echo "⛔ مفتاحُ مرشّحٍ في timings-staging وحده: $KEY"; exit 1;; esac
          mkdir -p out
          python tools/index_qa/run.py --struct-only "$KEY" --json out/struct.json 2>&1 | tee out/struct.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: struct-candidate-${{ github.run_id }}
          path: |
            out/**
          retention-days: 7
