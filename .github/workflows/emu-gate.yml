# 🌐 نسخةُ مستودع الحوسبة العامّ — السرُّ الواحد R2_CREDENTIALS_JSON · وKVM متاحٌ لعدّاءات المستودعات العامة
# 📱 **المحاكي على العدّاء — آخرُ حلقةٍ كانت تربط دورةَ القرار بجهاز المالك** (‏D-305، تكليفُ مشرف التقييم 2026-09-12).
# بوّابةُ CI مرآةٌ صادقةٌ لكنّها ليست المحرك: `whisper-cli` على لينكس ≠ `whisper.cpp` عبر JNI على أندرويد، وقد فوّتت
# الاتّهامَ الكاذبَ ضجيجاً مرّتين (‏D-280). وهذا يشغّل **المحركَ نفسَه** داخل محاكي أندرويد على عدّاء GitHub (‏KVM متاحٌ
# لعدّاءات المستودعات العامة) بالمسبار `whisperBatch` والسائق `emu_sweep.py` عينِه ⇒ **الرقمُ الفاصل بلا جهاز المالك**.
#   gh workflow run emu-gate.yml -f apk_url=…/apk/app-debug-<sha>.apk -f cand_tag=v5
# ⚠️ يحتاج APK قابلاً للتنقيح (`FLAG_DEBUGGABLE`) لأنّ مفاتيحَ المسابر محجوبةٌ في غيره — ترفعه جلسةُ التطبيق إلى R2.
name: emu-gate
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "رابطُ APK (debuggable) على R2"
        required: true
      cand_tag:
        description: "وسمُ المرشَّح (‏يُقرأ نموذجُه من finetune/out_<tag>/ggml-q8_0.bin؛ فارغٌ = المشحونُ وحدَه)"
        required: false
        default: ""
      base_url:
        description: "رابطُ نموذج خطِّ الأساس (‏فارغٌ = المشحون tiny) — لمقارنة مرشَّحٍ بمشحونٍ آخرَ في **الشوط نفسِه**"
        required: false
        default: ""
      cand_url:
        description: "رابطٌ صريحٌ لنموذج المرشَّح (يغلب المشتقَّ من الوسم — لنماذجَ خارج finetune/out_*)"
        required: false
        default: ""
      sets:
        description: "المجموعات (مفصولةٌ بفواصل) — ‏g4n في الافتراض بأمر D-341"
        required: false
        # ⛔ **`g4n` في الافتراض** (‏D-341): وقع مرّتين في يومٍ واحدٍ أنّ مفتاحاً قِيس على المجموعات
        # السهلة وحدَها **أعطى الجوابَ المعاكس** — الحرسُ (صفرٌ على الطويل النظيف ثمّ ‎+5.77 على
        # المضجَّج) وعرضُ الحزمة (صفرٌ على القصير ثمّ ‎+2.33). فصارت المنطقةُ الصعبةُ تُقاس في كلّ
        # شوطٍ بلا أن يتذكّرها أحد. والمصفوفةُ تُشغّلها **بالتوازي** فلا تطول المدّة.
        default: "g3r:noisy,g1,g4n"
      langs:
        description: "رموزُ لغة الفكّ للمسبار (‏D-303 — يحتاج APK يدعم `--es lang`)"
        required: false
        default: ""
      chain:
        description: "سلسلةُ الواجهة: cap (المقيس) · caponly (بلا بوّابةِ ضجيج) · gateonly (سقفُ 25)"
        required: false
        default: "cap"
      chunk:
        description: "حجمُ الدفعة (‏12 مقيسٌ — 40 تُعلّق المحاكي)"
        required: false
        default: "12"
      ez:
        description: "مفاتيحُ المسبار المنطقيّة مفصولةً بمسافة (‏decodeGuard · criticalPairs)"
        required: false
        default: ""
      ei:
        description: "مفاتيحُ المسبار العدديّة `KEY=INT` مفصولةً بمسافة (‏decodeBeam=3)"
        required: false
        default: ""
      tag_suffix:
        description: "لاحقةُ وسم الذراع مع المفاتيح (‏-dg · -cp) كي لا تُكتب ذراعٌ فوق أخرى"
        required: false
        default: ""
env:
  PUB: https://pub-2c2e1dcd92e84a2898820dd38d3e09e6.r2.dev
  UA: "Mozilla/5.0 (QuranRafiq emu gate)"
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sets: ${{ steps.m.outputs.sets }}
    steps:
      - id: m
        run: python3 -c "import json,os;print('sets='+json.dumps('${{ github.event.inputs.sets }}'.split(',')))" >> "$GITHUB_OUTPUT"
  emu:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJson(needs.matrix.outputs.sets) }}
    steps:
      - uses: actions/checkout@v4
      - name: r2 creds (من السرّ الواحد R2_CREDENTIALS_JSON)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 - <<'PY2'
          import json, os
          c = json.load(open("secure/r2_credentials.json"))
          keys = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"], "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          env = open(os.environ["GITHUB_ENV"], "a")
          for k, v in keys.items():
              print("::add-mask::" + v); env.write(k + "=" + v + chr(10))
          env.close()
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: KVM للمحاكي (عدّاءُ المستودع العامّ يدعم التعشيش)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "⛔ لا /dev/kvm — المحاكي لن يقلع"
      # ⚠️ **إعادةُ محاولةٍ إلزاميّة** (‏2026-09-12): شوطٌ سقط بـ`curl 35` (‏SSL) في هذه الخطوة
      # قبل أن يُقلع المحاكي أصلاً ⇒ ساعةُ عدّاءٍ تضيع لعارضٍ يُعالجُ براية.
      - name: العدّة والمجموعات والنماذج
        run: |
          pip install -q numpy soundfile scipy
          mkdir -p models
          BU="${{ github.event.inputs.base_url }}"
          [ -z "$BU" ] && BU="$PUB/models/whisper-tiny-ar-quran/ggml-q8_0.bin"
          echo "⬇️ خطُّ الأساس: $BU"
          if [ -n "${{ github.event.inputs.base_url }}" ]; then
            W="⚠️ **خطُّ الأساس ليس المشحون**: ذراعُ \`shipped\` في هذا الشوط هي $BU"
            echo "$W" | tee work_baseline.txt >> "$GITHUB_STEP_SUMMARY" || echo "$W" > work_baseline.txt
            echo "$W"
          fi
          curl -sSL -f --retry 4 --retry-delay 5 --retry-all-errors -A "$UA" -o models/shipped.bin "$BU"
          if [ -n "${{ github.event.inputs.cand_tag }}" ]; then
            CU="${{ github.event.inputs.cand_url }}"
            [ -z "$CU" ] && CU="$PUB/finetune/out_${{ github.event.inputs.cand_tag }}/ggml-q8_0.bin"
            echo "⬇️ المرشَّح: $CU"
            curl -sSL -f --retry 4 --retry-delay 5 --retry-all-errors -A "$UA" -o models/cand.bin "$CU"
          fi
          curl -sSL -f --retry 4 --retry-delay 5 --retry-all-errors -A "$UA" -o app.apk "${{ github.event.inputs.apk_url }}"; ls -l models app.apk
      - name: مجموعاتُ القياس (كاشُ tasmi-gate نفسُه)
        id: sets
        uses: actions/cache@v4
        with:
          path: tools/tasmi_bench/work/sets.tar
          key: tasmi-sets-v5-${{ hashFiles('tools/tasmi_bench/sample.json', 'tools/tasmi_bench/inject_plan_riwaya.json', 'tools/tasmi_bench/augment.py', 'tools/tasmi_bench/augment_learner.py', 'tools/tasmi_bench/inject_riwaya_local.py', 'tools/tasmi_bench/build_long.py') }}
      - name: بناءُ المجموعات إن غاب الكاش
        if: steps.sets.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q boto3
          cd tools/tasmi_bench
          python fetch_audio.py && python augment.py --only noise-fan-5 && python inject_riwaya_local.py
          for c in learner-combo learner-repeat learner-basmala; do python augment_learner.py --only "$c"; done
          # ⏱️ **التلاوةُ الطويلة (`g4`) تُبنى أيضاً — ثغرةٌ مقيسةٌ 2026-09-12:** `guardScope=FINAL` يُشحن
          # في **الحكم النهائيّ** (‏`stopAndTranscribe` سقفُه 1200 ث) وكلُ مجموعات البوّابة بنودٌ قصيرةٌ
          # ≤ 30 ث (‏نافذةٌ واحدة) ⇒ كنّا نقرّر في منطقةٍ لا تقيسها بوّابتُنا (‏D-330).
          python build_long.py --ayahs 6
          # ‏**وطويلٌ مضجَّج** (‏D-333): الحرسُ أكبرُ كسبه في الضجيج (+1.45) و**صفرٌ** على
          # الطويل النّظيف ⇒ الصورةُ الرابعةُ هي الفاصلة لقرار `guardScope`.
          python augment.py --src-dir work/g4 --dest-dir work/g4n --only noise-fan-5
          # ‏**منحنى لا نقطة** (‏D-335): الانهيارُ مقيسٌ عند 5 د.ب (‏96.5٪ ⇒ 60.6٪)، والتوصيةُ
          # «لا تُقبل تلاوةٌ طويلةٌ في غرفةٍ صاخبة» لا تُشحن بلا **حدٍّ مقيس** ⇒ طبقتان أخريان.
          python augment.py --src-dir work/g4 --dest-dir work/g4n10 --only noise-fan-10
          python augment.py --src-dir work/g4 --dest-dir work/g4n20 --only noise-fan-20
          tar -cf work/sets.tar -C work wav g2/noise-fan-5 g2/learner-combo g2/learner-repeat g2/learner-basmala g3r/clean g3r/noisy g4 g4n g4n10 g4n20 long_plan.json
      - name: فكُّ المجموعات
        run: cd tools/tasmi_bench/work && tar -xf sets.tar && rm -f sets.tar && ls -d wav g3r g2 g4 g4n g4n10 g4n20 2>/dev/null
      - name: المحاكي + السائقُ نفسُه (‏emu_sweep)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PYTHONIOENCODING: utf-8
          APK: app.apk
          SET: ${{ matrix.set }}
          EZ: ${{ github.event.inputs.ez }}
          EI: ${{ github.event.inputs.ei }}
          TAG_SUFFIX: ${{ github.event.inputs.tag_suffix }}
          CAND_TAG: ${{ github.event.inputs.cand_tag }}
          LANGS: ${{ github.event.inputs.langs }}
          CHUNK: ${{ github.event.inputs.chunk }}
          CHAIN: ${{ github.event.inputs.chain }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # ⛔ سطرٌ واحدٌ فقط: الإجراءُ ينفّذ كلَّ سطرٍ بصدفةٍ منفصلة (‏export و cd لا يعبران).
          script: bash tools/tasmi_bench/ci_emu_run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-${{ strategy.job-index }}
          # ⛔ **`long_plan.json` يُرفع مع المخرَج** (‏2026-09-12): مهمّةُ الحكم تُنزّل المخرَجَ وحدَه ولا
          # تبني المجموعات، و`pool_items()` تقرأ الخطّةَ من `work/` ⇒ بنودُ `g4*` بلا مرجعٍ فتُطبع
          # «⛔ بلا مرجع» (والحارسُ صادقٌ لكنّ العلّةَ عندنا). فتُحمل الخطّةُ مع الأرقام.
          path: |
            tools/tasmi_bench/work/hyps_emu_*.json
            tools/tasmi_bench/work/long_plan.json
          retention-days: 7
          if-no-files-found: ignore
  judge:
    needs: emu
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: r2 creds (من السرّ الواحد R2_CREDENTIALS_JSON)
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure && printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python3 - <<'PY2'
          import json, os
          c = json.load(open("secure/r2_credentials.json"))
          keys = {"R2_ENDPOINT": c["endpoint"], "R2_ACCESS_KEY_ID": c["accessKeyId"], "R2_SECRET_ACCESS_KEY": c["secretAccessKey"], "R2_BUCKET": c["bucket"]}
          env = open(os.environ["GITHUB_ENV"], "a")
          for k, v in keys.items():
              print("::add-mask::" + v); env.write(k + "=" + v + chr(10))
          env.close()
          PY2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy boto3 soundfile
      - uses: actions/download-artifact@v4
        with:
          pattern: emu-*
          merge-multiple: true
          path: tools/tasmi_bench/work
      - name: الحكمُ على المحرك
        env:
          PYTHONIOENCODING: utf-8
          SUF: ${{ github.event.inputs.tag_suffix }}
        run: |
          cd tools/tasmi_bench
          ls work/hyps_emu_*.json || { echo "⛔ لا مخرَج من المحاكي"; exit 1; }
          T="${{ github.event.inputs.cand_tag }}"; M="work/emu_${T:-shipped}.md"
          if [ -n "${{ github.event.inputs.langs }}" ]; then
            set -- ${{ github.event.inputs.langs }}
            python v2_gate.py --score-only --arms "shipped-$1" "shipped-$2" --md "$M"
          elif [ -n "$T" ]; then
            # ⛔ **اللاحقةُ تُمرَّر هنا أيضاً** (‏2026-09-13): كان فرعُ المرشَّح يتجاهل `tag_suffix` كما
            # كان يتجاهله فرعُ الضابط، فيبحث عن `shipped`/`base-ar` والمسحُ كتب `shipped-B`/`base-ar-B`
            # ⇒ جدولٌ كلُّه «⏳» **وخروجٌ ناجح**. والعطبُ نفسُه في موضعَين، أُصلح أحدُهما ونُسي الآخر.
            python v2_gate.py --score-only --arms "shipped$SUF" "$T-ar$SUF" --md "$M"
          else
            # 🛡️ **وضعُ الضابط** (بلا مرشَّح): لا زوجَ يُقارَن، فتُطبع أرقامُ الذراع المشحونة **المطلقة**
            # ليُقابَل بها المرجعُ المعروف (‏9.44٪ اتّهاماً ضجيجاً · G1 96.87٪). وكان يسقط بـ`--arms shipped -ar`.
            python - <<'PYJ' | tee "$M"
          import json, os, sys
          sys.path.insert(0, ".")
          import v2_gate as G
          # ⛔ 2026-09-12: وضعُ الضابط كان يقرأ الذراعَ `shipped` و**يتجاهل لاحقةَ الوسم**،
          # والمسحُ يكتب `shipped-j` ⇒ لا يجد ملفاً فيُطبع **جدولٌ برأسٍ بلا صفوف** ويُحسب نجاحاً.
          ARM = "shipped" + os.environ.get("SUF", "")
          plan = json.load(open("inject_plan_riwaya.json", encoding="utf-8"))["items"]
          print("| المجموعة | ن | اتّهامٌ كاذب | كشف |")
          print("|---|---:|---:|---:|")
          for s in ("g3r:noisy", "g3r:clean"):
              h = G.load_hyps(s, ARM)
              if not h: continue
              d, fa, n, _ = G.judge_arm(plan, h)
              print(f"| {s} | {n} | {fa*100:.2f}٪ | {d*100:.1f}٪ |")
          import score as SC
          pool = G.pool_items()          # العيّنة **مع** خطّة التلاوة الطويلة — وإلّا فكلُ مجموعةٍ طويلةٍ تُعطي صفراً صامتاً
          for s in ("g1", "g2:noise-fan-5", "g2:learner-combo", "g4", "g4n", "g4n10", "g4n20", "g4q", "g4c"):
              h = G.load_hyps(s, ARM)
              if not h: continue
              items = [it for it in pool if it["id"] in h]
              if not items:
                  print(f"| {s} | ⛔ {len(h)} بنداً بلا مرجع | — | لا رقم |"); continue
              a = SC.aggregate(SC.run(items, h, "proposed"))
              print(f"| {s} · تتبّع | {a['scored']} | — | دقّة {a['accuracy']*100:.2f}٪ |")
          PYJ
          fi
          { echo "### 📱 emu-gate (المحركُ داخل محاكي العدّاء)"; cat "$M"; } >> "$GITHUB_STEP_SUMMARY"
      - name: رفعٌ إلى R2
        run: |
          cd tools/tasmi_bench
          T="${{ github.event.inputs.cand_tag }}"; T="${T:-shipped}"
          ARGS="work/emu_$T.md finetune/gate/$T/emu.md"
          for f in work/hyps_emu_*.json; do ARGS="$ARGS $f finetune/gate/$T/emu_$(basename $f)"; done
          python ../finetune/r2_put.py $ARGS
          echo "☁️ $PUB/finetune/gate/$T/emu.md"

      # 📌 **النتيجةُ تُودَع في المستودع نفسِه** — لا في مصنوعةٍ ولا في R2 وحدَهما.
      # ⛔ **السبب مقيسٌ لا مفترَض** (‏2026-09-13): الوكيلُ السحابيّ يستطيع `git clone` و`api.github.com`،
      # **ولا يستطيع** تنزيلَ مصنوعةٍ (الوسيطُ يردّ 403 على مضيف التنزيل) ولا `r2.dev` (403 كذلك).
      # وقد قرأ سجلَّ **وظيفةِ المحاكي** بدل **وظيفة الحكم** فخرج بحكمٍ معكوس. ⇒ النتيجةُ تصير **ملفّاً
      # في git**: يقرؤها بـ`git pull` بلا مفتاحٍ ولا اختيارِ وظيفة، ويقرؤها المالكُ من هاتفه.
      - name: إيداعُ النتيجة في المستودع (‏كي يقرأها الوكيلُ السحابيُّ والمالك)
        if: always()
        run: |
          T="${{ github.event.inputs.cand_tag }}"; T="${T:-shipped}"
          M="tools/tasmi_bench/work/emu_${T}.md"
          [ -f "$M" ] || { echo "⛔ لا جدولَ نتيجةٍ — لا شيءَ يُودَع"; exit 0; }
          mkdir -p results
          OUT="results/emu_${T}_${{ github.run_id }}.md"
          {
            echo "# نتيجةُ \`emu-gate\` · الوسم \`${T}\` · الشوط ${{ github.run_id }}"
            echo
            echo "- التاريخ: $(date -u +%FT%TZ)"
            echo "- المجموعات: \`${{ github.event.inputs.sets }}\`"
            echo "- خطُّ الأساس: \`${{ github.event.inputs.base_url }}\`" 
            echo "- المرشَّح: \`${{ github.event.inputs.cand_url }}\`"
            echo "- السلسلة: \`${{ github.event.inputs.chain }}\` · اللاحقة: \`${{ github.event.inputs.tag_suffix }}\`"
            echo
            cat "$M"
          } > "$OUT"
          cp "$OUT" results/LATEST_emu.md
          git config user.name "rafiq-ci"
          git config user.email "ci@users.noreply.github.com"
          git add "$OUT" results/LATEST_emu.md
          # `actions/checkout` يُبقي بيانةَ الدفع في إعداد المستودع ⇒ لا حاجةَ إلى ترويسةٍ يدويّة.
          git commit -q -m "results(emu-gate): ${T} · الشوط ${{ github.run_id }}" || { echo "لا تغيير"; exit 0; }
          for i in 1 2 3; do
            git fetch -q origin main && git merge -q --no-edit origin/main && git push -q origin HEAD:main && { echo "✅ أُودعت $OUT"; exit 0; }
            echo "↻ محاولةٌ $i"; sleep 5
          done
          echo "⛔ تعذّر الدفع"; exit 0
