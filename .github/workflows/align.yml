name: rafiq-align

# ⛔ الهويّةُ عند الإنشاء لا عند التشغيل — انظر التعليقَ نفسَه في `audio_qa.yml`.
#    وهذا هو السؤالُ الذي كلّف الدرسَ 36: «أيَّ قائمةٍ تحمل الموجةُ الجارية؟»
#    أُجيب عنه بتشغيل `assign_shard.py` محلّيّاً على كلّ قائمةٍ حتى طابقت
#    المناراتِ 20/20 — وهو هنا **سطرٌ يُقرأ قبل أن تبدأ الموجةُ أصلاً**.
run-name: >-
  align ${{ inputs.list }} · shards=${{ inputs.shards }} ·
  jpr=${{ inputs.jobs_per_runner }}

# أسطول فهرسة المحاذاة على عدّائي GitHub المجانيين.
# ⛔ لا يعمل تلقائياً: التشغيل بيدٍ صريحة (workflow_dispatch) — لا push ولا cron.
#
# ═══ كيف تعرف ما تعمله موجةٌ جارية (⛔ اقرأ هذا قبل التفكير في إلغائها) ═══
#
#     git ls-remote origin 'refs/heads/progress/*'
#     gh api 'repos/mwqwf/rafiq-align-ci/contents?ref=progress/N' --jq '.[].name'
#     gh api repos/mwqwf/rafiq-align-ci/contents/shard-N-RUN.json?ref=progress/N \
#       --jq .content | base64 -d
#     ⇒ {"shard":4,"surahs":19,"reciter":"m_sayed_warsh","at":"…","run":"…"}
#
# **الهويّةُ والتقدّمُ والحياةُ في سطرٍ واحدٍ لكلّ شريحة، والموجةُ جارية.**
# و`run` فيه يفصل نبضةَ هذه الموجة عن منارةٍ قديمةٍ لم تُحدَّث بعد.
# ⛔ واسمُ الملفّ يحمل رقمَ التشغيل منذ 2026-09-12: موجتان فيهما شاردةُ 0
#    (‏موجةٌ كاملة + تشغيلةُ `ac256` مفردة) كانتا تكتبان على `shard-0.json`
#    نفسِه فيغلب آخرُ كاتب — فسطرُ الجرد أعلاه يسبق القراءة.
#
# ⛔⛔ **وسببُ كتابة هذا هنا مقيسٌ بثمنه (2026-09-07):** كُتب في
# `docs/RECITERS_MASTER_REFERENCE.md` **ثلاثَ دوراتٍ** أنّ هويّة الموجة «غيرُ
# قابلةٍ للقياس بثلاثة مسالك» (اسمُ الوظيفة · سجلُّ الجارية 404 · `prepare`)،
# والمنارةُ قائمةٌ منذ 09-02 لهذا السؤال بعينه — لكنّها تسكن `tools/ci_fleet/`
# ولا تُذكر حيث يُطرح السؤال. وكاد ذلك يُلغي موجةً فيها **إعادةُ بناء
# `m_sayed_warsh`** (أولويةُ المرحلة) وأربعُ رواياتٍ صغرى.
# ⇒ **الأداةُ التي لا يُذكر اسمُها في موضع السؤال لا تُستعمل** — وهو الدرس 21
#    مطبَّقاً على المعرفة لا على الشفرة.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "عدد الشرائح (= عدد المهام المتوازية). السقفُ 12 — والباقي للأحكام"
        default: "12"
      jobs_per_runner:
        description: "عمليات متوازية داخل كل عدّاء (مستودع عام = 4 vCPU ⇒ 4)"
        default: "4"
      smoke:
        description: "تجربة قصيرة: قارئ واحد وسورة واحدة قصيرة (يُنصح قبل أول تعميم)"
        type: boolean
        default: true
      smoke_reciter:
        description: "معرّف القارئ للتجربة القصيرة (سطره في reciters.tsv)"
        default: ""
      smoke_surahs:
        description: "نطاق السور للتجربة القصيرة"
        default: "108"
      list:
        description: "ملف القرّاء (نسبةً إلى tools/ci_fleet/)"
        default: "reciters_ci.tsv"
      whisper_ac:
        # ⛔ الافتراضُ "0" هو بناءُ الأسطول كلِّه (قرارُ github-f4) — فلا يتغيّر
        #    شيءٌ ما لم يُمرَّر صراحةً، والفهارسُ تبقى مقارَنةً بما بُنيت به.
        # ⭐ وسببُ فتحِه مقيسٌ (‏ليلة 2026-09-09): `whisper_ac=256` يكسر حلقةَ
        #    هلوسة التكرار — ثلاثُ سورٍ استعصت ثلاثَ محاولاتٍ لكلٍّ بـ512
        #    ونجحت أوّلَ مرّة بـ256. و`realign_surah.yml` يقبله منذ ذلك اليوم،
        #    **وهذا الملفُّ لا** — فكان اختبارُ الهلوسة على القرّاء الراسبين
        #    الستّة (`f_khamery` 16.0% · `bilal` 10.2% · `hatem` 7.0% ·
        #    `h_abudalal` 6.5% · `shaksh` 5.7% · `qasm` 5.1%) متعذّراً بسطرٍ
        #    واحدٍ ثابت، وهم إنما حُكم عليهم **قبل** اكتشاف الهلوسة.
        # ⛔ ولا يُغيَّر في موجةٍ عاديّة: كلُّ قيمةٍ تُنتج فهارسَ لا تُقارن بغيرها،
        #    وكاشُ العمل مفتاحُه `ac${WHISPER_AC}` فيبطل عمداً عند التغيير.
        description: "‏-ac لـwhisper (‏0 = بناءُ الأسطول. 256 لاختبار هلوسة التكرار وحدَه)"
        default: "0"

# ⛔ ثلاثُ مجموعاتٍ لا واحدة: مجموعةٌ واحدة تجعل **تشغيلة القياس تصطفّ خلف
#    الموجة** فلا تعمل قبل ساعات — وهي إنما أُطلقت لتقيس **الآن** قبل الالتزام
#    بعشرين. فالقياس (‏smoke) في مجموعته، والموجات الكاملة في مجموعتها، ويبقى
#    المنع قائماً حيث يلزم: **لا موجتان كاملتان معاً**.
#
# ⭐⭐ والثالثةُ أُضيفت 2026-09-10 بثمنٍ مقيس: **مسبارٌ بشاردةٍ واحدة ليس موجة**،
#    وحبسُ الموجة خلفه ينقض العلّةَ التي كُتبت من أجلها المجموعتان أصلاً.
#    الواقعة: `reciters_halluc_ac256.tsv` (‏`shaksh` وحدَه · shards=1 ·
#    smoke=**false**) شغل مجموعةَ `rafiq-align-false`، فبقيت موجةُ
#    `reciters_qw_new2.tsv` (‏**خمسةَ عشرَ قارئَ ورشٍ وقالون — أولويّةُ المالك
#    الأولى**) `pending` بصفر وظائف، ومسبارُه يستغرق ساعاتٍ لأنّه مصحفٌ كاملٌ
#    على شاردةٍ واحدة. ⇒ **الوزنُ يُقاس بالشرائح لا بعلَم `smoke`**: ما كان
#    شاردتين فأقلّ مسبارٌ له لَحنُه، وما زاد موجةٌ في لَحن الموجات.
#    وسعةُ العدّاء تحتمل: مسبارٌ (1) + موجةٌ (12) = 13 من عشرين، فيبقى سبعٌ
#    للأحكام — وهو الشرطُ الذي بُنيت عليه قاعدةُ «اثنتا عشرةَ شاردةً لا عشرون».
concurrency:
  group: rafiq-align-${{ github.event.inputs.smoke }}-${{ fromJSON(github.event.inputs.shards || '12') <= 2 && 'probe' || 'full' }}
  cancel-in-progress: false

env:
  # ⛔ مثبَّت على إيداع بعينه: master يتغيّر بين دفعتين فيختلف الثنائي بلا أن ندري.
  #    (‏ggml-org/whisper.cpp @ 2026-08-31). تغييره يبطل كاش الثنائي عمداً.
  WHISPER_REF: eacbd8234c6654cdbf2c377f72b2106875479bdc
  PY: "3.11"
  # قرار المشرف github-f4 (2026-09-02، قياس 8e 37eea00/997859f): عملية لكل نواة، وبلا -ac 512
  WHISPER_THREADS: "1"
  # ⛔ يبقى "0" ما لم يُمرَّر — انظر تعليقَ المُدخل `whisper_ac` أعلاه.
  WHISPER_AC: ${{ github.event.inputs.whisper_ac || '0' }}

jobs:
  # ── المصفوفة تُبنى ديناميكياً من مُدخل shards ────────────────────────────
  prepare:
    # ⛔ الاسمُ يحمل القائمة: `gh run view --json jobs` يقرؤه **والموجةُ جارية**،
    #    بلا سجلٍّ ولا انتظار — وهو المسلكُ الوحيد الذي لم يسقط في قياس 09-07.
    name: prepare — ${{ github.event.inputs.list }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          n=${{ github.event.inputs.shards }}
          if [ "${{ github.event.inputs.smoke }}" = "true" ]; then n=1; fi
          # ⛔ **سقفٌ صلب 12 — والوصيّةُ لا تحرس** (2026-09-08): حصّةُ التوازي
          #    عشرون، فموجةٌ بعشرين شاردة **تُجوّع البوابة** فيقف كلُّ حكمٍ
          #    خلفها. وقع مرّتين: موجةٌ حبست 21 حكماً خمسَ ساعات، ثم موجةٌ
          #    ثانية ألغت موجةً أصغر بعد أن كُتبت القاعدةُ نصّاً في تعليمات
          #    الدورة. ⇒ القاعدةُ تُنقل من المستند إلى الأداة.
          #    **والمرشَّحُ المحسوبُ بلا حكمٍ لا يُعَدُّ في الرقم** — فالمحاذاةُ
          #    بلا سعةٍ للحكم تُنتج ما لا يُحكم فيه.
          if [ "$n" -gt 12 ]; then
            echo "⛔ $n شاردة تتجاوز السقف — تُخفَّض إلى 12 لتبقى ثمانٍ للأحكام."
            n=12
          fi
          echo "matrix=$(python3 -c "import json,sys;print(json.dumps(list(range(int(sys.argv[1])))))" "$n")" >> "$GITHUB_OUTPUT"
          # ⛔ هويّةُ الموجة تُكتب هنا — والسببُ مقيسٌ بثمنه (2026-09-07):
          #    موجةٌ حبست الطابور ساعتين، و**هويّتُها تعذّر قياسُها بثلاثة مسالك**:
          #    اسمُ الوظيفة `align (8)` شريحةٌ لا قارئ · سجلُّ الوظيفة الجارية 404 ·
          #    ومفتاحُ الكاش مُرقَّمٌ بالشريحة لا بالقائمة. فتُقايَض الأولويةُ على ظنّ.
          #    و`prepare` تتمّ في ثوانٍ ⇒ سجلُّها وملخّصُها يُقرآن فوراً بلا انتظار.
          echo "الموجة: قائمة=${{ github.event.inputs.list }} · شرائح=$n · smoke=${{ github.event.inputs.smoke }} · قارئ_smoke=${{ github.event.inputs.smoke_reciter }}"
          {
            echo "### هويّةُ الموجة"
            echo "- القائمة: \`${{ github.event.inputs.list }}\`"
            echo "- الشرائح: \`$n\` · smoke: \`${{ github.event.inputs.smoke }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  align:
    name: align ${{ github.event.inputs.list }} (${{ matrix.shard }})
    needs: prepare
    runs-on: ubuntu-latest
    # ⛔ للمنارة وحدها: كتابةُ فرع `progress/<shard>`. ولا شيء غيرها يكتب.
    permissions:
      contents: write
    timeout-minutes: 350          # سقف GitHub 360 — نترك 10د للحفظ والرفع
    strategy:
      fail-fast: false            # سقوط شريحة لا يُسقط البقية
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY }}

      - name: أدوات النظام
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg cmake build-essential
          python -m pip install --quiet boto3 numpy

      # ── whisper.cpp: يُبنى مرة ويُخبَّأ ──────────────────────────────────
      # ⚠️ GGML_NATIVE=OFF عمداً: الكاش يُستهلك على عدّاء قد يختلف طرازه،
      #    وثنائيٌّ مبنيٌّ بتعليمات معالجٍ آخر يسقط بـSIGILL. الثمن سرعةٌ أقل،
      #    والبديل (بناء في كل مهمة) يلتهم نصف المهلة عشرين مرة.
      - name: كاش ثنائي whisper
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: whisper-bin
          key: whisper-cli-${{ runner.os }}-${{ env.WHISPER_REF }}-avx2-v1

      - name: بناء whisper.cpp (عند غياب الكاش)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          # ⛔ إيداعٌ بعينه لا فرع: --branch لا يقبل SHA، فالجلب المباشر للإيداع.
          mkdir -p wsrc && cd wsrc && git init -q .
          git remote add origin https://github.com/ggml-org/whisper.cpp.git
          git fetch -q --depth 1 origin "$WHISPER_REF"
          git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          # ⭐⭐ **`GGML_NATIVE=OFF` وحدَه كان يُسقط AVX2/FMA/F16C** — فالثنائي
          #    يعمل بتعليماتٍ عدديّةٍ بدائيّة على عدّاءٍ يدعمها كلَّها. والحلُّ
          #    ليس `NATIVE=ON` (يكسر الكاش بين طُرُز العدّائين ويُسقط بـSIGILL)
          #    بل **تسميةُ المجموعة صراحةً**: كلُّ عدّائي GitHub x86_64 يدعمون
          #    AVX2/FMA/F16C، و**AVX512 يبقى مطفأً** لأنّه ليس مضموناً فيهم.
          #    المكسبُ المقيس في هذا المشروع سابقاً **1.79×**، ولا يمسّ حكماً
          #    ولا عتبة: النموذجُ والأعلامُ والمخرَجُ كما هي حرفاً.
          #    ⛔ ويبقى ثنائي `audio_qa.yml` على حاله حفظاً لقابلية المقارنة.
          cmake -S wsrc -B wsrc/build -DCMAKE_BUILD_TYPE=Release             -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON             -DGGML_F16C=ON -DGGML_AVX512=OFF             -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build wsrc/build --config Release -j"$(nproc)"
          mkdir -p whisper-bin
          cp "$(find wsrc/build -name whisper-cli -type f | head -1)" whisper-bin/whisper-cli
          find wsrc/build -name "*.so*" -exec cp {} whisper-bin/ \;

      # ── المسارات التي تتوقعها العدة كما هي (⛔ لا تعديل على شفرة العدة) ──
      # common.py يبني المسارات من ROOT، وrun_fleet.py يثبّت /root/QuranRafiq
      # و.venv/bin/python — فنُرضيهما بوصلات لا بتحرير سطر واحد منهما.
      - name: تركيب المسارات المتوقَّعة
        run: |
          mkdir -p assets-archive/ggml/bin/Release
          cp whisper-bin/whisper-cli assets-archive/ggml/bin/Release/whisper-cli.exe
          cp whisper-bin/*.so* assets-archive/ggml/bin/Release/ 2>/dev/null || true
          chmod +x assets-archive/ggml/bin/Release/whisper-cli.exe
          # ⛔ برهانٌ أن الثنائي **يعمل** لا أنه موجود: سقطت موجة 33626892332
          #    بعد 22 دقيقة بـ`exit status 127` على **كل** سورة — أي أن whisper
          #    لم يُنفَّذ قط (مكتبةٌ مشتركة مفقودة)، والملف موجودٌ وقابلٌ للتنفيذ.
          #    الفحص ثانيتان، وثمن غيابه كان الموجة كلها.
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/assets-archive/ggml/bin/Release:${LD_LIBRARY_PATH:-}"
          if ! assets-archive/ggml/bin/Release/whisper-cli.exe --help >/dev/null 2>&1; then
            echo "⛔ whisper-cli لا يعمل — مكتبةٌ مفقودة أو ثنائيٌّ معطوب:"
            ldd assets-archive/ggml/bin/Release/whisper-cli.exe 2>&1 | grep -i "not found" || true
            exit 1
          fi
          echo "✅ whisper-cli يعمل · المكتبات: $(ls assets-archive/ggml/bin/Release/*.so* 2>/dev/null | wc -l)"
          mkdir -p .venv/bin && ln -sf "$(command -v python)" .venv/bin/python
          sudo mkdir -p /root && sudo ln -sfn "$GITHUB_WORKSPACE" /root/QuranRafiq
          sudo chmod 755 /root

      # ⛔ فخّ كلّف أسطول الخوادم 228 سورة الليلة (تحذير github-b9): `pipeline.py`
      #    يستورد `refine` من tools/alignment_v2 عبر sys.path.insert. إن غاب المجلد
      #    سقطت كل سورة تبلغ الصقل، **وخرج الفهرس مكتملاً في الظاهر وهو جيلٌ أول**.
      #    فيُفحص هنا — قبل أي عمل — لا وقت التشغيل.
      - name: برهان الجيل الثاني (⛔ قبل أي فهرسة)
        run: |
          test -d tools/alignment_v2 || { echo "⛔ tools/alignment_v2 غائب"; exit 1; }
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools/alignment_v2")
          import refine  # noqa: F401
          print("✅ refine مستورَد — الصقل حيّ")
          PY

      # ⛔ برهانٌ ثانٍ كان ينقصني وكلّف 19 شريحة × 89 دقيقة: فحصتُ أن `refine`
      #    **يُستورَد**، ولم أفحص أن **بناء الفهرس نفسه** يستورد. و`validate.py`
      #    يستورد `coverage_guard` من `tools/cloud/` — وكانت ناقصةً من صورتي
      #    (نسختُ `run_fleet.py` وحده) فسقط البناء **بعد** انتهاء التفريغ كله.
      #    ⇒ يُفحص **كل** ما يلزم للبناء قبل أي عمل، لا وحدةً واحدة.
      - name: برهان سلسلة البناء (⛔ قبل أي فهرسة)
        run: |
          python - <<'PY'
          import sys
          for p in ("tools/alignment", "tools/alignment_v2", "tools/cloud"):
              sys.path.insert(0, p)
          import refine, coverage_guard, validate, pipeline, batch_run  # noqa: F401
          print("✅ سلسلة البناء كاملة: refine · coverage_guard · validate · pipeline · batch_run")
          PY

      - name: اعتماد R2 والنموذج
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          # ⛔ عبر متغير بيئة لا سطر أمر: سطر الأمر يظهر في السجل العام.
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json
          python - <<'PY'
          import json, os, boto3
          c = json.load(open("secure/r2_credentials.json"))
          s3 = boto3.client("s3", endpoint_url=c["endpoint"],
                            aws_access_key_id=c["accessKeyId"],
                            aws_secret_access_key=c["secretAccessKey"], region_name="auto")
          dst = "assets-archive/ggml/ggml-tiny-ar-quran-q8_0.bin"
          os.makedirs(os.path.dirname(dst), exist_ok=True)
          s3.download_file(c["bucket"], "models/whisper-tiny-ar-quran/ggml-q8_0.bin", dst)
          print("النموذج:", os.path.getsize(dst) // 1024 // 1024, "م.ب")
          # ⛔ نموذجُ الصقل مستقلٌّ (D-179): التفريغُ العامّ بالسريع والصقلُ
          #    بالأدقّ — فالعطبُ الجسيم محصورٌ في حدود MED/LOW وهي ما يصقله.
          rdst = "assets-archive/ggml/ggml-refine-q8_0.bin"
          s3.download_file(c["bucket"], "models/whisper-base-ar-quran/ggml-q8_0.bin", rdst)
          print("نموذج الصقل:", os.path.getsize(rdst) // 1024 // 1024, "م.ب")
          PY

      # ── الاستئناف: العمل المنجز يُخبَّأ فيلتقطه التشغيل التالي ───────────
      # batch_run.py لا يعيد سورةً لها json — فالكاش وحده يكسر سقف الست ساعات.
      # ⛔ الوصفة جزءٌ من المفتاح (أمر github-f4 بعد بلاغ 7d): `batch_run.py` لا
      #    يعيد سورةً لها `s*.json` — وهذه هي نعمة الاستئناف ونقمته معاً. فكاشٌ
      #    وُلّد بـ`-ac 512` يُستعاد على تشغيلةٍ بـ`-ac 0` **فلا يُعاد التعرّف
      #    أصلاً**، ويخرج فهرسٌ بالوصفة القديمة تحت اسم الجديدة. تغيير الوصفة
      #    يجب أن يُبطل الكاش، ولذلك دخلت في المفتاح لا في التعليق.
      # ⛔ الاستعادة والحفظ منفصلان عمداً (إذن github-f4، 2026-09-02):
      #    `actions/cache` المدمج يحفظ في خطوةٍ لاحقة **لا تُضمَن عند القتل**،
      #    ووثائقه صامتةٌ عن الإلغاء والفشل تماماً — وإحالتها إلى إجراء `save`
      #    المستقل «للتحكم الدقيق في وقت الحفظ» هي نفسها قرينةٌ على ذلك.
      #    والشريحة هنا تُقتل غالباً بسقف الست ساعات لا بنجاحها ⇒ الحفظ عند
      #    النجاح وحده يعني **ألّا يُحفظ شيء أبداً**، فيضيع عملُ ست ساعات كاملة.
      #    و`if: always()` يجعل الجزئيّ محفوظاً فيستأنفه التشغيل التالي.
      # ⛔ نسخة VAD جزءٌ من مفتاح الكاش (قرار github-f4 على تحفّظٍ رفعتُه):
      #    الرقعة المتكيّفة تغيّر **التقطيع** لا التفريغ، و`batch_run` لا يعيد
      #    سورةً لها `s*.json` ⇒ شريحةٌ تُعاد بعد الرقعة تستأنف القديم فلا
      #    يُعاد التقطيع أصلاً، ويخرج فهرسٌ بـVAD القديم تحت اسم الجديد —
      #    وهو فخّ `tareq_qalun` نفسه في ثوبٍ ثانٍ. **كل معاملٍ يغيّر المخرَج
      #    يدخل المفتاح، وإلا صار الكاش يكذب باسم السرعة** (قاعدة github-82).
      #    وقبل وصول الرقعة تُستعمل قيمةٌ ثابتة تميّز الحقبة القديمة، فلا
      #    تختلط كاشات ما قبلها بما بعدها.
      - name: وسم نسخة VAD
        run: |
          v=$(grep -oE '^VAD_VERSION[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)' \
              tools/alignment/vad.py 2>/dev/null | sed -E 's/.*["'"'"']//' || true)
          [ -n "$v" ] || v="legacy-fixed004"
          echo "VAD_VERSION=$v" >> "$GITHUB_ENV"
          echo "نسخة VAD: $v"

      # ⛔⛔ هويّةُ الكاش **باسمِ القارئ لا برقمِ الخانة** — والعلّةُ مقيسةٌ بثمنها
      #    ثلاثَ مرّات (‏آخرُها 2026-09-12): الشريحةُ تأخذ `rows[i::shards]`
      #    ⇒ رقمُ الخانة = رقمُ الصفّ، وكان المفتاحُ يحمل رقمَ الخانة وحدَه.
      #    فأيُّ تعديلٍ في **رأس** قائمة الموجة (‏ترقيةُ قارئٍ · إخراجُ آخر)
      #    يُزيح كلَّ من تحته خانةً **فيخسرون كاشَهم كلَّهم** — ساعاتِ عملٍ
      #    محفوظة. والقياسُ الأخير: موجةٌ ماتت بسقف الست ساعات وفيها
      #    `asim` 514م.ب و`noah_qalun` 170م.ب، **ولا سبيلَ لإصابة الخانتين معاً**
      #    بقائمةٍ أقصرَ من سبعة صفوف ⇒ 514م.ب ضاعت اضطراراً.
      #    ⇒ العلاجُ أن يتبع الكاشُ **مَن يعمل** لا **أين يقع**، فيصير ترتيبُ
      #    القائمة حرّاً بلا ثمن. والسقوطُ إلى مفتاح الخانة يبقى **الثانيَ في
      #    `restore-keys`** حتى لا تضيع الكاشاتُ المكتوبةُ بالوصفة القديمة.
      - name: هويّةُ كاشِ الشريحة (‏باسمِ القارئ)
        id: ckey
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.smoke == 'true' && '1' || github.event.inputs.shards }}
          LIST_FILE: tools/ci_fleet/${{ github.event.inputs.list }}
        run: |
          # ⛔ لا يُسقِط هذا العدّاءَ أبداً: كلُّ تعثّرٍ يسقط إلى وسمِ الخانة
          #    فيلتقطه `restore-keys` الثاني كما كان قبل هذه الخطوة أصلاً.
          tag="x${SHARD}"
          ids="$(python3 tools/ci_fleet/assign_shard.py "$LIST_FILE" "$SHARD" "$SHARDS" 2>/dev/null | cut -f1 | sort || true)"
          if [ -n "$ids" ]; then
            n="$(printf '%s\n' "$ids" | wc -l | tr -d ' ')"
            first="$(printf '%s\n' "$ids" | head -1 | tr -cd 'A-Za-z0-9_')"
            h="$(printf '%s' "$ids" | sha1sum | cut -c1-10)"
            # ⛔ `if` لا `[ … ] && …`: الثانيةُ تُرجع 1 عند فشل الشرط، و`set -e`
            #    الضمنيّةُ في خطوات `run` تُسقط العدّاءَ كلَّه على وسمِ كاشٍ لا غير.
            if [ -n "$first" ]; then tag="${first}.${n}.${h}"; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "هويّةُ كاشِ الشريحة $SHARD/$SHARDS ⇐ r$tag"
          printf '  قرّاؤها: %s\n' "$(printf '%s' "$ids" | tr '\n' ' ')"

      - name: استعادة العمل الجزئي
        id: workcache
        uses: actions/cache/restore@v4
        with:
          path: tools/alignment/work
          key: align-work-ac${{ env.WHISPER_AC }}-vad${{ env.VAD_VERSION }}-r${{ steps.ckey.outputs.tag }}-${{ github.run_id }}
          restore-keys: |
            align-work-ac${{ env.WHISPER_AC }}-vad${{ env.VAD_VERSION }}-r${{ steps.ckey.outputs.tag }}-
            align-work-ac${{ env.WHISPER_AC }}-vad${{ env.VAD_VERSION }}-${{ matrix.shard }}-

      - name: تشغيل السائق
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ github.event.inputs.smoke == 'true' && '1' || github.event.inputs.shards }}
          JOBS: ${{ github.event.inputs.jobs_per_runner }}
          SMOKE: ${{ github.event.inputs.smoke }}
          SMOKE_RECITER: ${{ github.event.inputs.smoke_reciter }}
          SMOKE_SURAHS: ${{ github.event.inputs.smoke_surahs }}
          # ⛔ المكتبات المشتركة بجوار الثنائي لا في مسار النظام ⇒ يلزم
          #    تصديرها للعملية الابنة، وإلا فـ`exit 127` على كل سورة.
          LD_LIBRARY_PATH: ${{ github.workspace }}/assets-archive/ggml/bin/Release
          LIST: /root/QuranRafiq/tools/ci_fleet/${{ github.event.inputs.list }}
          # ⛔ الوصفة المعتمدة (D-176/D-178/D-179): إعادةُ محاذاةٍ مقصودة،
          #    ورفعُ ما يردّه حارسُ HIGH موسوماً ليُحكم عليه بالقياس لا بالمؤشِّر،
          #    وصقلٌ بالنموذج الأدقّ على القصاصات وحدَها.
          # ⛔⛔ **وأثرُه أنّ حارسَ «منجَزٌ سلفاً» (`run_shard.sh:109`) لا يسري في
          #    أيّ موجة** — المكتوبُ عنده «يُطلبه المشغّلُ عمداً ولا يقع سهواً»،
          #    والواقعُ أنه **مثبَّتٌ هنا دائماً**. والتثبيتُ صوابٌ لهذه الموجات
          #    (‏أكثرُ قرّائها لهم بصمةُ جيلٍ أوّل في `timings-staging/`)، **فالحارسُ
          #    ينتقل إلى التوليد**: `tools/ci_fleet/prune_certified.py <القائمة> --yes`
          #    **قبل كلّ إطلاق**. وكلفةُ إهمالِها مقيسةٌ 2026-09-08: شريحةٌ كاملةٌ
          #    من عشرين أعادت بناءَ `mrifai` المشهودِ قبل الإطلاق بثلاثين دقيقة.
          FORCE_REALIGN: "1"
          STAGE_LOW_HIGH: "1"
          ALIGN_REFINE: "1"
          REFINE_MODEL: ${{ github.workspace }}/assets-archive/ggml/ggml-refine-q8_0.bin
          REFINE_DTW: base
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash tools/ci_fleet/run_shard.sh

      # ⛔ الحفظ بـ`if: always()` — وهو مقصد الفصل كله: الشريحة تُقتل غالباً
      #    بسقف الست ساعات لا تنتهي بنجاح، فحفظٌ عند النجاح وحده = لا حفظ أبداً.
      #    ومفتاح الحفظ يحمل رقم التشغيل، و`restore-keys` أعلاه تلتقط أحدث
      #    كاشٍ **لقرّاء هذه الشريحة** بالوصفة نفسها — فيستأنف التالي ما بلغه
      #    السابق **ولو تغيّرت خانتُه في القائمة** (‏انظر تعليقَ `ckey` أعلاه).
      - name: حفظ العمل الجزئي (ولو قُتلت الشريحة)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/alignment/work
          key: align-work-ac${{ env.WHISPER_AC }}-vad${{ env.VAD_VERSION }}-r${{ steps.ckey.outputs.tag }}-${{ github.run_id }}

      - name: السجلات مخرَجاً (تُقرأ حتى عند السقوط)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-shard-${{ matrix.shard }}
          path: |
            /root/QuranRafiq/logs-copy/**
            tools/alignment/work/timings_*.jz
          if-no-files-found: warn
          retention-days: 7
