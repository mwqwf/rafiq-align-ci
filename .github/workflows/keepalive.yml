name: rafiq-keepalive

run-name: نبّاضٌ سحابيّ — يُبقي الأسطولَ يعمل بلا جهاز المالك

# ⛔⛔ **لماذا كُسر منعُ التشغيل التلقائيّ هنا وحدَه (أمر المالك 2026-09-10):**
# «يجب أن لا يتوقف حتى بتوقف النت». والموجاتُ تنجو من انطفاء الجهاز لأنها تعمل
# على عدّائي GitHub، **لكنّ مُطلِقَها كان محلّيّاً** — مهمّةٌ مجدولةٌ على جهاز
# المالك تُدلي `workflow_dispatch`. فلمّا انطفأ الجهازُ 2026-09-09 **توقّف
# الأسطولُ كلُّه من 15:22 إلى 08:40** لا لعطبٍ بل لأنّ أحداً لم يُطلق التالي،
# وضاعت ساعاتُ عدّاءٍ مجّانيّة بلا سببٍ تقنيّ.
#
# ⛔ **والمنعُ الأصليّ يبقى قائماً حيث وُضع:** لا `push` ولا `cron` في `align.yml`
#    ولا `audio_qa.yml` ولا غيرِهما — فسببُ المنع أن يبقى **إطلاقُ العمل بيدٍ
#    تعرف ما تُطلق**. وهذا الملفُّ لا ينقض ذلك بل يحصره: **لا يعمل شيئاً بنفسه،
#    وإنما يسأل «هل ثمّة موجةٌ جارية؟» فإن لم تكن أطلق واحدةً بالقائمة المكتوبة
#    هنا**. فاليدُ ما زالت تعرف، وإنما صارت لا تنام.
#
# ⛔ **وحارسُ الانفلات مقصود:** لا يُطلق إن كانت موجةٌ جاريةً **أو منتظرة**،
#    فمجموعةُ التزامن تسع منتظرةً واحدةً فقط ودفعُ ثانيةٍ يطردها (قِيس 09-09).

on:
  schedule:
    # كلَّ ساعة. ⛔ وليست كلَّ ربع: الموجةُ الواحدة تعمل ساعاتٍ، والنبضُ الكثيف
    #    لا يزيد إنتاجاً وإنما يزيد نداءات API ومخاطرَ السباق.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      list:
        description: "القائمةُ التي تُطلق عند وجود فراغ"
        default: "reciters_qw_new2.tsv"

permissions:
  actions: write        # ⛔ لازمةٌ لإدلاء workflow_dispatch من داخل العدّاء
  contents: read

# ⛔ نبضةٌ واحدةٌ في كلّ حين: السلسلةُ والجدولةُ قد تلتقيان، ونبضتان معاً
#    تُطلقان موجتين وتبوّبان المفاتيحَ نفسَها مرّتين. `cancel-in-progress: false`
#    فلا تُقتل نبضةٌ تعمل — تُترك الثانيةُ معلّقةً أو تسقط.
concurrency:
  group: rafiq-keepalive
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: هل الأسطولُ فارغ؟
        id: gap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # ⛔ **يُعدّ المعلَّقُ مشغولاً كالجاري**: تشغيلةٌ منتظرةٌ ستعمل حتماً،
          #    وإطلاقُ ثانيةٍ يطردها من الطابور فيضيع ما كان سيبدأ وحدَه.
          BUSY=$(gh run list --workflow=align.yml --limit 20 \
                   --json status --jq '[.[]|select(.status!="completed")]|length')
          echo "جاريةٌ أو منتظرة: $BUSY"
          echo "busy=$BUSY" >> "$GITHUB_OUTPUT"

      - name: أطلق موجةً عند الفراغ
        if: steps.gap.outputs.busy == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIST: ${{ github.event.inputs.list || 'reciters_rest8.tsv' }}
        run: |
          set -e
          # ⛔ **والقائمةُ تُفحص قبل أن تُطلق**: قائمةٌ غائبةٌ تُنتج موجةً تموت
          #    في أوّل خطوةٍ وتبدو في اللوحة «جارية» — والإعلانُ ليس أثراً.
          test -f "tools/ci_fleet/$LIST" || { echo "⛔ لا وجود لـ$LIST"; exit 1; }
          echo "▶ الأسطولُ فارغ — تُطلق $LIST"
          gh workflow run align.yml \
            -f shards=12 -f jobs_per_runner=4 -f smoke=false -f list="$LIST"

      - name: خلاصة
        run: |
          if [ "${{ steps.gap.outputs.busy }}" = "0" ]; then
            echo "🚀 كان فارغاً فأُطلقت موجة."
          else
            echo "✅ الأسطولُ يعمل (${{ steps.gap.outputs.busy }} تشغيلة) — لا تدخّل."
          fi

  # ⛔⛔ **ولا تكفي الموجاتُ وحدَها:** أمر المالك «حتى لو توقف الجهاز الآن لا
  #    يتوقف شيء». والموجةُ تُنتج بصماتٍ في المسرح، فإن لم يحكم عليها أحدٌ ولم
  #    يرقِّ العابرَ **تراكمت بلا فائدة** — يعمل الأسطولُ ولا يزيد المنشورُ
  #    واحداً. فهذه الوظيفةُ تُتمّ الحلقة: تحكم ثم ترقّي، في السحابة.
  gate_and_promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --quiet boto3

      - name: الاعتماد
        env:
          R2_CREDENTIALS_JSON: ${{ secrets.R2_CREDENTIALS_JSON }}
        run: |
          mkdir -p secure
          printf '%s' "$R2_CREDENTIALS_JSON" > secure/r2_credentials.json

      - name: بصماتٌ بلا حكمٍ كافٍ
        id: scan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, boto3, collections
          c = json.load(open("secure/r2_credentials.json"))
          s = boto3.client("s3", endpoint_url=c["endpoint"],
                           aws_access_key_id=c["accessKeyId"],
                           aws_secret_access_key=c["secretAccessKey"],
                           region_name="auto")
          b = c["bucket"]
          def keys(p):
              return [o["Key"] for pg in s.get_paginator("list_objects_v2")
                      .paginate(Bucket=b, Prefix=p) for o in pg.get("Contents", [])]
          staged = [k for k in keys("timings-staging/")
                    if k.endswith(".jz") and "/tmp/" not in k]
          # ⛔ **يُعدّ الحكمُ بعدد الأملاح لا بوجود شاهد**: شاهدٌ واحد لا يكفي
          #    للتجميع (D-098)، فبصمةٌ لها ملحٌ واحد ما زالت «بلا حكمٍ كافٍ».
          salts = collections.Counter()
          for k in keys("state-ci"):
              base = k.rsplit("/", 1)[-1].replace(".json", "")
              salts[base] += 1
          # ⛔⛔ **أحدثُ بصمةٍ لكلّ قارئ لا كلُّ بصماته** (‏قِيس في أوّل تشغيلة
          #    2026-09-10): ابتلع `deban_douri` بخمسِ بصماتٍ متروكةٍ و`husary_douri`
          #    باثنتين **الدفعةَ السبعَ كلَّها** — فحُكم على مرشّحين ميّتين وبقي
          #    الأحياءُ بلا حكم. والبصمةُ القديمةُ لا تُرقّى أبداً لأنّ أحدثَ منها
          #    قائم، فكلُّ عدّاءٍ يُنفق عليها ضائعٌ بيقين.
          mtime = {}
          for pg in s.get_paginator("list_objects_v2").paginate(
                  Bucket=b, Prefix="timings-staging/"):
              for o in pg.get("Contents", []):
                  mtime[o["Key"]] = o["LastModified"]
          newest = {}
          for k in staged:
              parts = k.split("/")
              if len(parts) < 3:
                  continue
              rid = parts[2].split(".")[0]
              who = (parts[1], rid)
              if who not in newest or mtime.get(k, 0) > mtime.get(newest[who], 0):
                  newest[who] = k
          need = [k for k in sorted(newest.values())
                  if salts.get(k.replace("/", "_"), 0) < 4]
          # ⛔ **وحدٌّ على الدفعة**: سبعةٌ في نداءٍ واحد ⇒ 5 تشغيلاتٍ فقط
          #    (مطالع + أربعة أملاح)، ويبقى للموجة متّسعُها من الحصة العشرين.
          # ⛔ **الحدُّ رُفع من 7 إلى 14 (2026-09-10)**: قِيس أنّ الأسطولَ يعمل
          #    بتشغيلةٍ واحدةٍ والحصّةُ عشرون — أي **خمسَ عشرةَ فتحةً معطَّلة**.
          #    والدفعةُ الواحدة مهما كبرت تكلّف **خمسَ تشغيلاتٍ فقط** (مطالعٌ
          #    وأربعةُ أملاح) لأنّ المفاتيح تُمرَّر مفصولةً بفواصل في نداءٍ واحد.
          #    ⇒ أربعَ عشرةَ بصمةً في خمس تشغيلات، ويبقى للموجة متّسعُها.
          batch = sorted(need)[:14]
          print("need=" + ",".join(batch))
          print(f"count={len(batch)}")
          PY

      - name: أطلق الأحكام
        if: steps.scan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          K: ${{ steps.scan.outputs.need }}
        run: |
          set -e
          echo "▶ يُحكم على: $K"
          gh workflow run openers.yml -f only="$K" -f limit=8
          for s in k1 k2 k3 k4; do
            gh workflow run audio_qa.yml -f only="$K" -f seed_salt="$s" -f limit=20
          done

      - name: رقِّ من عبر
        # ⛔ **وتُشغَّل دائماً**: أحكامُ النبضة السابقة تنضج بين النبضتين،
        #    فالترقيةُ لا تنتظر حكماً أطلقناه للتوّ (لن يكتمل قبل انتهائنا).
        run: |
          set -e
          python tools/index_qa/promote.py --yes 2>&1 | tail -25 || true
          # ⛔ **ولا تُرفع تجميداتٌ ولا تُتجاوز أحكامٌ من هنا**: `--unfreeze`
          #    و`--override` و`--allow-truncated` كلُّها تحتاج **سبباً مكتوباً
          #    يذكر أرقاماً قِيست**، وسببٌ تكتبه آلةٌ بلا قياسٍ هو تزويرٌ لا حوكمة.
          #    فيبقى ذلك للجلسة، وتكتفي النبضةُ بما لا يحتاج عذراً.
          echo "ℹ️ ما يحتاج سبباً مكتوباً يبقى للجلسة — انظر docs/ops/RESUME_NOW.md"

      - name: ⚡ اجرد ما ينتظر قراراً بشريّاً
        # ⛔ **الغرض: ألّا يضيع المحبوسُ في السجلّات.** الحلقةُ تُنتج بلا توقّف،
        #    فإن حُبس مرشَّحٌ لسببٍ يحتاج قراراً **ولم يُجرد**، بقي محبوساً أبداً
        #    وهو لا يُرى إلا لمن يقرأ سجلَّ ترقيةٍ قديم.
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, boto3, collections
          c = json.load(open("secure/r2_credentials.json"))
          s = boto3.client("s3", endpoint_url=c["endpoint"],
                           aws_access_key_id=c["accessKeyId"],
                           aws_secret_access_key=c["secretAccessKey"],
                           region_name="auto")
          b = c["bucket"]
          per = collections.Counter()
          for pg in s.get_paginator("list_objects_v2").paginate(
                  Bucket=b, Prefix="state-ci"):
              for o in pg.get("Contents", []):
                  try:
                      j = json.loads(s.get_object(Bucket=b, Key=o["Key"])["Body"].read())
                  except Exception:
                      continue
                  v = str(j.get("verdict") or "")
                  if v.startswith("مقبول"):
                      continue
                  kind = ("خلل بنيوي" if "بنيوي" in v else
                          "عطبٌ جسيم" if "جسيم" in v else
                          "حدّي" if "حدّي" in v else
                          "موقوف" if "موقوف" in v else "آخر")
                  per[kind] += 1
          print("## ⚡ ما ينتظر قراراً")
          for k, n in per.most_common():
              print(f"- {k}: {n} شاهداً")
          PY

      # ⛔ **الجدولةُ وحدها لا تكفي** (مقيسٌ 2026-09-11): نبضاتُ `schedule` على
      #    GitHub تتأخّر وتُسقَط — رُصدت فجواتٌ 2.5س و5س بين نبضاتٍ «كلَّ ساعة».
      #    والمالكُ يُغلق جهازَه ⇒ **لا مُوقِظَ محلّيّ**. فيُسلسل النبضُ نفسَه:
      #    ينتظر ربعَ ساعةٍ ثمّ يستدعي نفسَه مرّةً واحدة. ولا انفلاتَ: مجموعةُ
      #    التزاحم تمنع تراكبَ نبضتين، ودقائقُ المستودع العامّ بلا حدّ.
      - name: سلسلةُ النبض — لا تعتمد على الجدولة وحدها
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 900
          gh workflow run keepalive.yml -R "$GITHUB_REPOSITORY" || \
            echo "⚠️ تعذّرت سلسلةُ النبض — تبقى الجدولةُ سنداً"
