name: rafiq-source-context-diagnostics
run-name: Diagnose source contexts and identify long Tblawi recording

# يدوي فقط، لا R2 أو أسرار أو artifacts أو cache-save؛ عداء قياسي ومستودع عام محدد.
# القرآن غير موجود في cache المقيس: التنزيل المؤقت المثبت خيار صريح، بلا fallback.
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [penultimate-tails-1680, penultimate-tails-1640, tail-followup-1490, tail-followup-1460, tail-followup-1420, tail-followup-1350, tail-followup-1300, tail-followup-1260, tail-followup-1200, tail-followup-1170, expanded-short-tails-2, iraoui-new-contexts, expanded-short-tails, short-final, initial, koshi, saad-tail, recovery-middle, sham-midad, mab-rs1, opener-tails, rejected-boundaries, benkirane-tails, hazmi-tails, expanded-rejections, mab-adjacent, mukhtar-rejections, benkirane-middle, final-rejections, tblawi-new, obk-new, mab-v3-rejections, balilah-tail-boundary, mab-v4-adjacent, iraoui-prefix-free]
        default: initial
        required: true
      model_policy:
        description: سياسة النموذج القرآني المثبت؛ generic من cache الموجود فقط
        type: choice
        options:
          - cache-only
          - quran-pinned-ephemeral
        default: cache-only
        required: true

permissions:
  contents: read

concurrency:
  group: rafiq-source-context-diagnostics-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: inspect ${{ matrix.reader }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        reader: ${{ fromJSON(inputs.profile == 'penultimate-tails-1680' && '["penultimate_hafs_bader_88","penultimate_hafs_h_dukhain_53","penultimate_hafs_i_sanankoua_80","penultimate_hafs_jormy_80","penultimate_hafs_m_harfoush_80","penultimate_hafs_m_harfoush_89","penultimate_hafs_s_hashemi_80","penultimate_hafs_trabulsi_74","penultimate_hafs_twfeeq_88","penultimate_qalun_janaini_qalun_80","penultimate_qalun_trablsi_112","penultimate_warsh_bl3_warsh_83","penultimate_warsh_chahboun_warsh_77","penultimate_warsh_masarawy_warsh_89"]' || inputs.profile == 'penultimate-tails-1640' && '["penultimate_douri_sultani_douri_80","penultimate_hafs_a_abdl_37","penultimate_hafs_a_binaoun_83","penultimate_hafs_abdullahk_89","penultimate_hafs_alosfor_88","penultimate_hafs_asim_54","penultimate_hafs_asim_83","penultimate_qalun_gardeli_qalun_54","penultimate_qalun_gardeli_qalun_75","penultimate_warsh_gharbi_warsh_113"]' || inputs.profile == 'tail-followup-1490' && '["harraz53_start32_35"]' || inputs.profile == 'tail-followup-1460' && '["qurashi89_tail_24_30"]' || inputs.profile == 'tail-followup-1420' && '["harraz53_33_43","harraz53_42_52","muftah53_last51_52"]' || inputs.profile == 'tail-followup-1350' && '["sayed53_tail_39_52","muftah53_tail_39_52","muftah53_final61_62","alqrafi89_boundary28"]' || inputs.profile == 'tail-followup-1300' && '["nabil91_final15"]' || inputs.profile == 'tail-followup-1260' && '["balilah69_disputed25_27"]' || inputs.profile == 'tail-followup-1200' && '["sayed53_tail_51_62","muftah53_tail_51_62","alqrafi89_tail_24_30","darweez89_tail_24_30","suhaim91_final15"]' || inputs.profile == 'tail-followup-1170' && '["iraoui41_new_50_full","iraoui41_new_head_1_4","alijon89_eof_24_30","harraz44_tail_40_50","harraz44_tail_49_57","harraz44_tail_52_59","harraz53_tail_51_62"]' || inputs.profile == 'expanded-short-tails-2' && '["short_final_laghdaf69_43_52","short_final_yahya68_45_52"]' || inputs.profile == 'iraoui-new-contexts' && '["iraoui41_new_15_16","iraoui41_new_44","iraoui41_new_47_48","iraoui41_new_49_50","iraoui41_new_51_52","iraoui41_new_53_54"]' || inputs.profile == 'expanded-short-tails' && '["short_final_badr56_79_87","short_final_badr56_87_96","short_final_deban80_33_42"]' || inputs.profile == 'short-final' && '["short_final_shuba_deban_shuba_89","short_final_hafs_a_albadr_56","short_final_hafs_deban_80","short_final_hafs_hamza_52","short_final_warsh_laghdaf_shinqiti_69","short_final_hafs_yahya_68","short_final_qalun_fakhfakh_qalun_38","short_final_hafs_lahoni_89","short_final_hafs_m_qari_87","short_final_warsh_harraz_warsh_44","short_final_warsh_harraz_warsh_53","short_final_hafs_wdee3_89","short_final_douri_deban_douri_89","short_final_qalun_noah_qalun_93","short_final_hafs_alijon_89","short_final_hafs_muftah_sultany_77","short_final_hafs_sayed_53","short_final_hafs_m_qari_105","short_final_hafs_mohsin_harthi_91","short_final_hafs_a_alqrafi_89","short_final_hafs_darweez_89","short_final_hafs_h_abudalal_89","short_final_hafs_muftah_sultany_53","short_final_qalun_suhaim_qalun_91","short_final_hafs_m_alfaqih_89","short_final_warsh_kholti_warsh_91","short_final_hafs_deban_89","short_final_hafs_sayed_91","short_final_qalun_qeniwa_qalun_94","short_final_hafs_qurashi_89","short_final_hafs_nabil_91"]' || inputs.profile == 'iraoui-prefix-free' && '["iraoui41_free_1","iraoui41_free_2","iraoui41_free_3","iraoui41_free_4","iraoui41_free_5"]' || inputs.profile == 'mab-v4-adjacent' && '["mab_v4_11_93","mab_v4_23_107"]' || inputs.profile == 'mab-v3-rejections' && '["mab_v3_11_56","mab_v3_11_91","mab_v3_11_122","mab_v3_16_16","mab_v3_23_105","mab_v3_23_113_114","mab_v3_23_117"]' || inputs.profile == 'balilah-tail-boundary' && '["balilah69_tail_transition"]' || inputs.profile == 'obk-new' && '["obk1_new_full"]' || inputs.profile == 'tblawi-new' && '["tblawi7_new_head","tblawi7_new_middle","tblawi7_new_tail"]' || inputs.profile == 'final-rejections' && '["rabbani56_tail","rabbani96_5_10","mukhtar37_20_22"]' || inputs.profile == 'benkirane-middle' && '["benkirane77_26_28"]' || inputs.profile == 'mukhtar-rejections' && '["mukhtar37_19","mukhtar37_25","mukhtar37_84","mukhtar37_153","mukhtar37_163","mukhtar37_166"]' || inputs.profile == 'mab-adjacent' && '["mab78_32_36","mab90_4_8","mab90_10_14"]' || inputs.profile == 'expanded-rejections' && '["rabbani_warsh_77_expanded","rabbani_warsh_96_expanded","hatem_54_expanded","hatem_82_expanded","m_abdulkareem_warsh_69_expanded"]' || inputs.profile == 'hazmi-tails' && '["hazmi67_23_26","hazmi67_tail","hazmi77_tail"]' || inputs.profile == 'benkirane-tails' && '["benkirane77_tail","benkirane51_middle","benkirane51_tail"]' || inputs.profile == 'rejected-boundaries' && '["saad_reject_22_27","saad_reject_22_52","saad_reject_22_62","saad_reject_28_21","saad_reject_28_67","hazmi67_23_26","hazmi67_tail","hazmi77_tail"]' || inputs.profile == 'opener-tails' && '["mrifai84_tail","yousef107_tail"]' || inputs.profile == 'mab-rs1' && '["mab_rs1_16_9","mab_rs1_11_22","mab_rs1_18_90","mab_rs1_23_52","mab_rs1_23_79","mab_rs1_69_47","mab_rs1_90_11","mab_rs1_90_19","mab_rs1_90_5","mab_rs1_78_33"]' || inputs.profile == 'sham-midad' && '["shamrani79_midad_middle"]' || inputs.profile == 'recovery-middle' && '["saad22_41_45","saad22_68_71","saad22_tail","shamrani79_middle"]' || inputs.profile == 'saad-tail' && '["saad28_tail"]' || inputs.profile == 'koshi' && '["koshi20_22","koshi94_96"]' || '["saad28_context","saad45_tail","shamrani79_tail","tblawi_head","tblawi_tail","m_ab26_29","m_ab34_37","m_ab91_95"]') }}
    if: ${{ github.repository == 'mwqwf/rafiq-align-ci' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_XET: '1'
      CTC_THREADS: '2'
      CTC_INT8: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PIP_NO_CACHE_DIR: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
      - name: استعادة المفتاح الموجود فقط دون حفظ
        id: models
        uses: actions/cache/restore@v4
        with:
          path: .hf
          key: ctc-model-jonatasgrosman-xlsr53-ar-v1
          fail-on-cache-miss: true
      - name: تثبيت نسخ الاستدلال المحددة على قرص العداء المؤقت
        run: |
          python tools/ci_fleet/install_qa_ffmpeg.py
          python -m pip install --only-binary=:all: --timeout 60 --retries 2 --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0+cpu'
          python -m pip install --only-binary=:all: --timeout 60 --retries 2 'numpy==1.26.4' 'transformers==4.49.0' 'huggingface-hub==0.29.3' 'safetensors==0.5.3' 'tokenizers==0.21.1'
          python -m pip install --only-binary=:all: --timeout 60 --retries 2 boto3 soundfile rapidfuzz
          python -m pip install --timeout 60 --retries 2 ctc-segmentation
      - name: اختبارات اصطناعية بلا نماذج أو شبكة
        run: python -m unittest tools.index_qa.test_final_verse_free_batch tools.index_qa.test_saad_free_decode -v
      - name: تفريغ L/R الحر بكلا النموذجين وطباعته كاملاً في السجل
        env:
          SAAD_CACHE_EXACT_HIT: ${{ steps.models.outputs.cache-hit }}
          SAAD_MODEL_POLICY: ${{ inputs.model_policy }}
          DIAGNOSTIC_READER: ${{ matrix.reader }}
        run: python tools/index_qa/source_context_diagnostics.py --reader "$DIAGNOSTIC_READER" --model-policy "$SAAD_MODEL_POLICY"
